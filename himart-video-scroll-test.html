<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIMART Video Scroll Test</title><link rel="stylesheet" href="./assets/css/himart-video-test.css"><style>body{margin:0;background:#000;color:#fff}.test-content{position:relative;z-index:10;background:#000;padding:120px 8vw}.test-section{min-height:70vh;opacity:0;transform:translateY(80px);transition:.8s}.test-section.show{opacity:1;transform:none}.test-title{font-size:clamp(36px,5vw,72px);font-weight:200}.test-sub{font-size:32px;font-weight:200;margin-top:80px}</style></head><body class="himart-video-test-page"><div class="hm-video-hero-stage"><div class="hm-video-fixed"><video class="hm-video-media" autoplay muted loop playsinline><source src="./assets/video/himart_01.mp4" type="video/mp4"></video><div class="hm-video-overlay-base"></div><div class="hm-video-overlay-scroll"></div></div></div><main class="test-content"><section class="test-section"><div>01</div><h1 class="test-title shuffle">구매 여정 전체를 다시 정의하다</h1><h2 class="test-sub shuffle">01.1 고객이 찾는 순간부터 경험을 분석했습니다.</h2></section><section class="test-section"><div>02</div><h1 class="test-title shuffle">데이터 기반으로 문제를 재정의하다</h1><h2 class="test-sub shuffle">02.1 행동 데이터를 통해 전환 접점을 확인했습니다.</h2></section><section class="test-section"><div>03</div><h1 class="test-title shuffle">경험 구조를 새롭게 설계하다</h1><h2 class="test-sub shuffle">03.1 탐색과 선택의 흐름을 단순화했습니다.</h2></section><section class="test-section"><div>04</div><h1 class="test-title shuffle">온라인과 오프라인을 연결하다</h1><h2 class="test-sub shuffle">04.1 하이마트만의 강점을 경험으로 확장했습니다.</h2></section></main><script>const o=document.querySelector('.hm-video-overlay-scroll');window.addEventListener('scroll',()=>{o.style.opacity=Math.pow(Math.min(scrollY/700,1),.35)*.85});const c='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';function s(e){if(e.dataset.done)return;e.dataset.done=1;let t=e.textContent,i=0,x=setInterval(()=>{e.textContent=[...t].map((a,n)=>a===' '? ' ':n<i?a:c[Math.floor(Math.random()*c.length)]).join('');if(++i>t.length){e.textContent=t;clearInterval(x)}},45)}document.querySelectorAll('.test-section').forEach(a=>new IntersectionObserver(b=>{if(b[0].isIntersecting){a.classList.add('show');a.querySelectorAll('.shuffle').forEach(s)}},{threshold:.3}).observe(a));</script></body></html>
