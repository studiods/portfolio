<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIMART Video Scroll Test</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;color:#fff;font-family:Pretendard,Arial,sans-serif}
body{overflow-x:hidden}
.hero{height:100vh;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.black-layer{position:absolute;inset:0;background:#000;opacity:.5;pointer-events:none}
.hero-title{position:relative;z-index:2;font-size:64px;font-weight:200;text-align:center;padding:0 24px}
.scroll-space{height:80vh;background:#000}
.content{position:relative;background:#000;padding:120px 8vw}
.section{min-height:70vh;opacity:0;transform:translateY(80px);transition:opacity 1s cubic-bezier(.16,.8,.22,1),transform 1s cubic-bezier(.16,.8,.22,1)}
.section.show{opacity:1;transform:translateY(0)}
.index{font-size:20px;color:#f4d867}
.title{margin-top:20px;font-size:56px;font-weight:200;line-height:1.25}
.small{margin-top:80px;font-size:34px;font-weight:200;line-height:1.45}
.shuffle{display:inline-block}
.video-error{position:absolute;z-index:3;left:24px;bottom:24px;font-size:13px;color:rgba(255,255,255,.7);display:none}
@media(max-width:760px){.hero-title{font-size:38px}.title{font-size:38px}.small{font-size:26px}.content{padding:90px 20px}}
</style>
</head>
<body>
<section class="hero">
<video id="heroVideo" autoplay muted loop playsinline preload="auto">
<source src="assets/video/himart_01.mp4" type="video/mp4">
</video>
<div class="black-layer"></div>
<div class="hero-title">하이마트 구매 여정을 다시 설계합니다.</div>
<div class="video-error">VIDEO LOAD ERROR</div>
</section>
<div class="scroll-space"></div>
<main class="content">
<section class="section"><div class="index">01</div><div class="title shuffle">구매 여정 전체를 다시 정의하다</div><div class="small shuffle">01.1 고객이 찾는 순간부터 경험을 분석했습니다.</div></section>
<section class="section"><div class="index">02</div><div class="title shuffle">데이터 기반으로 문제를 재정의하다</div><div class="small shuffle">02.1 행동 데이터를 통해 전환 접점을 확인했습니다.</div></section>
<section class="section"><div class="index">03</div><div class="title shuffle">경험 구조를 새롭게 설계하다</div><div class="small shuffle">03.1 탐색과 선택의 흐름을 단순화했습니다.</div></section>
<section class="section"><div class="index">04</div><div class="title shuffle">온라인과 오프라인을 연결하다</div><div class="small shuffle">04.1 하이마트만의 강점을 경험으로 확장했습니다.</div></section>
</main>
<script>
const layer=document.querySelector('.black-layer');
const video=document.getElementById('heroVideo');
const videoError=document.querySelector('.video-error');
video.addEventListener('error',()=>{videoError.style.display='block';});
video.play().catch(()=>{});
window.addEventListener('scroll',()=>{const p=Math.min(window.scrollY/700,1);layer.style.opacity=.5+Math.pow(p,.35)*.4;},{passive:true});
const chars="ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
function shuffleText(el){if(el.dataset.done)return;el.dataset.done="1";const text=el.textContent;let count=0;const timer=setInterval(()=>{el.textContent=[...text].map((c,i)=>c===" "?" ":count>i?c:chars[Math.floor(Math.random()*chars.length)]).join("");count++;if(count>text.length){el.textContent=text;clearInterval(timer);}},45);}
const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');e.target.querySelectorAll('.shuffle').forEach(shuffleText);}})},{threshold:.35});
document.querySelectorAll('.section').forEach(s=>observer.observe(s));
</script>
</body>
</html>
