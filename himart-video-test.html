<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하이마트 온라인 구매여정 · Video Hero Test</title>
<style>html,body{margin:0;background:#000;color:#fff}.boot{min-height:100vh;background:#000}</style>
</head>
<body><div class="boot" aria-hidden="true"></div>
<script>
(()=>{
  'use strict';

  const HERO_HTML=`<header class="hm-hero hm-video-hero-stage" id="top">
    <div class="hm-video-sticky" id="hmVideoSticky">
      <video class="hm-video-media" id="hmHeroVideo" src="./assets/video/himart_01.mp4" autoplay muted loop playsinline preload="auto" aria-label="롯데하이마트 영상"></video>
      <div class="hm-video-overlay-base" aria-hidden="true"></div>
      <div class="hm-video-overlay-gradient" aria-hidden="true"></div>
      <div class="hm-video-overlay-scroll" aria-hidden="true"></div>
      <div class="hm-video-frame">
        <div class="hm-video-copy">
          <div class="hm-kicker">LOTTE HIMART / COMMERCE JOURNEY / 2024—NOW</div>
          <h1 class="hm-title js-scramble">하이마트 온라인 전체 구매 여정을<br>처음부터 재설계했습니다.</h1>
          <p class="hm-lead">화면 개선부터 시작하지 않았습니다. 고객 인식과 실제 유입·탐색·이탈을 확인한 뒤 전체 구매 여정의 역할을 다시 정의했습니다.</p>
        </div>
        <div class="hm-meta hm-video-meta">
          <div><span>ROLE</span><b>UX STRATEGY · UX PLANNING · EXPERIENCE DESIGN · UX DIRECTION</b></div>
          <div><span>FOCUS</span><b>COMMERCE JOURNEY · HOME · SEARCH · PDP</b></div>
          <div><span>SCOPE</span><b>RESEARCH · STRATEGY · DESIGN DIRECTION</b></div>
          <div><span>TEAM</span><b>UX DESIGN · PO · BUSINESS</b></div>
        </div>
      </div>
    </div>
  </header>`;

  const PATCH_STYLE=`<style id="himart-video-hero-test-style">
    html,body{background:#000!important}
    body.himart-video-test-page{background:#000!important}
    body.himart-video-test-page #live-main{overflow:visible!important;background:#000!important}

    body.himart-video-test-page .hm-video-hero-stage{
      position:relative!important;
      width:100%!important;
      height:200vh!important;
      min-height:200vh!important;
      margin:0!important;
      padding:0!important;
      background:#000!important;
      overflow:visible!important;
    }
    body.himart-video-test-page .hm-video-sticky{
      --hm-video-blackout:0;
      position:sticky!important;
      top:0!important;
      width:100vw!important;
      height:100vh!important;
      min-height:100vh!important;
      overflow:hidden!important;
      background:#000!important;
    }
    body.himart-video-test-page .hm-video-media{
      position:absolute!important;
      inset:0!important;
      z-index:1!important;
      display:block!important;
      width:100%!important;
      height:100%!important;
      object-fit:cover!important;
      object-position:center center!important;
      background:#000!important;
    }
    body.himart-video-test-page .hm-video-overlay-base{
      position:absolute!important;
      inset:0!important;
      z-index:2!important;
      background:rgba(0,0,0,.70)!important;
      pointer-events:none!important;
    }
    body.himart-video-test-page .hm-video-overlay-gradient{
      position:absolute!important;
      inset:0!important;
      z-index:3!important;
      background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 70%,rgba(0,0,0,.38) 82%,rgba(0,0,0,.72) 91%,#000 100%)!important;
      pointer-events:none!important;
    }
    body.himart-video-test-page .hm-video-overlay-scroll{
      position:absolute!important;
      inset:0!important;
      z-index:4!important;
      background:#000!important;
      opacity:var(--hm-video-blackout)!important;
      pointer-events:none!important;
      will-change:opacity!important;
    }
    body.himart-video-test-page .hm-video-frame{
      position:absolute!important;
      inset:0 auto 0 50%!important;
      z-index:5!important;
      width:min(1440px,100vw)!important;
      height:100%!important;
      padding:0 48px!important;
      transform:translateX(-50%)!important;
      box-sizing:border-box!important;
      pointer-events:none!important;
    }
    body.himart-video-test-page .hm-video-copy{
      position:absolute!important;
      left:48px!important;
      top:clamp(96px,11vh,128px)!important;
      width:min(1080px,calc(100% - 96px))!important;
    }
    body.himart-video-test-page .hm-video-copy .hm-kicker{
      margin:0 0 26px!important;
      color:rgba(255,255,255,.60)!important;
      font-size:12px!important;
      line-height:1.2!important;
      letter-spacing:.02em!important;
    }
    body.himart-video-test-page .hm-video-copy .hm-title{
      margin:0!important;
      max-width:1080px!important;
      color:#fff!important;
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
      font-size:clamp(52px,4.55vw,68px)!important;
      font-weight:100!important;
      line-height:1.05!important;
      letter-spacing:-.05em!important;
      word-break:keep-all!important;
    }
    body.himart-video-test-page .hm-video-copy .hm-lead{
      margin:30px 0 0!important;
      max-width:960px!important;
      color:rgba(255,255,255,.58)!important;
      font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;
      font-size:17px!important;
      font-weight:300!important;
      line-height:1.58!important;
      letter-spacing:-.025em!important;
      word-break:keep-all!important;
    }
    body.himart-video-test-page .hm-video-meta{
      position:absolute!important;
      left:48px!important;
      right:48px!important;
      bottom:44px!important;
      display:grid!important;
      grid-template-columns:1.55fr 1.2fr 1.08fr .85fr!important;
      gap:32px!important;
      margin:0!important;
      padding:0!important;
      border:0!important;
      align-items:start!important;
    }
    body.himart-video-test-page .hm-video-meta>div{
      display:block!important;
      min-width:0!important;
      margin:0!important;
      padding:0!important;
      border:0!important;
    }
    body.himart-video-test-page .hm-video-meta span{
      display:block!important;
      margin:0 0 8px!important;
      color:rgba(255,255,255,.42)!important;
      font-family:"Averta PE",Arial,sans-serif!important;
      font-size:10px!important;
      font-weight:400!important;
      line-height:1.15!important;
      letter-spacing:.05em!important;
    }
    body.himart-video-test-page .hm-video-meta b{
      display:block!important;
      margin:0!important;
      color:rgba(255,255,255,.76)!important;
      font-family:"Averta PE",Arial,sans-serif!important;
      font-size:11px!important;
      font-weight:400!important;
      line-height:1.45!important;
      letter-spacing:.015em!important;
      white-space:normal!important;
    }

    body.himart-video-test-page #brand{
      position:relative!important;
      z-index:10!important;
      margin-top:-100vh!important;
      background:#000!important;
    }
    body.himart-video-test-page #data,
    body.himart-video-test-page #journey,
    body.himart-video-test-page #direction{
      position:relative!important;
      z-index:10!important;
      background:#000!important;
    }
    body.himart-video-test-page .hm-progress{z-index:50!important}
    body.himart-video-test-page .top{z-index:60!important}

    @media(max-width:900px){
      body.himart-video-test-page .hm-video-frame{padding:0 24px!important}
      body.himart-video-test-page .hm-video-copy{left:24px!important;top:92px!important;width:calc(100% - 48px)!important}
      body.himart-video-test-page .hm-video-copy .hm-title{font-size:clamp(38px,9vw,58px)!important}
      body.himart-video-test-page .hm-video-copy .hm-lead{font-size:15px!important;line-height:1.55!important}
      body.himart-video-test-page .hm-video-meta{left:24px!important;right:24px!important;bottom:28px!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:18px 22px!important}
      body.himart-video-test-page .hm-video-meta b{font-size:10px!important}
    }
    @media(prefers-reduced-motion:reduce){
      body.himart-video-test-page .hm-video-overlay-scroll{opacity:.82!important}
    }
  </style>`;

  const PATCH_SCRIPT='<script id="himart-video-hero-test-script">'+
  '(()=>{\n'+
  "  'use strict';\n"+
  "  document.body.classList.add('himart-video-test-page');\n"+
  "  const stage=document.querySelector('.hm-video-hero-stage');\n"+
  "  const sticky=document.getElementById('hmVideoSticky');\n"+
  "  const video=document.getElementById('hmHeroVideo');\n"+
  "  const clamp=(v,min=0,max=1)=>Math.max(min,Math.min(max,v));\n"+
  "  let raf=0;\n"+
  "  const update=()=>{\n"+
  "    raf=0;\n"+
  "    if(!stage||!sticky)return;\n"+
  "    const rect=stage.getBoundingClientRect();\n"+
  "    const travel=Math.max(1,stage.offsetHeight-innerHeight);\n"+
  "    const progress=clamp((-rect.top)/travel);\n"+
  "    const blackout=clamp((progress-.10)/.90);\n"+
  "    sticky.style.setProperty('--hm-video-blackout',blackout.toFixed(4));\n"+
  "  };\n"+
  "  const requestUpdate=()=>{if(!raf)raf=requestAnimationFrame(update)};\n"+
  "  addEventListener('scroll',requestUpdate,{passive:true});\n"+
  "  addEventListener('resize',requestUpdate,{passive:true});\n"+
  "  if(video){video.muted=true;video.loop=true;video.playsInline=true;video.play().catch(()=>{});}\n"+
  "  update();\n"+
  '})();<'+'/script>';

  fetch('./himart.html?v=20260901-video-hero-test-1',{cache:'no-store'})
    .then(r=>{if(!r.ok)throw new Error('himart load failed');return r.text()})
    .then(html=>{
      html=html.replace(/<body class="([^"]*)">/,(_,cls)=>`<body class="${cls} himart-video-test-page">`);
      html=html.replace(/<header class="hm-hero" id="top">[\s\S]*?<\/header>/,HERO_HTML);
      html=html.replace('</head>',PATCH_STYLE+'</head>');
      html=html.replace('</body>',PATCH_SCRIPT+'</body>');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(err=>{
      console.error(err);
      document.body.innerHTML='<div class="boot" style="display:grid;place-items:center;color:rgba(255,255,255,.5);font:14px Pretendard,sans-serif">페이지를 불러오지 못했습니다.</div>';
    });
})();
</script>
</body>
</html>
