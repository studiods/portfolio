<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하이마트 온라인 구매여정 · Latest Test</title>
<style>html,body{margin:0;background:#000;color:#fff;overflow-x:clip;max-width:100%}.boot{min-height:100vh;background:#000}</style>
</head>
<body>
<div class="boot" aria-hidden="true"></div>
<script>
(()=>{'use strict';
const sources={
 page:'./himart.html?v=20260902-final-copy',
 hero:'./assets/html/himart-video-test-hero.html?v=20260902-final-copy',
 css:'./assets/css/himart-video-test.css?v=20260902-final-copy',
 latest:'./assets/css/himart-latest.css?v=20260902-final-copy',
 js:'./assets/js/himart-latest.js?v=20260902-final-copy'
};
const get=url=>fetch(url,{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject(new Error('load failed: '+url)));
Promise.all([get(sources.page),get(sources.hero)]).then(([page,hero])=>{
  const doc=new DOMParser().parseFromString(page,'text/html');
  const heroDoc=new DOMParser().parseFromString(hero,'text/html');
  doc.body.classList.add('himart-video-test-page');
  const oldHero=doc.querySelector('header.hm-hero');
  const newHero=heroDoc.querySelector('header.hm-hero');
  if(oldHero&&newHero)oldHero.replaceWith(doc.importNode(newHero,true));

  const css=doc.createElement('link');css.rel='stylesheet';css.href=sources.css;doc.head.append(css);
  const latest=doc.createElement('link');latest.rel='stylesheet';latest.href=sources.latest;doc.head.append(latest);
  const js=doc.createElement('script');js.src=sources.js;doc.body.append(js);

  const finalPatch=doc.createElement('script');
  finalPatch.textContent=`(()=>{'use strict';
const roleData=[
['HOME','홈은 보여주는 곳이 아닌<br>원하는 곳으로 보내주는 곳이어야 한다.','최근 관심 상품과 혜택을 기억해 원하는 목적지로 연결합니다.','최근 맥락 기억 · 목적지 연결'],
['SUBHOME / CATEGORY','선택한 카테고리 안에서는<br>고민의 시간을 줄여야 한다.','사용 상황과 설치 조건을 중심으로 선택 기준을 빠르게 좁힙니다.','상황 중심 탐색 · 선택 기준 구체화'],
['SEARCH','검색은 불확실성을<br>확신으로 바꿔줘야 한다.','가이드와 필터로 모호한 요구를 실제 상품 후보로 구체화합니다.','검색 가이드 · 동적 필터 · 후보 구체화'],
['SRP / PLP','검색 결과는 단순 상품 목록이 아니라<br>비교를 끝내는 화면이어야 한다.','가격·혜택·리뷰·설치 조건을 같은 기준으로 비교합니다.','핵심 기준 비교 · 후보 압축'],
['PDP','상세페이지는 설명하는 화면이 아니라<br>결정을 끝내는 화면이어야 한다.','가격·리뷰·설치·상담·케어 정보를 한 흐름으로 판단합니다.','구매 조건 통합 · 확신 완성'],
['CART / PAY','장바구니는 결제 직전의<br>마지막 확신을 줘야 한다.','총액과 혜택, 배송·설치 조건을 결제 전에 명확히 확인합니다.','총액 확인 · 설치 조건 확정'],
['INSTALL / CARE','설치 조율에서는 결제 이후의<br>불안을 일정 확정으로 바꿔야 한다.','설치 일정과 회수 조건을 확정해 결제 이후의 불안을 줄입니다.','일정 확정 · 회수 조건 확인'],
['MY PAGE','마이페이지에서는 구매 이후에도<br>관리받고 있다는 느낌을 줘야 한다.','보증·A/S·케어 상태를 연결해 구매 이후에도 관리합니다.','보증 · A/S · 케어 연결'],
['STORE · ONLINE','매장과 온라인은 같은 맥락으로<br>상담과 구매를 이어줘야 한다.','매장 상담과 온라인 탐색 정보를 연결해 구매 흐름을 이어갑니다.','매장 상담 · 온라인 구매 연결']
];
let stableCount=0;
function setHTML(el,value){if(el&&el.innerHTML!==value){el.innerHTML=value;return true}return false}
function setText(el,value){if(el&&el.textContent!==value){el.textContent=value;return true}return false}
function apply(){
  let changed=false;
  const lead=document.querySelector('.hm-video-copy .hm-lead,.hm-lead');
  if(lead){
    const value='화면 개선부터 시작하지 않았습니다. 고객 인식과 실제 유입·탐색·이탈을 확인한 뒤<br>전체 구매 여정의 역할을 다시 정의했습니다.';
    changed=setHTML(lead,value)||changed;
    if(lead.style.color!=='rgba(255, 255, 255, 0.8)'){lead.style.setProperty('color','rgba(255,255,255,.80)','important');changed=true}
  }

  const synthesis=Array.from(document.querySelectorAll('.brand-synthesis')).find(el=>el.textContent.includes('이미 가지고 있던 강점'));
  if(synthesis){
    changed=setHTML(synthesis.querySelector('h4'),'하이마트의 강점은 이미 충분했습니다.<br><strong>문제는 그 강점이 온라인 구매로 이어지지 않는 데 있었습니다.</strong>')||changed;
    const cols=synthesis.querySelectorAll('.synthesis-col');
    cols.forEach(col=>{
      const b=col.querySelector('b');
      if(b){b.style.setProperty('font-family','Pretendard, sans-serif','important');b.style.setProperty('font-size','16px','important');b.style.setProperty('font-weight','300','important')}
    });
    if(cols[0]){
      changed=setText(cols[0].querySelector('p'),'멀티 브랜드 비교·상담, 전국 매장, 전문 인력, 설치·A/S 신뢰처럼 복제하기 어려운 오프라인 자산이 있었습니다.')||changed;
      const p=cols[0].querySelector('p');if(p){p.style.setProperty('font-size','28px','important');p.style.setProperty('color','rgba(255,255,255,.80)','important');p.style.setProperty('opacity','1','important')}
    }
    if(cols[1]){
      const p=cols[1].querySelector('p');if(p)p.style.setProperty('color','rgba(255,255,255,.80)','important');
    }
  }

  const subcopy=Array.from(document.querySelectorAll('.hm-subcopy')).find(el=>el.textContent.includes('홈부터 결제까지')||el.textContent.includes('앞 단계에서 받은 맥락'));
  if(subcopy){
    changed=setText(subcopy,'홈부터 결제까지 각 단계가 앞선 맥락을 다음 판단으로 넘기도록 역할을 정의했습니다.')||changed;
    const head=subcopy.closest('.hm-subhead');
    if(head)changed=setText(head.querySelector('.hm-subno'),'03.2 / ROLE DEFINITION')||changed;
  }

  const grid=document.querySelector('#journey .role-grid')||document.querySelector('.role-grid');
  if(grid){
    const current=[...grid.querySelectorAll(':scope > .role-card')];
    if(current.length!==9||current.some((card,i)=>card.querySelector('h4')?.innerHTML!==roleData[i]?.[1])){
      grid.innerHTML='';
      roleData.forEach(([name,title,body,key])=>{
        const card=document.createElement('article');card.className='role-card';
        card.innerHTML='<span class="hm-role-name">'+name+'</span><h4>'+title+'</h4><p>'+body+'</p><strong>'+key+'</strong>';
        const en=card.querySelector('.hm-role-name');en.style.setProperty('font-family','Averta, sans-serif','important');en.style.setProperty('font-weight','400','important');
        grid.append(card);
      });
      changed=true;
    }
  }
  stableCount=changed?0:stableCount+1;
}
apply();
const observer=new MutationObserver(apply);
observer.observe(document.documentElement,{childList:true,subtree:true});
let ticks=0;
const timer=setInterval(()=>{apply();ticks++;if(ticks>=40&&stableCount>=8){clearInterval(timer);observer.disconnect()}},250);
addEventListener('load',apply,{once:true});
})();`;
  doc.body.append(finalPatch);
  document.open();document.write('<!doctype html>'+doc.documentElement.outerHTML);document.close();
}).catch(error=>{console.error(error);document.body.innerHTML='<div class="boot">페이지를 불러오지 못했습니다.</div>';});
})();
</script>
</body>
</html>
