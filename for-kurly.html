<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>FOR KURLY · Interview Preparation</title>
<style>
:root{color-scheme:dark;--bg:#080a0d;--txt:#f1f4f8;--sub:#b2bdcb;--blue:#89b6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);min-height:100vh;display:grid;place-items:center;font:14px/1.8 Pretendard,"Apple SD Gothic Neo",-apple-system,system-ui,sans-serif;padding:28px}
main{width:min(100%,510px);padding:34px;border:1px solid #263546;border-radius:12px;background:#101721}
h1{font-size:clamp(34px,6vw,48px);letter-spacing:-.055em;margin:10px 0;line-height:1.13}
small{color:var(--blue);font-size:11px;font-weight:750;letter-spacing:.12em}
p{color:var(--sub);margin:12px 0}
button{cursor:pointer;background:#2c5eac;color:#fff;border:0;border-radius:7px;padding:12px 20px;font:inherit;font-weight:700}
#error{display:none;margin-top:20px;color:#f5b2af;font-size:13px}
</style>
</head>
<body>
<main>
<small>FOR KURLY · INTERVIEW PLAYBOOK</small>
<h1>면접 준비 자료를<br>불러오고 있습니다.</h1>
<p>컬리 프로덕트 디자인 그룹장 예상 질문·답변 40문항</p>
<p id="state" aria-live="polite">별도의 비밀번호 없이 자동으로 열립니다.</p>
<div id="error"><p>자료를 불러오지 못했습니다. 연결 상태를 확인한 후 다시 시도해 주세요.</p><button id="retry" type="button">다시 불러오기</button></div>
</main>
<script>
(function(){
"use strict";
var endpoint="https://kkshbnlpmogdzkoyjait.supabase.co/functions/v1/for-kurly/site-access";
var state=document.getElementById("state"),err=document.getElementById("error");
async function load(){
 err.style.display="none";state.textContent="비공개 메뉴에 등록되지 않은 독립 페이지를 준비하고 있습니다.";
 try{
   var response=await fetch(endpoint,{method:"GET",mode:"cors",credentials:"omit",cache:"no-store",referrerPolicy:"no-referrer"});
   if(!response.ok)throw Error("HTTP "+response.status);
   var html=await response.text();
   if(!/^\s*<!doctype html>/i.test(html)||html.indexOf("questionsContainer")<0||html.indexOf("id=\"priority10\"")<0)throw Error("Not a complete interview page");
   document.open();
   document.write(html);
   document.close();
 }catch(e){state.textContent="자료를 불러오는 과정에서 오류가 발생했습니다.";err.style.display="block";}
}
document.getElementById("retry").addEventListener("click",load);
load();
})();
</script>
</body>
</html>
