<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>FOR KURLY · Private Interview Workspace</title>
<meta name="description" content="비공개 면접 준비 워크스페이스">
<style>
:root{color-scheme:dark;--bg:#080a0e;--surface:#111823;--stroke:#293748;--blue:#89b5ff;--main:#f3f6fb;--muted:#aab8ca}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--main);font-family:Inter,Pretendard,"Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:26px;letter-spacing:-.02em}
main{max-width:465px;width:100%;border:1px solid var(--stroke);background:linear-gradient(145deg,#152032 0%,#0f151e 62%);border-radius:16px;padding:36px 36px 30px;box-shadow:0 20px 65px #0005}
.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.13em}
h1{font-size:clamp(34px,6vw,48px);line-height:1.03;margin:15px 0 15px;letter-spacing:-.055em}
p{margin:0 0 24px;color:var(--muted);line-height:1.8;font-size:13px}
label{font-size:11px;font-weight:750;letter-spacing:.055em;display:block;margin-bottom:8px;color:#c8d6ea}
input{display:block;width:100%;padding:15px 14px;border:1px solid #465b74;border-radius:7px;background:#0b111a;color:var(--main);font-size:15px;outline:none}
input:focus{border-color:#88b3f6;box-shadow:0 0 0 3px #33486680}
button{border:0;background:#386bbb;border-radius:7px;color:white;font-size:14px;font-weight:800;width:100%;padding:14px;margin-top:14px;cursor:pointer}
button:hover{background:#477bd0}button:disabled{opacity:.65;cursor:wait}
#error{color:#ffadae;font-size:12px;line-height:1.8;min-height:24px;margin-top:9px}
.foot{font-size:11px;line-height:1.8;margin-top:20px;color:#77879a}
@media(max-width:480px){main{padding:28px 22px}body{padding:17px}}
</style>
</head>
<body>
<main>
<div class="eyebrow">PRIVATE · PRODUCT DESIGN GROUP LEAD</div>
<h1>FOR KURLY</h1>
<p>컬리 프로덕트 디자인 그룹장 인터뷰 준비 자료입니다.<br>기존 접근 비밀번호를 입력하면 이 주소에서 면접 자료가 열립니다.</p>
<form id="signin">
<label for="password">ACCESS PASSWORD</label>
<input id="password" type="password" name="password" autocomplete="current-password" required autofocus maxlength="200">
<button id="enter" type="submit">비공개 면접 자료 열기 →</button>
<div id="error" role="alert" aria-live="polite"></div>
</form>
<div class="foot">본 페이지에는 면접 자료가 저장되어 있지 않습니다. 비밀번호 검증 후 보호된 서버에서 불러옵니다.<br>검색엔진 색인 차단 · 포트폴리오 메뉴 미노출</div>
</main>
<script>
(()=>{'use strict';
const API='https://kkshbnlpmogdzkoyjait.supabase.co/functions/v1/for-kurly/site-access';
const form=document.getElementById('signin'),input=document.getElementById('password'),btn=document.getElementById('enter'),error=document.getElementById('error');
form.addEventListener('submit',async(e)=>{
 e.preventDefault();if(btn.disabled)return;
 btn.disabled=true;btn.textContent='인증 및 자료 불러오는 중…';error.textContent='';
 const body=new URLSearchParams({password:input.value});input.value='';
 try{
  const res=await fetch(API,{method:'POST',mode:'cors',credentials:'omit',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body,cache:'no-store',referrerPolicy:'no-referrer'});
  if(res.status===403){error.textContent='비밀번호가 일치하지 않습니다.';return}
  if(!res.ok)throw new Error('HTTP '+res.status);
  const html=await res.text();
  if(!/^\s*<!doctype html>/i.test(html)||!html.includes('FOR KURLY')||!html.includes('questionsContainer'))throw new Error('Protected HTML validation failed');
  // Replace the login document with authenticated, server-supplied HTML.
  // The browser URL remains shindongsik.com/for-kurly.html, and no protected material is stored in the public repository.
  document.open();document.write(html);document.close();return;
 }catch(err){error.textContent='자료를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.'}
 finally{btn.disabled=false;btn.textContent='비공개 면접 자료 열기 →'}
});
})();
</script>
</body>
</html>
