<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>비밀번호 입력</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;background:#080a0d;color:#f1f4f8;font:14px/1.6 Pretendard,"Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:24px}
main{width:100%;max-width:340px}
label{display:block;font-size:15px;font-weight:500;margin:0 0 18px;text-align:center}
input{display:block;width:100%;background:#10151c;border:1px solid #374251;border-radius:6px;padding:14px;color:#fff;font:inherit;font-size:16px;outline:none}
input:focus{border-color:#89b6ff;box-shadow:0 0 0 3px #89b6ff22}
button{display:block;width:100%;border:0;border-radius:6px;background:#2d5287;color:#fff;padding:13px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
button:disabled{opacity:.6;cursor:wait}
#error{min-height:20px;margin-top:10px;color:#ffb0ac;font-size:12px;text-align:center}
</style>
</head>
<body>
<main>
<form id="auth">
<label for="pass">비밀번호를 입력해 주세요.</label>
<input id="pass" type="password" name="password" autocomplete="current-password" required maxlength="64" autofocus aria-label="비밀번호">
<button type="submit" id="submit">확인</button>
<div id="error" role="alert" aria-live="polite"></div>
</form>
</main>
<script>
(()=>{
 "use strict";
 const form=document.getElementById("auth");
 const pass=document.getElementById("pass");
 const button=document.getElementById("submit");
 const error=document.getElementById("error");
 const API="https://kkshbnlpmogdzkoyjait.supabase.co/functions/v1/for-kurly/site-access";
 form.addEventListener("submit",async e=>{
  e.preventDefault();if(button.disabled)return;
  button.disabled=true;button.textContent="확인 중…";error.textContent="";
  const body=new URLSearchParams({password:pass.value});
  pass.value="";
  try{
    const res=await fetch(API,{method:"POST",mode:"cors",credentials:"omit",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body,cache:"no-store",referrerPolicy:"no-referrer"});
    if(res.status===401||res.status===403){error.textContent="비밀번호가 일치하지 않습니다.";return}
    if(res.status===429){error.textContent="잠시 후 다시 시도해 주세요.";return}
    if(!res.ok)throw new Error("HTTP "+res.status);
    const html=await res.text();
    if(!/^\s*<!doctype html>/i.test(html)||!html.includes("questionsContainer")||!html.includes('id="priority10"'))throw new Error("Invalid document");
    document.open();document.write(html);document.close();
  }catch(e){error.textContent="다시 시도해 주세요."}
  finally{button.disabled=false;button.textContent="확인"}
 });
})();
</script>
</body>
</html>
