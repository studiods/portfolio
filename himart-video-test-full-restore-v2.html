<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하이마트 온라인 구매여정 · Video Restore V2</title>
<link rel="stylesheet" href="./himart-narrative-v2-production.css">
<link rel="stylesheet" href="./himart-wide-refine-v10.css">
<link rel="stylesheet" href="./pretendard.css">
<style>
.hm-video-media{position:absolute!important;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hm-hero{position:relative;overflow:hidden}
.hm-hero>*{position:relative;z-index:2}
.hm-hero .hm-video-media{z-index:0}
</style>
</head>
<body>
<main id="restore-app"></main>
<script>
(async()=>{
 const app=document.getElementById('restore-app');
 const html=await fetch('./himart.html').then(r=>r.text());
 const doc=new DOMParser().parseFromString(html,'text/html');
 const main=doc.querySelector('main');
 if(main){
   const hero=main.querySelector('.hm-hero');
   if(hero){
    const video=document.createElement('video');
    video.className='hm-video-media';
    video.src='./assets/video/himart_01.mp4';
    video.autoplay=true;
    video.muted=true;
    video.loop=true;
    video.playsInline=true;
    hero.prepend(video);
   }
   app.replaceWith(main);
 }
})();
</script>
<script src="./himart-narrative-v2-production-base.js"></script>
<script src="./himart-narrative-v2-production-runtime.js"></script>
<script src="./himart-wide-refine-v10.js"></script>
</body>
</html>
