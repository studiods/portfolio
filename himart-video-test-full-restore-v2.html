<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하이마트 온라인 구매여정 · Video Restore V3</title>
<link rel="stylesheet" href="./himart-narrative-v2-production.css">
<link rel="stylesheet" href="./himart-wide-refine-v10.css">
<link rel="stylesheet" href="./pretendard.css">
<link rel="stylesheet" href="./himart-video-test.css">
<style>
.hm-hero{position:relative;height:100vh;overflow:hidden;background:none!important}
.hm-video-media{position:absolute!important;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.hm-hero>*:not(.hm-video-media){position:relative;z-index:3}
.hm-video-overlay{position:absolute;inset:0;background:#000;opacity:.15;z-index:2;pointer-events:none}
.hm-section{position:relative;z-index:10}
</style>
</head>
<body>
<div id="restore-app"></div>
<script>
(async()=>{
 const app=document.getElementById('restore-app');
 const html=await fetch('./himart.html').then(r=>r.text());
 const doc=new DOMParser().parseFromString(html,'text/html');
 const main=doc.querySelector('main');
 if(!main)return;
 const hero=main.querySelector('.hm-hero');
 if(hero){
  hero.style.backgroundImage='none';
  const video=document.createElement('video');
  video.className='hm-video-media';
  video.src='./assets/video/himart_01.mp4';
  video.autoplay=true;
  video.muted=true;
  video.loop=true;
  video.playsInline=true;
  const overlay=document.createElement('div');
  overlay.className='hm-video-overlay';
  hero.prepend(video);
  hero.prepend(overlay);
  video.play().catch(()=>{});
 }
 app.replaceWith(main);
 document.dispatchEvent(new Event('DOMContentLoaded'));
})();
</script>
<script src="./himart-narrative-v2-production-base.js"></script>
<script src="./himart-narrative-v2-production-runtime.js"></script>
<script src="./himart-wide-refine-v10.js"></script>
</body>
</html>
