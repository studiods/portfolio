name: One-off subsection visibility for Himart source
on:
  push:
    paths:
      - '.github/workflows/oneoff-subsection-copy-himart-source.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch canonical Himart source
        shell: python
        run: |
          from pathlib import Path
          p = Path('himart_backup_02/himart.html')
          text = p.read_text(encoding='utf-8')
          if 'hm-ds-subsection-copy-hidden' not in text:
            text = text.replace('himart-commerce-page">', 'himart-commerce-page hm-ds-subsection-copy-hidden">', 1)
          link = '<link rel="stylesheet" href="./design-system/components/subsection-copy-visibility.css?v=20260918-1">'
          if 'subsection-copy-visibility.css' not in text:
            text = text.replace('</head>', link + '\n</head>', 1)
          p.write_text(text, encoding='utf-8')
          assert 'hm-ds-subsection-copy-hidden' in text
          assert 'subsection-copy-visibility.css?v=20260918-1' in text
      - name: Commit and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-subsection-copy-himart-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply subsection visibility state to Himart source"
          git push
