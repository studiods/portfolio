name: Set sentiment graph top lines to 1px
on:
  push:
    paths:
      - '.github/workflows/sentiment-topline-1px.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sentiment graph top-line rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('design-system/components/data-viz.css')
          t=p.read_text()
          assert 'border-top:2px solid var(--hm-blue);' in t
          t=t.replace('HIMART Data Visualization System v1.0','HIMART Data Visualization System v1.1')
          t=t.replace('border-top:2px solid var(--hm-blue);','border-top:1px solid var(--hm-blue);',1)
          p.write_text(t)

          p=Path('design-system/index.css')
          t=p.read_text()
          t=t.replace('HIMART Design System v2.9','HIMART Design System v3.0')
          t=t.replace('./components/data-viz.css?v=20260906-1','./components/data-viz.css?v=20260907-2')
          p.write_text(t)

          p=Path('design-system/himart-system.css')
          t=p.read_text()
          t=t.replace('./index.css?v=20260907-15','./index.css?v=20260907-16')
          t=t.replace('HIMART Shared System v2.2','HIMART Shared System v2.3')
          p.write_text(t)

          for p in Path('.').glob('*.html'):
              t=p.read_text()
              nt=re.sub(r'\.\/design-system\/himart-system\.css\?v=[0-9-]+','./design-system/himart-system.css?v=20260907-18',t)
              if nt!=t: p.write_text(nt)
          PY
      - name: Verify sentiment graph rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          css=Path('design-system/components/data-viz.css').read_text()
          page=Path('himart.html').read_text()
          idx=Path('design-system/index.css').read_text()
          shared=Path('design-system/himart-system.css').read_text()
          checks={
            'himart uses sentiment graph': 'class="sentiment-graph"' in page,
            'blue top line is 1px': 'border-top:1px solid var(--hm-blue);' in css,
            'negative top line remains red': 'border-top-color:var(--hm-red);' in css,
            'old 2px blue top line removed': 'border-top:2px solid var(--hm-blue);' not in css,
            'data viz cache bumped': './components/data-viz.css?v=20260907-2' in idx,
            'shared cache bumped': './index.css?v=20260907-16' in shared,
            'himart cache refreshed': 'himart-system.css?v=20260907-18' in page,
          }
          failed=[]
          for name,ok in checks.items():
              print(('PASS' if ok else 'FAIL')+' - '+name)
              if not ok: failed.append(name)
          if failed:
              print('FAILED:',', '.join(failed)); sys.exit(1)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/sentiment-topline-1px.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set sentiment graph blue and red top lines to 1px"
          git push
