name: Text integrity audit

on:
  push:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - '.github/workflows/text-integrity-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan all HTML CSS JS for truncation patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          exts={'.html','.css','.js'}
          files=[p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in exts and '.git' not in p.parts]
          hard={
            'text-overflow ellipsis': re.compile(r'text-overflow\s*:\s*ellipsis',re.I),
            'line clamp': re.compile(r'(?:-webkit-)?line-clamp\s*:',re.I),
            'js string truncation': re.compile(r'(?:slice|substring|substr)\s*\([^\n;]*\)[^\n;]{0,100}(?:\.\.\.|…)|(?:\.\.\.|…)[^\n;]{0,100}(?:slice|substring|substr)\s*\(',re.I),
          }
          info={
            'white-space nowrap': re.compile(r'white-space\s*:\s*nowrap',re.I),
            'overflow hidden': re.compile(r'overflow\s*:\s*hidden',re.I),
            'authored ellipsis glyph': re.compile(r'…|\.\.\.'),
          }
          failed=[]
          print(f'AUDITED_FILES={len(files)}')
          for label,rx in hard.items():
            hits=[]
            for p in files:
              text=p.read_text(errors='ignore')
              for m in rx.finditer(text):
                line=text.count('\n',0,m.start())+1
                hits.append(f'{p}:{line}')
            print(f'HARD {label}: {len(hits)}')
            for h in hits[:120]: print('  '+h)
            if hits: failed.append(label)
          for label,rx in info.items():
            hits=[]
            for p in files:
              text=p.read_text(errors='ignore')
              for m in rx.finditer(text):
                line=text.count('\n',0,m.start())+1
                hits.append(f'{p}:{line}')
            print(f'INFO {label}: {len(hits)}')
            for h in hits[:120]: print('  '+h)
          if failed:
            print('HARD_TRUNCATION_FOUND=' + ', '.join(failed))
            sys.exit(2)
          print('HARD_TRUNCATION_FOUND=NONE')
          PY