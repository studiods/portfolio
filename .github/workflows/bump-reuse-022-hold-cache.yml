name: Bump Reuse 02.2 hold cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-reuse-022-hold-cache.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump motion script cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('himart-reuse.html')
          s = p.read_text()
          old = './design-system/reuse-confidence-motion.js?v=20260908-8'
          new = './design-system/reuse-confidence-motion.js?v=20260908-9'
          if old not in s:
              raise SystemExit('motion cache version not found')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q 'reuse-confidence-motion.js?v=20260908-9' himart-reuse.html
          grep -q 'const FINAL_HOLD = 5000;' design-system/reuse-confidence-motion.js
          rm -f .github/workflows/bump-reuse-022-hold-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bump Reuse 02.2 motion cache'
          git push origin main
