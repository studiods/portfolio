name: Bump Reuse motion cache
on:
  push:
    paths:
      - '.github/workflows/bump-reuse-motion-cache.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump cache versions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('design-system/himart-system.css')
          s = p.read_text()
          if './index.css?v=20260908-40' not in s:
              raise SystemExit('system cache marker missing')
          s = s.replace('./index.css?v=20260908-40','./index.css?v=20260908-41',1)
          s = s.replace('HIMART Shared System v3.4','HIMART Shared System v3.5',1)
          p.write_text(s)

          p = Path('himart-reuse.html')
          h = p.read_text()
          if './design-system/himart-system.css?v=20260908-45' not in h:
              raise SystemExit('page css cache marker missing')
          if './design-system/reuse-confidence-motion.js?v=20260908-2' not in h:
              raise SystemExit('page motion cache marker missing')
          h = h.replace('./design-system/himart-system.css?v=20260908-45','./design-system/himart-system.css?v=20260908-46',1)
          h = h.replace('./design-system/reuse-confidence-motion.js?v=20260908-2','./design-system/reuse-confidence-motion.js?v=20260908-3',1)
          p.write_text(h)
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          rm -f .github/workflows/bump-reuse-motion-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump Reuse 02.2 motion cache"
          git push
