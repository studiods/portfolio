name: Tune Reuse evidence cards
on:
  push:
    paths:
      - '.github/workflows/reuse-evidence-card-tuning.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply evidence card design-system rules and copy tuning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Foundation token: evidence/stat card title = 24px.
          p = Path('design-system/tokens.css')
          t = p.read_text()
          anchor = '  --hm-type-group:28px;\n'
          if '--hm-type-card-title:24px;' not in t:
              if anchor not in t:
                  raise SystemExit('tokens type anchor missing')
              t = t.replace(anchor, anchor + '  --hm-type-card-title:24px;\n')
          p.write_text(t)

          # 2) Shared Evidence Stat component: no forced/equal-height flex dead space; 24px title; natural wrapping.
          p = Path('design-system/components/cards.css')
          t = p.read_text()
          marker = '/* Evidence stat cards: compact title + content-height cards; never reserve flex dead space. */'
          block = '''\n/* Evidence stat cards: compact title + content-height cards; never reserve flex dead space. */\n.hm-ds-evidence-stat{\n  align-items:start!important;\n}\n.hm-ds-evidence-stat>.proof-item{\n  align-self:start!important;\n  min-height:0!important;\n  height:auto!important;\n}\n.hm-ds-evidence-stat>.proof-item h4{\n  max-width:100%!important;\n  font-size:var(--hm-type-card-title)!important;\n  line-height:1.28!important;\n  text-wrap:pretty!important;\n  word-break:keep-all!important;\n}\n'''
          if marker not in t:
              anchor = '.hm-ds-role__keyword{display:block;margin-top:var(--hm-space-20);color:var(--hm-blue);font:300 14px/1.4 var(--hm-font-ko)}\n'
              if anchor not in t:
                  raise SystemExit('cards evidence anchor missing')
              t = t.replace(anchor, anchor + block)
          p.write_text(t)

          # 3) Reuse composition opts into content-height grid. This removes the ~70px flex free-space seen in DevTools.
          p = Path('design-system/components/reuse.css')
          t = p.read_text()
          t = t.replace('  margin-top:var(--hm-subtitle-to-content)!important;\n}',
                        '  margin-top:var(--hm-subtitle-to-content)!important;\n  align-items:start!important;\n}', 1)
          t = t.replace('  min-height:320px!important;\n  padding:var(--hm-space-24) 0 0!important;',
                        '  min-height:0!important;\n  height:auto!important;\n  align-self:start!important;\n  padding:var(--hm-space-24) 0 0!important;')
          # Voice group titles wrap by content rather than authored BRs.
          old = '''html body.reuse-current .reuse-proof-group .voice-group-title{\n  display:block;\n  margin:0!important;\n  color:#fff!important;\n}'''
          new = '''html body.reuse-current .reuse-proof-group .voice-group-title{\n  display:block;\n  max-width:42ch!important;\n  margin:0!important;\n  color:#fff!important;\n  text-wrap:pretty!important;\n  word-break:keep-all!important;\n}'''
          if old in t:
              t = t.replace(old,new)
          # Local title rule keeps spacing only; size/wrap is owned by cards.css shared component.
          t = t.replace('html body.reuse-current .reuse-proof-grid .proof-item h4{margin:var(--hm-space-20) 0 0!important;min-height:0!important}',
                        'html body.reuse-current .reuse-proof-grid .proof-item h4{margin:var(--hm-space-20) 0 0!important;min-height:0!important;text-wrap:pretty!important;word-break:keep-all!important}')
          p.write_text(t)

          # 4) Reuse copy: roughly 30% shorter while preserving the actual statistic/meaning; remove forced group-title line breaks.
          p = Path('himart-reuse.html')
          t = p.read_text()
          replacements = {
            '<h4 class="voice-group-title"><span class="reuse-roman">I.</span> 중고거래 구매자의 <strong data-hm-number="normal">69.6%</strong>가<br>상품을 받기 전 선입금 사기를 불안 요인으로 꼽았습니다.</h4>':
            '<h4 class="voice-group-title"><span class="reuse-roman">I.</span> 구매자의 <strong data-hm-number="normal">69.6%</strong>가 선입금 사기를 가장 불안해했습니다.</h4>',
            '<h4>돈을 먼저 보내는 순간이 가장 불안했습니다.</h4>': '<h4>선입금 순간이 가장 불안했습니다.</h4>',
            '<h4>보여준 정보와 실제 상태가 다를까 걱정했습니다.</h4>': '<h4>실제 상태가 다를까 걱정했습니다.</h4>',
            '<h4>거래를 위해 개인정보를 내놓는 것도 부담이었습니다.</h4>': '<h4>개인정보 제공도 부담이었습니다.</h4>',
            '<h4>결제한 뒤 상품을 받기까지도 불확실했습니다.</h4>': '<h4>결제 후 배송까지 불안했습니다.</h4>',
            '<h4 class="voice-group-title"><span class="reuse-roman">II.</span> 반대로 구매자의 <strong data-hm-number="normal">96.2%</strong>는<br>투명하고 안전한 거래를 위해 안전결제가 필요하다고 답했습니다.</h4>':
            '<h4 class="voice-group-title"><span class="reuse-roman">II.</span> 구매자의 <strong data-hm-number="normal">96.2%</strong>가 안전결제가 필요하다고 답했습니다.</h4>',
            '<h4>대금을 바로 넘기지 않을 때 안심했습니다.</h4>': '<h4>대금이 보호될 때 안심했습니다.</h4>',
            '<h4>상대방의 이전 거래 이력을 확인했습니다.</h4>': '<h4>거래 이력으로 상대방을 판단했습니다.</h4>',
            '<h4>제품 상태를 가장 중요한 판단 기준으로 봤습니다.</h4>': '<h4>제품 상태를 가장 중요하게 봤습니다.</h4>',
            '<h4>전문적인 판매 접점을 직접 확인하고 싶어했습니다.</h4>': '<h4>전문 판매처를 확인하고 싶었습니다.</h4>',
          }
          missing=[]
          for old,new in replacements.items():
              if old not in t:
                  missing.append(old[:70])
              else:
                  t=t.replace(old,new,1)
          if missing:
              raise SystemExit('Missing expected Reuse copy: ' + ' | '.join(missing))
          p.write_text(t)

          # 5) Cache chain.
          p = Path('design-system/index.css')
          t = p.read_text()
          t = t.replace('tokens.css?v=20260907-5','tokens.css?v=20260907-6')
          t = t.replace('components/cards.css?v=20260907-3','components/cards.css?v=20260907-4')
          t = t.replace('components/reuse.css?v=20260907-4','components/reuse.css?v=20260907-5')
          p.write_text(t)

          p = Path('design-system/himart-system.css')
          t = p.read_text().replace('index.css?v=20260907-8','index.css?v=20260907-9')
          p.write_text(t)

          # Refresh every detail page that already uses the shared Himart system.
          for p in Path('.').glob('*.html'):
              t = p.read_text()
              nt = re.sub(r'design-system/himart-system\.css\?v=20260907-\d+',
                          'design-system/himart-system.css?v=20260907-13', t)
              if nt != t:
                  p.write_text(nt)

          # 6) Document shared contract.
          p = Path('design-system/README.md')
          t = p.read_text()
          heading='## Evidence stat card contract'
          if heading not in t:
              t += '''\n\n## Evidence stat card contract\n\n- `hm-ds-evidence-stat`는 4열/2열 등의 수치 근거 카드 묶음에 사용한다.\n- 숫자 아래 카드 타이틀은 `--hm-type-card-title`을 사용하며 desktop 기준 `24px`이다.\n- 카드 타이틀은 authored `<br>`로 줄을 고정하지 않고 `word-break:keep-all` + `text-wrap:pretty`로 문맥에 맞게 자연스럽게 줄바꿈한다.\n- evidence card는 `min-height`나 grid stretch로 빈 하단 영역을 만들지 않는다. 컨텐츠 실제 높이(`min-height:0`, `height:auto`, `align-self:start`)만 사용한다.\n- 동일한 `hm-ds-evidence-stat`를 사용하는 다른 case/영역도 위 규칙을 그대로 상속한다.\n'''
              p.write_text(t)
          PY

      - name: Cross-check evidence cards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          tokens=Path('design-system/tokens.css').read_text()
          cards=Path('design-system/components/cards.css').read_text()
          reusecss=Path('design-system/components/reuse.css').read_text()
          html=Path('himart-reuse.html').read_text()
          index=Path('design-system/index.css').read_text()
          syscss=Path('design-system/himart-system.css').read_text()
          readme=Path('design-system/README.md').read_text()

          checks={
            '24px evidence title token': '--hm-type-card-title:24px;' in tokens,
            'shared evidence title consumes token': 'font-size:var(--hm-type-card-title)!important' in cards,
            'shared natural title wrapping': 'text-wrap:pretty!important' in cards and 'word-break:keep-all!important' in cards,
            'shared card min-height removed': '.hm-ds-evidence-stat>.proof-item' in cards and 'min-height:0!important' in cards and 'height:auto!important' in cards,
            'reuse grid stops stretch': 'align-items:start!important' in reusecss,
            'reuse 320 min-height gone': 'min-height:320px' not in reusecss,
            'reuse proof card self-start': 'align-self:start!important' in reusecss,
            'both evidence groups use shared class': html.count('hm-ds-evidence-stat') == 2,
            'forced group heading BR removed': '69.6%</strong>가<br>' not in html and '96.2%</strong>는<br>' not in html,
            'short I heading present': '69.6%</strong>가 선입금 사기를 가장 불안해했습니다.' in html,
            'short II heading present': '96.2%</strong>가 안전결제가 필요하다고 답했습니다.' in html,
            'short four negative titles': all(x in html for x in ['선입금 순간이 가장 불안했습니다.','실제 상태가 다를까 걱정했습니다.','개인정보 제공도 부담이었습니다.','결제 후 배송까지 불안했습니다.']),
            'short four positive titles': all(x in html for x in ['대금이 보호될 때 안심했습니다.','거래 이력으로 상대방을 판단했습니다.','제품 상태를 가장 중요하게 봤습니다.','전문 판매처를 확인하고 싶었습니다.']),
            'token cache bumped': 'tokens.css?v=20260907-6' in index,
            'cards cache bumped': 'components/cards.css?v=20260907-4' in index,
            'reuse cache bumped': 'components/reuse.css?v=20260907-5' in index,
            'nested index cache bumped': 'index.css?v=20260907-9' in syscss,
            'outer page cache bumped': 'himart-system.css?v=20260907-13' in html,
            'contract documented': '## Evidence stat card contract' in readme,
          }
          failed=[]
          for name,ok in checks.items():
              print(('PASS' if ok else 'FAIL')+' - '+name)
              if not ok: failed.append(name)
          if failed:
              print('FAILED:', ', '.join(failed))
              sys.exit(1)

          # Report all shared evidence-stat uses so this rule is visibly reusable.
          print('--- hm-ds-evidence-stat occurrences ---')
          for p in Path('.').glob('*.html'):
              txt=p.read_text()
              n=txt.count('hm-ds-evidence-stat')
              if n: print(p, n)
          PY

      - name: Commit final state and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/reuse-evidence-card-tuning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply 24px evidence titles and remove Reuse card dead space"
          git push