name: Finalize Reuse dynamic prototype
on:
  push:
    paths:
      - '.github/workflows/reuse-dynamic-finalize.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize cache and document immersive component
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('himart-reuse-dynamic.html')
          t=p.read_text()
          t=t.replace('./design-system/animation.js?v=20260906-14','./design-system/animation.js?v=20260907-2')
          p.write_text(t)

          p=Path('design-system/README.md')
          t=p.read_text()
          heading='## Immersive storytelling component contract'
          if heading not in t:
              block='''\n\n## Immersive storytelling component contract\n\n- `components/immersive-story.css`는 리포트형 정보 밀도를 깨기 위한 공통 스토리텔링 컴포넌트다. 페이지별 `<style>`로 재정의하지 않는다.\n- `hm-ds-impact`는 하나의 강한 문장 + 최소 핵심 지표를 크게 보여주는 구간이다. 숫자는 실제 근거가 있는 값만 사용한다.\n- `hm-ds-immersive-sequence` / `hm-ds-immersive-stage`는 이미지·영상이 화면 전체를 점유하는 sticky visual beat다. 텍스트는 짧은 결론과 키워드만 유지한다.\n- `hm-ds-visual-wall`은 실제 산출물·촬영·콘텐츠를 비대칭 12-column 구조로 배치한다. 실물 이미지가 없을 때 placeholder를 사용할 수 있지만 반드시 `PLACEHOLDER`로 표시한다.\n- `hm-ds-closing`은 case의 최종 역할/의미를 Hero scale의 한 문장으로 정리한다.\n- 신규 글꼴·type scale·palette를 만들지 않는다. typography, spacing, color는 `tokens.css`, `typography.css`, `spacing.css`를 그대로 사용한다.\n- 데이터가 필요한 순간에는 `data-viz.css`의 기존 Himart graph component를 사용하고, 설명·과정 구간에서는 시각 자료를 우선해 정보 밀도의 강약을 만든다.\n- 실제 검증되지 않은 KPI나 성과 수치를 시각적 완성도를 위해 만들지 않는다.\n'''
              t += block
              p.write_text(t)
          PY
      - name: Verify design-system-only prototype
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          page=Path('himart-reuse-dynamic.html').read_text()
          old=Path('himart-reuse.html').read_text()
          immersive=Path('design-system/components/immersive-story.css').read_text()
          index=Path('design-system/index.css').read_text()
          anim=Path('design-system/animation.js').read_text()
          checks={
            'new prototype exists': Path('himart-reuse-dynamic.html').exists(),
            'original reuse untouched from baseline': __import__('subprocess').run(['git','diff','--quiet','8f8782a048f7664cbf135250f49b7498525cfa21','--','himart-reuse.html']).returncode==0,
            'no page style tag': '<style' not in page.lower(),
            'no page script block': not re.search(r'<script(?![^>]*\bsrc=)[^>]*>',page,re.I),
            'inline style only chart data': all(s.strip().startswith('--pct:') for s in re.findall(r'style="([^"]*)"',page)),
            'immersive component registered': 'components/immersive-story.css' in index,
            'shared reveal registered': '.hm-ds-reveal' in anim.split('const revealSelector',1)[1].split(';',1)[0],
            'fresh animation cache': 'animation.js?v=20260907-2' in page,
            'canonical hero': 'hm-ds-hero hm-ds-hero--scroll-cover' in page,
            'approved ring graph reused': page.count('hm-ds-ring-card') >= 6,
            'actual reuse video reused': page.count('./assets/reuse_01.mp4') >= 3,
            'concern visual reused': './himart-reuse-concern.svg' in page,
            'placeholder disclosure': page.count('PLACEHOLDER') >= 5,
            'no new font declaration': '@font-face' not in immersive,
            'no hardcoded new palette in immersive': '#00A6ED' not in immersive and '#FA481B' not in immersive,
          }
          source_values={'79.1','51.2','50.8','44.6','41.0','74.0','61.3','34.6'}
          for v in source_values:
              checks['source metric '+v]=v in old and v in page
          failed=[]
          for name,ok in checks.items():
              print(('PASS' if ok else 'FAIL')+' - '+name)
              if not ok: failed.append(name)
          if failed:
              print('FAILED:',', '.join(failed)); sys.exit(1)
          PY
          node --check design-system/animation.js
      - name: Commit final prototype state and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/reuse-dynamic-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize immersive Reuse prototype and design-system contract"
          git push
