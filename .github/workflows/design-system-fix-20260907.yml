name: Apply portfolio design-system fixes
on:
  push:
    paths:
      - '.github/workflows/design-system-fix-20260907.yml'
permissions:
  contents: write
jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary Reuse prototype
        shell: bash
        run: |
          rm -f himart-reuse-dynamic.html
          rm -f design-system/components/immersive-story.css

      - name: Set canonical hero size and tracking rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('design-system/tokens.css')
          t=p.read_text()
          t=t.replace('--hm-type-hero:82px;','--hm-type-hero:64px;')
          p.write_text(t)

          p=Path('design-system/components/chapter.css')
          t=p.read_text()
          t=t.replace('letter-spacing:-.045em !important;','letter-spacing:var(--hm-track-section) !important;',1)
          t=t.replace('letter-spacing:0 !important;\n  word-break:keep-all !important;','letter-spacing:var(--hm-track-subsection) !important;\n  word-break:keep-all !important;')
          t=t.replace('letter-spacing:0 !important;\n}','letter-spacing:var(--hm-track-body) !important;\n}',1)
          marker='html body.reuse-current.himart-wide-test-page #live-main :is(\n  .hm-subhead > .hm-subno,\n  .data-card-head > .hm-card-no\n){\n  display:block !important;\n  visibility:visible !important;\n  opacity:1 !important;\n  color:var(--hm-blue) !important;\n}'
          replacement=marker[:-1] + '  font-family:var(--hm-font-en)!important;\n  letter-spacing:var(--hm-track-note)!important;\n  word-spacing:normal!important;\n}'
          if marker in t:
              t=t.replace(marker,replacement)
          p.write_text(t)

          p=Path('design-system/index.css')
          t=p.read_text()
          t=t.replace('HIMART Design System v2.1','HIMART Design System v2.2')
          t=t.replace('./tokens.css?v=20260907-4','./tokens.css?v=20260907-5')
          t=t.replace('./components/chapter.css?v=20260907-1','./components/chapter.css?v=20260907-2')
          t=t.replace('@import url("./components/immersive-story.css?v=20260907-1");\n','')
          if './components/progress.css' not in t:
              t=t.replace('@import url("./components/chapter.css?v=20260907-2");\n','@import url("./components/chapter.css?v=20260907-2");\n@import url("./components/progress.css?v=20260907-1");\n')
          p.write_text(t)

          p=Path('design-system/himart-system.css')
          t=p.read_text()
          t=t.replace('@import url("./index.css?v=20260907-5");','@import url("./index.css?v=20260907-6");')
          t=t.replace('HIMART Shared System v1.9','HIMART Shared System v2.0')
          t=t.replace('Canonical type hierarchy: 82 / 52 / 42 / 28 / 16 / 12','Canonical type hierarchy: 64 / 52 / 42 / 28 / 16 / 12')
          p.write_text(t)
          PY

      - name: Add global progress component
        shell: bash
        run: |
          cat > design-system/components/progress.css <<'EOF'
          @import url("../tokens.css");

          /*
            Portfolio global right-side navigator.
            Scope: WORKS + project detail pages only. HOME / ABOUT / CONTACT are excluded by navigation.js.
            The active state never uses the Himart accent palette: idle is white 20%, focused is white 100%.
          */
          html body.portfolio-progress-page :is(.hm-progress,.works-progress){display:none!important}

          html body .hm-global-progress{
            position:fixed;
            z-index:2147483640;
            top:50%;
            right:18px;
            display:grid;
            gap:8px;
            margin:0;
            padding:0;
            transform:translateY(-50%);
          }
          html body .hm-global-progress a{
            display:block;
            margin:0;
            padding:0;
            color:rgba(255,255,255,.20);
            font-family:var(--hm-font-en);
            font-size:10px;
            font-weight:300;
            line-height:1;
            letter-spacing:.04em!important;
            text-decoration:none;
            transition:color .18s ease;
          }
          html body .hm-global-progress a:hover,
          html body .hm-global-progress a:focus-visible{color:rgba(255,255,255,.60)}
          html body .hm-global-progress a.is-active,
          html body .hm-global-progress a[aria-current="true"]{color:rgba(255,255,255,1)}

          @media(max-width:780px){
            html body .hm-global-progress{right:12px}
          }
          @media(prefers-reduced-motion:reduce){
            html body .hm-global-progress a{transition:none}
          }
          EOF

      - name: Fix GNB centering and global navigator runtime
        shell: bash
        run: |
          cat > design-system/navigation.css <<'EOF'
          @import url("./tracking.css?v=20260906-2");

          /* Portfolio global navigation — canonical source based on index.html. */
          html body .top{
            position:fixed!important;
            z-index:50!important;
            inset:0 0 auto!important;
            display:grid!important;
            grid-template-columns:1fr auto 1fr!important;
            align-items:start!important;
            width:100%!important;
            height:auto!important;
            margin:0!important;
            padding:18px var(--pad,34px)!important;
            transform:none!important;
            color:#fff!important;
            mix-blend-mode:difference!important;
            pointer-events:none!important;
          }
          html body .top>*{pointer-events:auto!important}
          html body .top .top-center{
            display:flex!important;
            align-items:flex-start!important;
            justify-content:center!important;
            gap:26px!important;
            margin:0!important;
            padding:0!important;
          }
          html body .top a{
            position:relative!important;
            display:inline-block!important;
            color:#fff!important;
            font-family:'Averta PE',Arial,sans-serif!important;
            font-size:12px!important;
            font-weight:400!important;
            line-height:1.25!important;
            letter-spacing:var(--hm-track-nav,-.011em)!important;
            text-decoration:none!important;
            text-transform:none!important;
            opacity:1!important;
          }
          html body .top a::after{
            content:""!important;
            position:absolute!important;
            right:100%!important;
            bottom:-3px!important;
            left:0!important;
            height:1px!important;
            background:currentColor!important;
            transition:right .3s!important;
          }
          html body .top a:hover::after,
          html body .top a[aria-current="page"]::after{right:0!important}

          /*
            Detail-page centering lock.
            Do NOT put grid-column on the generic .top-center: HOME keeps its legacy absolute centering contract.
            navigation.js assigns .portfolio-progress-page only to WORKS and project detail pages.
          */
          html body.portfolio-progress-page>.top{z-index:2147483646!important}
          html body.portfolio-progress-page>.top .top-center{
            position:static!important;
            grid-column:2!important;
            justify-self:center!important;
            transform:none!important;
          }

          @media(max-width:850px){
            html body .top{padding:17px 18px!important}
            html body .top .top-center{gap:22px!important}
            html body .top a{font-size:11px!important}
          }
          EOF

          cat > design-system/navigation.js <<'EOF'
          /*
            Portfolio global navigation + global right-side chapter navigator.
            HOME / ABOUT / CONTACT never receive the right-side navigator.
          */
          (() => {
            'use strict';

            const links = [
              { label: 'Home', href: './index.html', page: 'home' },
              { label: 'About', href: './about.html', page: 'about' },
              { label: 'Works', href: './works.html', page: 'works' },
              { label: 'Contact', href: './index.html#contact', page: 'contact' }
            ];

            const currentPage = () => {
              const file = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
              if (file === 'about.html') return 'about';
              if (file === 'index.html' || file === '') return 'home';
              return 'works';
            };

            const mountNavigation = active => {
              document.querySelectorAll('body > .top').forEach(node => node.remove());
              document.body.classList.toggle('portfolio-progress-page', active === 'works');
              const items = links.map(({label,href,page}) =>
                '<a href="' + href + '"' + (page === active ? ' aria-current="page"' : '') + '>' + label + '</a>'
              ).join('');
              document.body.insertAdjacentHTML('afterbegin',
                '<nav class="top" aria-label="Global navigation"><div class="top-center">' + items + '</div></nav>'
              );
            };

            const progressTargets = () => {
              if (!document.body.classList.contains('portfolio-progress-page')) return [];
              if (document.body.classList.contains('works-page-body')) {
                return [...document.querySelectorAll('.works-grid .works-card')];
              }
              return [...document.querySelectorAll('#live-main > section.hm-section')]
                .filter(section => section.querySelector('.hm-section-title'));
            };

            const mountProgress = () => {
              document.querySelectorAll('.hm-progress,.works-progress,.hm-global-progress').forEach(node => node.remove());
              const targets = progressTargets();
              if (!targets.length) return;

              const nav = document.createElement('nav');
              nav.className = 'hm-global-progress';
              nav.setAttribute('aria-label', 'Page sections');

              const progressLinks = targets.map((target, index) => {
                if (!target.id) target.id = `portfolio-section-${index + 1}`;
                const link = document.createElement('a');
                link.href = `#${target.id}`;
                link.textContent = String(index + 1).padStart(2, '0');
                link.setAttribute('aria-label', `${index + 1}번째 주요 영역`);
                nav.appendChild(link);
                return link;
              });
              document.body.appendChild(nav);

              let raf = 0;
              const update = () => {
                raf = 0;
                const focusY = window.innerHeight * .5;
                let activeIndex = -1;
                targets.forEach((target, index) => {
                  const rect = target.getBoundingClientRect();
                  if (rect.top <= focusY && rect.bottom >= focusY) activeIndex = index;
                });
                progressLinks.forEach((link, index) => {
                  const active = index === activeIndex;
                  link.classList.toggle('is-active', active);
                  if (active) link.setAttribute('aria-current', 'true');
                  else link.removeAttribute('aria-current');
                });
              };
              const requestUpdate = () => {
                if (raf) return;
                raf = requestAnimationFrame(update);
              };

              window.addEventListener('scroll', requestUpdate, {passive:true});
              window.addEventListener('resize', requestUpdate);
              update();
            };

            const mount = () => {
              const active = currentPage();
              mountNavigation(active);
              if (active === 'works') mountProgress();
            };

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount, {once:true});
            else mount();
          })();
          EOF

      - name: Replace scramble with stale-callback-safe runtime
        shell: bash
        run: |
          cat > design-system/scramble-final.js <<'EOF'
          /*
            HIMART Design System — fail-safe title scramble.
            Authored HTML is immutable source-of-truth; stale animation callbacks are never allowed to write after cancellation.
          */
          (() => {
            'use strict';

            const glyphs = '가나다라마바사아자차카타파하ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            const titleSelector = '#live-main .hm-section-head .hm-section-title.js-scramble, #live-main .hm-section-head .hm-section-title';
            const heroSelector = ':is(.hm-hero,.hm-movie-hero,.ways-hero) .hm-title.js-scramble, :is(.hm-hero,.hm-movie-hero,.ways-hero) .hm-title';
            const stateByElement = new WeakMap();
            const activeAnimations = new Set();
            let heroStarted = false;
            let generation = 0;

            const textNodes = element => {
              const nodes = [];
              const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
              while (walker.nextNode()) {
                if ((walker.currentNode.nodeValue || '').trim()) nodes.push(walker.currentNode);
              }
              return nodes;
            };

            const sameNodes = (element, nodes) => {
              const live = textNodes(element);
              return live.length === nodes.length && live.every((node, index) => node === nodes[index]);
            };

            const stopWithoutRestore = element => {
              const state = stateByElement.get(element);
              if (!state) return;
              state.running = false;
              state.generation = ++generation;
              if (state.raf) cancelAnimationFrame(state.raf);
              state.raf = 0;
              state.completed = false;
              activeAnimations.delete(element);
              element.removeAttribute('data-hm-scramble-active');
              stateByElement.set(element, state);
            };

            const finishScramble = element => {
              const state = stateByElement.get(element);
              if (!state) return;
              state.running = false;
              state.generation = ++generation;
              if (state.raf) cancelAnimationFrame(state.raf);
              state.raf = 0;

              /* Exact authored markup restoration is the final write, including authored <br> structure. */
              if (document.contains(element) && state.originalHTML != null) element.innerHTML = state.originalHTML;

              state.completed = true;
              activeAnimations.delete(element);
              element.removeAttribute('data-hm-scramble-active');
              stateByElement.set(element, state);
            };

            const scramble = (element, kind, replay = false) => {
              if (!element || !document.contains(element)) return false;
              const previous = stateByElement.get(element);
              if (previous?.running) return false;

              const nodes = textNodes(element);
              if (!nodes.length) return false;
              const currentHTML = element.innerHTML;
              const originalHTML = previous?.completed && previous.originalHTML === currentHTML
                ? previous.originalHTML
                : currentHTML;
              const original = nodes.map(node => node.nodeValue || '');
              const signature = original.join('\u0001');
              if (!replay && previous?.completed && previous.signature === signature && previous.originalHTML === currentHTML) return false;

              const state = {
                running:true,
                completed:false,
                visible:true,
                signature,
                original,
                originalHTML,
                raf:0,
                generation:++generation
              };
              stateByElement.set(element, state);
              activeAnimations.add(element);
              element.setAttribute('data-hm-scramble-active', 'true');
              element.setAttribute('data-hm-scramble-kind', kind);

              const duration = 800;
              const totalSteps = 26;
              const startedAt = performance.now();
              const myGeneration = state.generation;

              const render = step => {
                if (stateByElement.get(element) !== state || !state.running || state.generation !== myGeneration) return false;
                if (!sameNodes(element, nodes)) {
                  /* Another runtime replaced the title. Do not overwrite the new authored DOM. */
                  stopWithoutRestore(element);
                  return false;
                }
                nodes.forEach((node, nodeIndex) => {
                  const source = [...original[nodeIndex]];
                  node.nodeValue = source.map((char, charIndex) => {
                    if (/\s/.test(char) || char === '·') return char;
                    const revealAt = Math.floor((charIndex / Math.max(1, source.length)) * totalSteps);
                    return step >= revealAt ? char : glyphs[Math.floor(Math.random() * glyphs.length)];
                  }).join('');
                });
                return true;
              };

              const frame = now => {
                if (stateByElement.get(element) !== state || !state.running || state.generation !== myGeneration) return;
                if (!document.contains(element)) { stopWithoutRestore(element); return; }
                const progress = Math.min(1, Math.max(0, (now - startedAt) / duration));
                const step = Math.min(totalSteps - 1, Math.floor(progress * totalSteps));
                try {
                  if (!render(step)) return;
                } catch {
                  finishScramble(element);
                  return;
                }
                if (progress >= 1) {
                  finishScramble(element);
                  return;
                }
                state.raf = requestAnimationFrame(frame);
              };

              state.raf = requestAnimationFrame(frame);
              return true;
            };

            const isInView = element => {
              const rect = element.getBoundingClientRect();
              return rect.top < innerHeight * .82 && rect.bottom > innerHeight * .08;
            };

            const scanTitles = () => {
              document.querySelectorAll(titleSelector).forEach(title => {
                const state = stateByElement.get(title) || {visible:false,completed:false,running:false};
                const visible = isInView(title);
                if (!visible) {
                  if (state.running) finishScramble(title);
                  const next = stateByElement.get(title) || state;
                  next.visible = false;
                  next.completed = false;
                  stateByElement.set(title, next);
                } else if (!state.visible) {
                  state.visible = true;
                  stateByElement.set(title, state);
                  scramble(title, 'chapter');
                }
              });
            };

            const launchHero = () => {
              if (heroStarted) return;
              const hero = document.querySelector(heroSelector);
              if (!hero) return;
              heroStarted = true;
              if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver(entries => entries.forEach(entry => {
                  if (entry.isIntersecting) {
                    scramble(hero, 'hero');
                    observer.disconnect();
                  }
                }), {threshold:.25});
                observer.observe(hero);
              } else requestAnimationFrame(() => scramble(hero, 'hero'));
            };

            const initialise = () => {
              launchHero();
              scanTitles();
            };

            const waitForContentReady = () => {
              if (document.body?.classList.contains('himart-narrative-ready')) return initialise();
              const timer = setInterval(() => {
                if (document.body?.classList.contains('himart-narrative-ready')) {
                  clearInterval(timer);
                  initialise();
                }
              }, 16);
              setTimeout(() => { clearInterval(timer); initialise(); }, 12000);
              document.addEventListener('himart:narrative-ready', initialise, {once:true});
            };

            const finishAll = () => [...activeAnimations].forEach(finishScramble);
            document.addEventListener('visibilitychange', () => { if (document.hidden) finishAll(); });
            addEventListener('pagehide', finishAll);

            let queued = false;
            addEventListener('scroll', () => {
              if (queued) return;
              queued = true;
              requestAnimationFrame(() => {
                queued = false;
                scanTitles();
              });
            }, {passive:true});

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', waitForContentReady, {once:true});
            else waitForContentReady();
            addEventListener('load', () => setTimeout(initialise, 0), {once:true});
          })();
          EOF

      - name: Remove legacy blue progress controller
        shell: bash
        run: |
          cat > himart-live-boot.js <<'EOF'
          (() => {
            'use strict';
            const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
            const reveal=[...document.querySelectorAll('.hm-reveal')];
            if(reduced) reveal.forEach(n=>n.classList.add('is-in'));
            else if('IntersectionObserver' in window){
              const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-in');io.unobserve(e.target)}}),{threshold:.1,rootMargin:'0px 0px -8% 0px'});
              reveal.forEach(n=>io.observe(n));
            } else reveal.forEach(n=>n.classList.add('is-in'));

            /* Right-side navigation is owned only by design-system/navigation.js + components/progress.css. */
            const flowScript=document.createElement('script');
            flowScript.src='./himart-flow-line-sync-v1.js?v=ca60638';
            document.body.appendChild(flowScript);
          })();
          EOF

      - name: Refresh public page cache references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for p in Path('.').glob('*.html'):
              t=p.read_text()
              t=re.sub(r'\./design-system/himart-system\.css\?v=[^"\']+','./design-system/himart-system.css?v=20260907-9',t)
              t=re.sub(r'\./design-system/index\.css\?v=[^"\']+','./design-system/index.css?v=20260907-7',t)
              t=re.sub(r'\./design-system/tokens\.css\?v=[^"\']+','./design-system/tokens.css?v=20260907-5',t)
              t=re.sub(r'\./design-system/navigation\.css\?v=[^"\']+','./design-system/navigation.css?v=20260907-4',t)
              t=re.sub(r'\./design-system/navigation\.js\?v=[^"\']+','./design-system/navigation.js?v=20260907-4',t)
              t=re.sub(r'\./design-system/scramble-final\.js\?v=[^"\']+','./design-system/scramble-final.js?v=20260907-2',t)
              t=re.sub(r'\./himart-live-boot\.js\?v=[^"\']+','./himart-live-boot.js?v=20260907-2',t)
              p.write_text(t)
          PY

      - name: Update design-system documentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('design-system/README.md')
          t=p.read_text()
          immersive='\n## Immersive storytelling component contract'
          if immersive in t:
              t=t.split(immersive,1)[0].rstrip()+'\n'

          t=t.replace('| Motion | `animation.js` | Himart reveal, counter, hero scroll variable, data-viz draw, viewport video control, single-video sequence |',
                      '| Motion | `animation.js` | Himart reveal, counter, hero scroll variable, data-viz draw, viewport video control, single-video sequence |\n| Progress | `components/progress.css` + `navigation.js` | WORKS/상세 페이지 우측 주요 영역 번호, focus 상태, HOME/ABOUT/CONTACT 제외 |')

          hero_line='- Desktop Hero title은 `--hm-type-hero:64px`을 사용한다. page-local 82px override를 만들지 않는다.\n'
          if hero_line not in t:
              anchor='## HIMART Hero component contract\n\n'
              t=t.replace(anchor,anchor+hero_line)

          scramble='''\n## Scramble animation contract\n\n- 난수 타이틀 애니메이션의 원본은 렌더링 시작 전 `originalHTML`로 고정하며, 애니메이션 도중 작성된 원문을 substring/slice로 재구성하지 않는다.\n- scramble frame은 `requestAnimationFrame` 기반으로만 갱신하고 각 실행에 generation token을 부여한다. 취소된 이전 frame은 DOM에 다시 쓸 수 없다.\n- scroll 이탈, visibility change, pagehide, 예외 종료 시 마지막 write는 반드시 원본 `innerHTML` 복원이다. `<br>`을 포함한 authored markup 전체를 복원해 난수 glyph가 잔존하지 않게 한다.\n- 외부 runtime이 animation 중 title DOM 자체를 교체한 경우 기존 scramble은 즉시 무효화하고 새 DOM을 덮어쓰지 않는다.\n- Hero는 한 번만 실행하고, section title은 viewport 재진입 시 재실행할 수 있으나 같은 element에 두 animation이 동시에 존재할 수 없다.\n'''
          progress='''\n## Global right-side navigator contract\n\n- 우측 navigator는 `navigation.js`가 DOM에서 자동 생성하고 `components/progress.css`가 표현을 단독 소유한다. page-local progress JS/CSS를 추가하지 않는다.\n- 적용 범위는 WORKS와 project detail page다. HOME(`index.html`), ABOUT, CONTACT 영역에는 생성하지 않는다.\n- 상세 페이지는 `#live-main > section.hm-section` 중 `.hm-section-title`을 가진 큰 챕터 수만큼 `01, 02…`를 생성한다. WORKS는 `.works-grid .works-card` 수만큼 생성한다.\n- 기본 번호는 white `20%`, viewport 중앙 focus line이 해당 큰 영역 안에 들어오면 해당 번호만 white `100%`가 된다. active 상태에 blue/accent color를 사용하지 않는다.\n- 기존 `.hm-progress`와 `.works-progress`는 legacy markup으로 간주하고 shared runtime이 제거한다.\n- GNB의 3-column grid에서 중앙 배치는 `.portfolio-progress-page` 범위에만 `grid-column:2`를 적용한다. generic `.top-center`에는 grid-column을 주지 않아 HOME의 기존 absolute centering과 충돌하지 않게 한다.\n'''
          tracking='''\n## Subsection tracking contract\n\n- 42px 중타이틀(`.hm-subtitle`, `.hm-ds-subsection__title`)은 항상 `--hm-track-subsection`을 사용한다. `letter-spacing:0` page/compatibility override를 금지한다.\n- 12px subsection label(`.hm-subno`, `.hm-card-no`)은 Averta PE + `--hm-track-note`를 사용한다. Reuse의 `01.1 / RESEARCH SIGNALS`, `01.2 / SUMMARY`도 예외를 두지 않는다.\n'''
          for block,heading in [(scramble,'## Scramble animation contract'),(progress,'## Global right-side navigator contract'),(tracking,'## Subsection tracking contract')]:
              if heading not in t: t += block
          p.write_text(t)
          PY

      - name: Cross-check 1 — source-level invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          checks={}
          checks['temporary dynamic page removed']=not Path('himart-reuse-dynamic.html').exists()
          checks['temporary immersive component removed']=not Path('design-system/components/immersive-story.css').exists()

          tokens=Path('design-system/tokens.css').read_text()
          checks['desktop hero is 64px']='--hm-type-hero:64px;' in tokens and '--hm-type-hero:82px;' not in tokens

          chapter=Path('design-system/components/chapter.css').read_text()
          checks['subsection title uses tracking token']='letter-spacing:var(--hm-track-subsection) !important;' in chapter
          checks['subsection copy uses body tracking token']='letter-spacing:var(--hm-track-body) !important;' in chapter
          checks['reuse subsection label lock']='letter-spacing:var(--hm-track-note)!important;' in chapter

          index=Path('design-system/index.css').read_text()
          checks['progress component registered']='components/progress.css?v=20260907-1' in index
          checks['immersive import removed']='immersive-story.css' not in index

          navcss=Path('design-system/navigation.css').read_text()
          checks['detail GNB centering is scoped']='body.portfolio-progress-page>.top .top-center' in navcss and 'grid-column:2!important' in navcss
          generic_block=navcss.split('html body .top .top-center{',1)[1].split('}',1)[0]
          checks['generic GNB has no grid-column']='grid-column' not in generic_block

          progress=Path('design-system/components/progress.css').read_text()
          checks['progress idle white 20']='rgba(255,255,255,.20)' in progress
          checks['progress active white 100']='rgba(255,255,255,1)' in progress
          checks['progress component has no blue accent']='var(--hm-blue)' not in progress and '#00A6ED' not in progress

          navjs=Path('design-system/navigation.js').read_text()
          checks['works progress derives from every card']=".works-grid .works-card" in navjs
          checks['detail progress derives from major titles']="section => section.querySelector('.hm-section-title')" in navjs
          checks['home about excluded']="active === 'works'" in navjs and "file === 'about.html'" in navjs and "file === 'index.html'" in navjs
          checks['legacy progress removed by shared runtime']=".hm-progress,.works-progress,.hm-global-progress" in navjs

          live=Path('himart-live-boot.js').read_text()
          checks['legacy blue progress controller removed']='classList.toggle(\'is-active\'' not in live and "querySelectorAll('.hm-progress a')" not in live

          scramble=Path('design-system/scramble-final.js').read_text()
          checks['scramble uses rAF']='requestAnimationFrame(frame)' in scramble
          checks['scramble invalidates stale generation']='stateByElement.get(element) !== state' in scramble and 'state.generation !== myGeneration' in scramble
          checks['scramble restores exact HTML']='element.innerHTML = state.originalHTML' in scramble
          checks['scramble animation itself has no interval']='state.timer' not in scramble and 'setInterval(() => {\n                try' not in scramble

          readme=Path('design-system/README.md').read_text()
          checks['dynamic contract removed']='Immersive storytelling component contract' not in readme
          checks['scramble rule documented']='## Scramble animation contract' in readme
          checks['progress rule documented']='## Global right-side navigator contract' in readme
          checks['tracking rule documented']='## Subsection tracking contract' in readme

          failed=[]
          for name,ok in checks.items():
              print(('PASS' if ok else 'FAIL')+' - '+name)
              if not ok: failed.append(name)
          if failed:
              print('FAILED:',', '.join(failed))
              sys.exit(1)
          PY
          node --check design-system/navigation.js
          node --check design-system/scramble-final.js
          node --check himart-live-boot.js

