name: One-off Works detail copy fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oneoff-works-copy-fix.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Works detail copy contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              "himart_backup_02/himart.html",
              "himart-reuse.html",
              "himart-ways.html",
              "himart-ax.html",
              "himart-team.html",
              "aimmo-system.html",
              "aimmo-graphic.html",
              "trenbe-ut.html",
              "yanolja-system.html",
              "nbt_stepup.html",
              "work_archive.html",
          ]

          version = "20260916-6"
          for name in targets:
              path = Path(name)
              if not path.exists():
                  print(f"SKIP missing: {name}")
                  continue

              text = path.read_text(encoding="utf-8")
              original = text

              # Force every Works detail page to request the current shared system,
              # bypassing stale versioned CSS cached by the browser/CDN.
              text = re.sub(
                  r'(\./design-system/himart-system\.css)\?v=[^\"\']+',
                  rf'\1?v={version}',
                  text,
              )

              # WORK ARCHIVE also links Hero CSS directly after himart-system.css.
              text = re.sub(
                  r'(\./design-system/components/hero\.css)\?v=[^\"\']+',
                  rf'\1?v={version}',
                  text,
              )

              # Major chapter descriptions (01/02/03/04 large left title copy) are
              # removed from source. Hero descriptions and 01.1/02.1 subsection copy stay.
              text = re.sub(
                  r'<p\s+class="[^"]*\bhm-section-desc\b[^"]*"[^>]*>.*?</p>',
                  '',
                  text,
                  flags=re.S,
              )
              text = re.sub(
                  r'<p\s+class="[^"]*\bhm-ds-section__description\b[^"]*"[^>]*>.*?</p>',
                  '',
                  text,
                  flags=re.S,
              )

              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print(f"UPDATED: {name}")
              else:
                  print(f"UNCHANGED: {name}")
          PY

      - name: Remove one-off workflow and commit
        run: |
          rm -f .github/workflows/oneoff-works-copy-fix.yml
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "studiods"
          git config user.email "garci@naver.com"
          git add -A
          git commit -m "Apply Works detail copy contract and bust stale CSS"
          git push origin HEAD:main
