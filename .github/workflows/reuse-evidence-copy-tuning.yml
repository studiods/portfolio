name: Tune Reuse evidence copy
on:
  push:
    paths:
      - '.github/workflows/reuse-evidence-copy-tuning.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Shorten evidence descriptions and register two-line authoring contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Reuse evidence descriptions: reduce roughly 30% while preserving meaning.
          p=Path('himart-reuse.html')
          t=p.read_text()
          replacements={
            '상품을 받기 전에 대금을 보내야 하는 구조 자체가 가장 큰 금전적 불안으로 나타났습니다.':'상품 수령 전 대금을 먼저 보내는 구조가 가장 큰 금전적 불안이었습니다.',
            '거짓된 상품 정보와 상품 상태 사기가 두 번째로 큰 불안 요인이었습니다.':'상품 정보와 실제 상태의 차이가 두 번째 불안 요인이었습니다.',
            '계좌번호·주소·실명처럼 거래에 필요한 개인정보 노출도 심리적 장벽이 됐습니다.':'계좌·주소·실명 등 개인정보 노출도 거래 장벽이었습니다.',
            '특별한 이유 없는 배송 지연과 누락 역시 거래가 끝날 때까지 불안을 남겼습니다.':'배송 지연과 누락도 거래가 끝날 때까지 불안을 남겼습니다.',
            '안전결제 만족 이유 1위는 ‘사기 걱정 없이 안전하다’였습니다. 결제 과정 자체가 신뢰 장치가 됐습니다.':'대금이 바로 넘어가지 않는 안전결제 자체가 신뢰 장치였습니다.',
            '중고거래 플랫폼 이용자는 거래 전에 판매자·구매자의 이전 거래 정보를 확인하며 상대방을 판단했습니다.':'거래 전 상대방의 이력으로 신뢰도를 판단했습니다.',
            '중고물품 구매 시 가장 많이 고려한 요소는 제품 상태였습니다. 상태 정보가 구매 판단의 핵심 근거였습니다.':'제품 상태 정보가 구매 판단의 핵심 근거였습니다.',
            '리퍼비시 제품 조사에서는 전문 매장을 방문해보고 싶다는 응답이 높았습니다. 신뢰할 수 있는 판매 주체에 대한 요구가 확인됐습니다.':'전문 판매처를 직접 확인하려는 요구가 높았습니다.',
          }
          missing=[old for old in replacements if old not in t]
          if missing:
            raise SystemExit('Expected Reuse copy missing: '+repr(missing))
          for old,new in replacements.items():
            t=t.replace(old,new)
          t=t.replace('design-system/himart-system.css?v=20260907-13','design-system/himart-system.css?v=20260907-14')
          p.write_text(t)

          # 2) Shared card contract: evidence copy is authored to fit within two lines.
          p=Path('design-system/components/cards.css')
          t=p.read_text()
          anchor=''' .hm-ds-evidence-stat>.proof-item h4{'''.strip()
          if anchor not in t:
            raise SystemExit('Evidence title rule missing')
          marker='/* Evidence body copy contract: authored to fit within two lines; never clamp or ellipsize. */'
          if marker not in t:
            insert='''\n/* Evidence body copy contract: authored to fit within two lines; never clamp or ellipsize. */\n.hm-ds-evidence-stat>.proof-item p{\n  max-width:100%!important;\n  margin-top:var(--hm-space-24)!important;\n  font-size:var(--hm-type-body)!important;\n  line-height:1.5!important;\n  text-wrap:pretty!important;\n  word-break:keep-all!important;\n}\n'''
            end='''\n}\n\n/*\n  Numbered editorial list.'''
            if end not in t:
              raise SystemExit('Cards insertion point missing')
            t=t.replace(end,'\n}\n'+insert+'\n/*\n  Numbered editorial list.',1)
          p.write_text(t)

          # 3) Cache chain.
          p=Path('design-system/index.css')
          t=p.read_text().replace('components/cards.css?v=20260907-4','components/cards.css?v=20260907-5')
          p.write_text(t)
          p=Path('design-system/himart-system.css')
          t=p.read_text().replace('index.css?v=20260907-9','index.css?v=20260907-10')
          p.write_text(t)

          # 4) Documentation. IMPORTANT: existing subtitle→content spacing is not changed here.
          p=Path('design-system/README.md')
          t=p.read_text()
          heading='## Evidence stat copy contract'
          if heading not in t:
            t += '''\n\n## Evidence stat copy contract\n\n- `hm-ds-evidence-stat`의 설명 문구는 4-column desktop 카드 기준 최대 2줄 안에 들어오도록 짧게 작성한다.\n- 두 줄을 맞추기 위해 `line-clamp`, ellipsis, JS substring을 사용하지 않는다. 길어지면 authored copy 자체를 축약한다.\n- 설명은 `word-break:keep-all` + `text-wrap:pretty`를 사용해 문맥 단위로 자연스럽게 줄바꿈한다.\n- 현재 Reuse의 `voice-group-title` → evidence grid 간격은 기존 `--hm-subtitle-to-content` 규칙(Desktop 80px / Mobile 56px)을 그대로 유지한다. 40px 변경은 별도 승인 전까지 적용하지 않는다.\n'''
            p.write_text(t)
          PY
      - name: Cross-check evidence copy and preserve current spacing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          page=Path('himart-reuse.html').read_text()
          cards=Path('design-system/components/cards.css').read_text()
          reuse=Path('design-system/components/reuse.css').read_text()
          tokens=Path('design-system/tokens.css').read_text()
          index=Path('design-system/index.css').read_text()
          system=Path('design-system/himart-system.css').read_text()
          readme=Path('design-system/README.md').read_text()
          new_copy=[
            '상품 수령 전 대금을 먼저 보내는 구조가 가장 큰 금전적 불안이었습니다.',
            '상품 정보와 실제 상태의 차이가 두 번째 불안 요인이었습니다.',
            '계좌·주소·실명 등 개인정보 노출도 거래 장벽이었습니다.',
            '배송 지연과 누락도 거래가 끝날 때까지 불안을 남겼습니다.',
            '대금이 바로 넘어가지 않는 안전결제 자체가 신뢰 장치였습니다.',
            '거래 전 상대방의 이력으로 신뢰도를 판단했습니다.',
            '제품 상태 정보가 구매 판단의 핵심 근거였습니다.',
            '전문 판매처를 직접 확인하려는 요구가 높았습니다.'
          ]
          checks={
            'all 8 shortened descriptions present': all(x in page for x in new_copy),
            'evidence copy shared rule present': 'Evidence body copy contract' in cards and '.hm-ds-evidence-stat>.proof-item p{' in cards,
            'natural wrapping present': 'text-wrap:pretty!important' in cards and 'word-break:keep-all!important' in cards,
            'no clamp introduced': '-webkit-line-clamp:2' not in cards and 'line-clamp:2' not in cards,
            'existing desktop spacing remains 80': '--hm-subtitle-to-content:80px' in tokens and 'margin-top:var(--hm-subtitle-to-content)!important' in reuse,
            '40px spacing was not applied': 'reuse-proof-grid{margin-top:var(--hm-space-40)' not in reuse.replace('\n',''),
            'cards cache bumped': 'components/cards.css?v=20260907-5' in index,
            'index cache bumped': 'index.css?v=20260907-10' in system,
            'reuse outer cache bumped': 'himart-system.css?v=20260907-14' in page,
            'contract documented': '## Evidence stat copy contract' in readme,
          }
          failed=[]
          for name,ok in checks.items():
            print(('PASS' if ok else 'FAIL')+' - '+name)
            if not ok: failed.append(name)
          if failed:
            print('FAILED:', ', '.join(failed)); sys.exit(1)
          PY
      - name: Commit final state and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/reuse-evidence-copy-tuning.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Shorten Reuse evidence copy and document two-line contract"
          git push
