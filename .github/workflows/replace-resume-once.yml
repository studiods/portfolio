name: Replace About resume once

on:
  push:
    paths:
      - '.github/workflows/replace-resume-once.yml'

permissions:
  contents: write

jobs:
  replace-resume:
    if: github.event.head_commit.message == 'Replace About resume with attached PDF'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Rebuild attached resume PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "assets/docs"
          cat tmp/resume_payload_*.b64 | base64 -d | xz -d > "assets/docs/신동식_이력서_UX & Product Design Lead.pdf"
          echo "701c58e2365a39a1687a666c21015a77fee8a581ee01b73973141044788e03b0  assets/docs/신동식_이력서_UX & Product Design Lead.pdf" | sha256sum -c -
          test "$(stat -c%s "assets/docs/신동식_이력서_UX & Product Design Lead.pdf")" = "144307"

      - name: Remove temporary payload
        shell: bash
        run: |
          rm -f tmp/resume_payload_*.b64
          rmdir tmp 2>/dev/null || true
          rm -f .github/workflows/replace-resume-once.yml

      - name: Commit replacement
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/docs/신동식_이력서_UX & Product Design Lead.pdf" tmp .github/workflows/replace-resume-once.yml 2>/dev/null || true
          git add -u
          git commit -m "Replace About resume PDF"
          git push origin HEAD:main
