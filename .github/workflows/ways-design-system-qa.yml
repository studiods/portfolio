name: Ways design-system consolidation
on:
  push:
    paths:
      - '.github/workflows/ways-design-system-qa.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Consolidate cache contracts and documentation
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          system = root / 'design-system/himart-system.css'
          text = system.read_text()
          text = re.sub(r'@import url\("\.\/index\.css\?v=[^"]+"\);', '@import url("./index.css?v=20260906-11");', text, count=1)
          text = text.replace('HIMART Shared System v1.6', 'HIMART Shared System v1.7')
          system.write_text(text)

          for name in ['himart.html','himart-reuse.html','himart-ways.html','himart-team.html','himart-automation.html']:
            p = root / name
            if not p.exists():
              continue
            t = p.read_text()
            t = re.sub(r'design-system/himart-system\.css\?v=[^"\']+', 'design-system/himart-system.css?v=20260907-7', t)
            t = re.sub(r'design-system/animation\.js\?v=[^"\']+', 'design-system/animation.js?v=20260906-14', t)
            p.write_text(t)

          readme = root / 'design-system/README.md'
          r = readme.read_text()
          if '| Data Viz |' not in r:
            r = r.replace(
              '| Flow | `components/flow.css` | Journey flow group/node/label/responsive 구조 |',
              '| Flow | `components/flow.css` | Journey flow group/node/label/responsive 구조 |\n| Data Viz | `components/data-viz.css` + `animation.js` | Ring, split ratio, segmented ratio, traffic SVG, horizontal bars와 단일 chart reveal |'
            )
          r = r.replace(
            '| Motion | `animation.js` | Himart reveal, counter, hero scroll variable, viewport video control, single-video sequence |',
            '| Motion | `animation.js` | Himart reveal, counter, hero scroll variable, data-viz draw, viewport video control, single-video sequence |'
          )
          if '## HIMART Data Visualization component contract' not in r:
            block = '''\n## HIMART Data Visualization component contract\n\n- `components/data-viz.css`가 Himart 계열의 수치·비율 시각화를 단독 소유하며 case page에 그래프용 `<style>` 또는 별도 page CSS를 만들지 않는다.\n- 원형 비율(`hm-ds-ring-row` / `hm-ds-ring-card`), 65:35 분할(`hm-ds-split-ratio`), 분할 막대(`hm-ds-segmented-bar`), Traffic SVG(`hm-ds-traffic`), 가로 막대(`hm-ds-home-bars`)를 공통 컴포넌트로 사용한다.\n- 컴포넌트의 구조·좌표·색상 문법은 승인된 Himart 그래프 소스에서 이관한다. Deep Blue `#0572CB`, Blue `#00A6ED`, New Blue `#00B8DE`, Green `#00EDBD`, Yellow `#F3EB01`, Red `#FA481B`를 유지한다.\n- 그래프 안의 폰트·행간·자간·본문 대비는 새 규칙을 만들지 않고 기존 `tokens.css`와 `typography.css` 값만 사용한다. SVG 내부에도 별도 font-family를 선언하지 않는다.\n- ENTRY CHANNEL 원본 비율 `52 / 31 / 10 / 6 / 1`, HOME 원본 값 `49.6 / 33.8 / 8.3 / 3.4 / 1.2 / 0.3`, Traffic SVG의 `1160×330` viewBox와 series 좌표는 원본 구조를 보존한다.\n- `animation.js`가 `[data-hm-chart]`를 한 번만 관찰해 `is-hm-chart-active`를 부여한다. Traffic chart의 line/bar stroke drawing도 이 단일 runtime이 담당하며 별도 page observer를 추가하지 않는다.\n- 실제 근거가 없는 백분율이나 성과 수치는 만들지 않는다. Ways의 AS-IS 분할 막대와 TO-BE 진행 막대는 각각 4단계/7단계라는 페이지에 이미 존재하는 구조만 시각화하며 성과 비율로 표현하지 않는다.\n- 신규 페이지에서 수치가 존재하면 위 컴포넌트 중 정보 의미에 맞는 것을 재사용하고, 그래프의 구조나 palette를 page에서 변형하지 않는다.\n\n'''
            r = r.replace('## WORKS component contract', block + '## WORKS component contract')
          readme.write_text(r)

          qa = root / 'design-system/qa-matrix.md'
          q = qa.read_text()
          if '## Ways 디자인 시스템 회귀 확인 (2026-09-06)' not in q:
            q += '''\n\n## Ways 디자인 시스템 회귀 확인 (2026-09-06)\n\n- `himart-ways.html` 내부 `<style>` / `style=` / page-specific stylesheet가 없어야 한다.\n- Hero는 Himart/ReUse와 동일한 `hm-ds-hero hm-ds-hero--scroll-cover` → `hm-ds-hero__inner` → `hm-ds-hero__copy` + `hm-ds-hero__bottom` → `hm-ds-hero__meta` 구조여야 한다.\n- 01~04 모든 major section은 `hm-section hm-ds-section`, 모든 container는 `hm-wrap hm-ds-wrap`을 사용한다.\n- 원칙/역할의 Roman list는 `hm-ds-numbered-list`만 사용하며 번호·타이틀 동일 라인, 설명 하단 규칙을 유지한다.\n- AS-IS 4단계는 canonical segmented-bar 구조를 재사용하며 퍼센트 수치를 만들지 않는다.\n- TO-BE 7단계는 canonical HOME horizontal-bar 구조를 process progression으로 재사용하며 `01/07~07/07`만 표시한다.\n- `components/data-viz.css`는 `design-system/index.css`에서 한 번만 import되어야 한다.\n- `animation.js`의 `[data-hm-chart]` observer는 graph reveal의 단일 owner여야 한다.\n- Traffic SVG는 `viewBox=0 0 1160 330`, 기존 session/purchase/CVR 좌표를 유지하고 SVG 내부 새 font-family를 만들지 않는다.\n- 모바일 780px 이하에서 numbered list·split ratio·ring row·flow가 단일 열로 내려가며 가로 overflow가 없어야 한다.\n- GitHub Pages build 성공과 정적 구조 PASS를 확인한 뒤 브라우저 픽셀 검증을 별도 기록한다.\n'''
          qa.write_text(q)

      - name: Static design-system validation
        shell: python
        run: |
          from pathlib import Path
          import re, sys

          ways = Path('himart-ways.html').read_text()
          dv = Path('design-system/components/data-viz.css').read_text()
          anim = Path('design-system/animation.js').read_text()
          index = Path('design-system/index.css').read_text()
          tokens = Path('design-system/tokens.css').read_text()
          system = Path('design-system/himart-system.css').read_text()

          checks = {
            'ways has no inline style block': '<style' not in ways.lower(),
            'ways has no style attribute': re.search(r'\sstyle\s*=', ways, re.I) is None,
            'ways has no page css': 'himart-ways.css' not in ways and 'ways.css' not in ways,
            'canonical hero': 'hm-ds-hero hm-ds-hero--scroll-cover' in ways and 'hm-ds-hero__meta' in ways,
            'four canonical sections': ways.count('class="hm-section hm-ds-section"') == 4,
            'canonical wraps': ways.count('hm-wrap hm-ds-wrap') >= 6,
            'numbered list reused': ways.count('hm-ds-numbered-list') >= 3,
            'segmented graph reused': 'hm-ds-segmented-bar' in ways and 'data-hm-chart' in ways,
            'home-bar graph reused': 'hm-ds-home-bars' in ways and '01 / 07' in ways and '07 / 07' in ways,
            'no fabricated percent in Ways': '%' not in ways,
            'data viz imported once': index.count('components/data-viz.css') == 1,
            'deep blue exact': '--hm-blue-deep:#0572CB' in tokens,
            'canonical palette': all(x in tokens for x in ['#00A6ED','#00B8DE','#00EDBD','#F3EB01','#FA481B']),
            'no new font face in data viz': '@font-face' not in dv,
            'traffic viewbox exact': 'viewBox="0 0 1160 330"' in anim,
            'traffic purchase points exact': '145,78 325,182 505,184 685,183 865,132 1045,117' in anim,
            'traffic cvr points exact': '145,170 325,85 505,185 685,240 865,226 1045,174' in anim,
            'single chart observer contract': "document.querySelectorAll('[data-hm-chart]')" in anim and 'is-hm-chart-active' in anim,
            'fresh nested index cache': 'index.css?v=20260906-11' in system,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
            print(('PASS' if ok else 'FAIL'), '-', name)
          if failed:
            print('FAILED:', ', '.join(failed))
            sys.exit(1)

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/ways-design-system-qa.yml
      - name: Commit consolidation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Consolidate Ways into Himart design system"
          git push
