name: Align Himart hero structure

on:
  push:
    branches: [main]
    paths:
      - '.hero-align/READY'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Himart and Reuse hero to design system
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  print(f'[skip] {path}: pattern not found: {old[:80]!r}')
                  return
              p.write_text(s.replace(old, new), encoding='utf-8')
              print(f'[ok] {path}')

          replace('design-system/himart-system.css',
                  '@import url("./index.css?v=20260906-8");',
                  '@import url("./index.css?v=20260906-9");')
          replace('design-system/himart-system.css',
                  'HIMART Shared System v1.3 — sole final-authority layer.',
                  'HIMART Shared System v1.5 — sole final-authority layer.')

          replace('himart.html',
                  './design-system/himart-system.css?v=20260907-3',
                  './design-system/himart-system.css?v=20260907-4')
          replace('himart.html',
                  '<header class="hm-hero hm-movie-hero hm-ds-hero" id="top"',
                  '<header class="hm-hero hm-movie-hero hm-ds-hero hm-ds-hero--scroll-cover" id="top"')
          replace('himart.html',
                  '<div class="hm-wrap hm-ds-hero__inner">',
                  '<div class="hm-wrap hm-ds-wrap hm-ds-hero__inner">')
          replace('himart.html',
                  '<div class="hm-hero-bottom">',
                  '<div class="hm-hero-bottom hm-ds-hero__bottom">')

          replace('himart-reuse.html',
                  './design-system/himart-system.css?v=20260906-8',
                  './design-system/himart-system.css?v=20260907-4')

          readme = Path('design-system/README.md')
          s = readme.read_text(encoding='utf-8')
          anchor = '## HIMART Hero component contract\n\n'
          note = ('- Himart/ReUse movie Hero의 canonical DOM은 `hm-ds-hero hm-ds-hero--scroll-cover` → '
                  '`hm-ds-hero__inner` → `hm-ds-hero__copy` + `hm-ds-hero__bottom` → `hm-ds-hero__meta` 순서로 통일한다.\n'
                  '- `components/hero.css`가 Hero의 position/height/copy center/bottom rail/meta typography를 단독 소유하며, '
                  '`final-tuning.css`나 case page에서 Hero selector를 다시 정의하지 않는다.\n'
                  '- Legacy `himart-narrative-v2-production.css`의 `.himart-wide-test-page`/`.hm-hero-bottom` 규칙은 '
                  '이전 호환성용이며 canonical `hm-ds-*` Hero selector가 항상 우선한다.\n'
                  '- Himart와 ReUse는 동일한 `himart-system.css` cache version을 사용해 서로 다른 cached import tree가 적용되지 않게 한다.\n')
          if note not in s:
              s = s.replace(anchor, anchor + note)
              readme.write_text(s, encoding='utf-8')

      - name: Remove one-shot workflow scaffolding
        shell: bash
        run: |
          git rm -r .hero-align
          git rm .github/workflows/align-himart-hero.yml
      - name: Commit alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system/himart-system.css design-system/README.md himart.html himart-reuse.html
          git commit -m "Align Himart and Reuse hero to canonical design system"
          git push origin HEAD:main
