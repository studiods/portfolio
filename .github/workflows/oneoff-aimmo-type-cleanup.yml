name: One-off AIMMO typography cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-aimmo-type-cleanup.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update AIMMO 02.1 02.3 03.2
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('aimmo-system.html')
          css_path = Path('design-system/components/aimmo-system-v8.css')
          html = html_path.read_text(encoding='utf-8')
          css = css_path.read_text(encoding='utf-8')

          # Cache-bust the final AIMMO layer.
          html = re.sub(r'aimmo-system-v8\.css\?v=[^"\']+', 'aimmo-system-v8.css?v=20260917-3', html)

          # 02.3: merge each title + body into one concise title line block.
          start = html.index('<span class="hm-card-no">02.3</span>')
          end = html.index('</div></article>', start) + len('</div></article>')
          block = html[start:end]
          merged = [
              '저조도·장시간 작업 환경을 고려해 전체 화면을 다크 모드로 전환했습니다.',
              '행동·상태 대비를 명확히 하고 실제 장비 기준으로 컬러를 다시 조정했습니다.',
              '주요 사용 장비를 기준으로 컴포넌트 크기와 간격을 다시 설정했습니다.',
              '그래픽 표현과 활용 규칙을 통일하고 해외 적용을 위한 영문 가이드까지 만들었습니다.'
          ]
          pattern = re.compile(r'<strong>.*?</strong><p>.*?</p>', re.S)
          matches = list(pattern.finditer(block))
          if len(matches) != 4:
              raise SystemExit(f'Expected 4 merged 02.3 captions, found {len(matches)}')
          idx = 0
          def repl(_):
              global idx
              value = merged[idx]
              idx += 1
              return f'<strong>{value}</strong>'
          block = pattern.sub(repl, block)
          html = html[:start] + block + html[end:]

          # 03.2: shorten index labels to numbers only and remove all body copy inside image cards.
          journey_start = html.index('<section class="hm-section hm-ds-section" id="journey"')
          section_end = html.index('</section>', journey_start) + len('</section>')
          journey = html[journey_start:section_end]
          label_map = {
              '01 · OWNERSHIP BUILD': '01',
              '02 · CROSS REVIEW': '02',
              '03 · PRODUCT ADOPTION': '03',
              '04 · DESIGN × DEV ALIGNMENT': '04',
          }
          for old, new in label_map.items():
              journey = journey.replace(f'<span>{old}</span>', f'<span>{new}</span>')

          app_start = journey.index('<div class="aimmo-application-gallery')
          app_end = journey.index('</div></div>', app_start) + len('</div>')
          app = journey[app_start:app_end]
          app, removed = re.subn(r'<p>.*?</p>', '', app, flags=re.S)
          if removed != 4:
              raise SystemExit(f'Expected 4 removed 03.2 body copies, found {removed}')
          journey = journey[:app_start] + app + journey[app_end:]
          html = html[:journey_start] + journey + html[section_end:]

          # Final page-specific typography layer.
          css = re.sub(
              r'html body\.aimmo-system-page #journey \.aimmo-application-gallery__item figcaption span\{.*?\n\}',
              '''html body.aimmo-system-page #journey .aimmo-application-gallery__item figcaption span{\n  display:block!important;\n  margin:0 0 10px!important;\n  color:var(--hm-blue)!important;\n  font-family:var(--hm-font-en)!important;\n  font-size:12px!important;\n  font-weight:400!important;\n  letter-spacing:var(--hm-track-note)!important;\n}''',
              css,
              flags=re.S
          )
          css = re.sub(
              r'html body\.aimmo-system-page #journey \.aimmo-application-gallery__item figcaption h4\{.*?\n\}',
              '''html body.aimmo-system-page #journey .aimmo-application-gallery__item figcaption h4{\n  margin:0!important;\n  max-width:30ch!important;\n  color:#fff!important;\n  font-family:var(--hm-font-ko)!important;\n  font-size:22px!important;\n  font-weight:300!important;\n  line-height:1.35!important;\n  word-break:keep-all!important;\n}''',
              css,
              flags=re.S
          )
          css = re.sub(
              r'html body\.aimmo-system-page #journey \.aimmo-application-gallery__item figcaption p\{.*?\n\}',
              '',
              css,
              flags=re.S
          )
          css = css.replace('font-size:18px!important;\n  }\n}', 'font-size:22px!important;\n  }\n}')

          css += '''\n\n/* v8.1 — AIMMO requested title hierarchy. */\nhtml body.aimmo-system-page #data .data-list > .data-card:first-child .data-card-head h3{\n  font-size:22px!important;\n  line-height:1.35!important;\n}\nhtml body.aimmo-system-page #data .aimmo-improvement-gallery .aimmo-evidence-card figcaption strong{\n  display:block!important;\n  max-width:30ch!important;\n  margin:0!important;\n  color:#fff!important;\n  font-family:var(--hm-font-ko)!important;\n  font-size:22px!important;\n  font-weight:300!important;\n  font-variation-settings:"wght" 300!important;\n  line-height:1.35!important;\n  word-break:keep-all!important;\n}\nhtml body.aimmo-system-page #data .aimmo-improvement-gallery .aimmo-evidence-card figcaption p{\n  display:none!important;\n}\n'''

          html_path.write_text(html, encoding='utf-8')
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('aimmo-system.html').read_text(encoding='utf-8')
          css = Path('design-system/components/aimmo-system-v8.css').read_text(encoding='utf-8')
          assert '02.3' in html
          assert '<span>01 · OWNERSHIP BUILD</span>' not in html
          assert '<span>01</span><h4>영역을 나누고' in html
          assert 'aimmo-system-v8.css?v=20260917-3' in html
          assert 'font-size:22px!important;' in css
          assert 'font-size:12px!important;' in css
          PY
          rm .github/workflows/oneoff-aimmo-type-cleanup.yml
          git config user.name 'studiods'
          git config user.email 'garci@naver.com'
          git add aimmo-system.html design-system/components/aimmo-system-v8.css .github/workflows/oneoff-aimmo-type-cleanup.yml
          git commit -m 'Refine AIMMO gallery typography and labels'
          git push
