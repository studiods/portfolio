name: Refine Reuse 02.2 cycle reset
on:
  push:
    paths:
      - '.github/workflows/refine-reuse-022-cycle.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cycle update
        run: python .github/scripts/refine_reuse_022_cycle.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/refine-reuse-022-cycle.yml
          rm -f .github/scripts/refine_reuse_022_cycle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Reuse 02.2 held fill cycle"
          git push
