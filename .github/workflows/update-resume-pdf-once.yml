name: One-time resume PDF update

on:
  push:
    paths:
      - '.github/workflows/update-resume-pdf-once.yml'

permissions:
  contents: write

jobs:
  update-resume:
    if: github.event.head_commit.message == 'Run one-time resume PDF update'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyMuPDF
        run: pip install pymupdf==1.26.4

      - name: Update resume PDF
        run: python scripts/update_resume_pdf_once.py

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "assets/docs/신동식_이력서_UX & Product Design Lead.pdf"
          if git diff --cached --quiet; then
            echo "No PDF changes detected."
          else
            git commit -m "Update resume month dates and contact number"
            git push origin HEAD:main
          fi
