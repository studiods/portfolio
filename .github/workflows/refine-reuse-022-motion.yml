name: Refine Reuse 02.2 focus motion
"on":
  push:
    paths:
      - .github/workflows/refine-reuse-022-motion.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify
        run: python .github/scripts/apply_reuse_022_motion.py
      - name: Commit changes
        run: |
          rm -f .github/workflows/refine-reuse-022-motion.yml
          rm -f .github/scripts/apply_reuse_022_motion.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Animate Reuse 02.2 confidence flow"
          git push
