name: Verify Himart Static Candidate

on:
  push:
    branches:
      - work/himart-optimized-rebuild-20260922
    paths:
      - "himart-optimized-test.html"
      - "design-system/**"
      - ".github/workflows/verify-himart-static-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Check static-content contract
        shell: bash
        run: |
          set -euo pipefail
          test -f himart-optimized-test.html
          rg -q 'hm-static-candidate' himart-optimized-test.html
          ! rg -q 'content-runtime\.js|test-content-loader\.js|himart-narrative-v2-production-base\.js|test-content-final\.js|himart-wide-editorial-adapter\.js' himart-optimized-test.html
          rg -q '왜 고객들이 하이마트를 선택하지 않는지부터 확인했습니다\.' himart-optimized-test.html
          rg -q '그리고 실제로 고객들이 서비스를 어떻게 이용하고 있는지도 살펴봤습니다\.' himart-optimized-test.html
          rg -q '앞선 데이터를 바탕으로, 구매 여정의 흐름과 각 화면의 역할을 다시 정의했습니다\.' himart-optimized-test.html
          rg -q '정의한 흐름과 여정별 정의를 바탕으로 빠르게 프로토타입을 만들고, 검증을 반복하고 있습니다\.' himart-optimized-test.html

      - name: Capture desktop and mobile renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes playwright@1.55.0 install --with-deps chromium
          npx --yes playwright@1.55.0 screenshot --device="Desktop Chrome" --full-page "file://${GITHUB_WORKSPACE}/himart-optimized-test.html" artifacts/himart-desktop.png
          npx --yes playwright@1.55.0 screenshot --device="iPhone 13" --full-page "file://${GITHUB_WORKSPACE}/himart-optimized-test.html" artifacts/himart-mobile.png

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: himart-static-candidate-renders
          path: artifacts/
          if-no-files-found: error
