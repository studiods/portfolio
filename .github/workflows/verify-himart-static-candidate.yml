name: Verify Himart Static Candidate

on:
  push:
    branches:
      - work/himart-optimized-rebuild-20260922
    paths:
      - "himart-optimized-test.html"
      - "design-system/pages/himart-live-dom-contract.json"
      - "scripts/verify-himart-static-candidate.mjs"
      - "scripts/capture-himart-static-candidate.spec.mjs"
      - ".github/workflows/verify-himart-static-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4

      - name: Check static-content contract
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-himart-static-candidate.mjs \
            himart-optimized-test.html \
            design-system/pages/himart-live-dom-contract.json \
            artifacts/himart-static-contract-result.json

      - name: Capture desktop and mobile renders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          npx --yes @playwright/test@1.55.0 install --with-deps chromium
          npx --yes @playwright/test@1.55.0 test scripts/capture-himart-static-candidate.spec.mjs

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: himart-static-candidate-renders
          path: artifacts/
          if-no-files-found: error
