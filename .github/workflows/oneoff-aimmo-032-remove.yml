name: One-off AIMMO 03.2 cleanup
on:
  push:
    paths:
      - '.github/workflows/oneoff-aimmo-032-remove.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove old 03.2 and renumber 03.3
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aimmo-system.html')
          s = p.read_text(encoding='utf-8')
          start_marker = '<div class="hm-subsection hm-ds-subsection hm-reveal"><div class="hm-subhead"><span class="hm-subno">03.2</span>'
          next_marker = '<div class="hm-subsection hm-ds-subsection hm-reveal"><div class="hm-subhead"><span class="hm-subno">03.3</span>'
          start = s.find(start_marker)
          if start < 0:
              raise SystemExit('03.2 block not found')
          next_start = s.find(next_marker, start + len(start_marker))
          if next_start < 0:
              raise SystemExit('03.3 block not found')
          # Remove the complete old 03.2 block plus the blank separator immediately before 03.3.
          prefix = s[:start]
          suffix = s[next_start:]
          suffix = suffix.replace('<span class="hm-subno">03.3</span>', '<span class="hm-subno">03.2</span>', 1)
          s = prefix + suffix
          # Cross-check chapter 03 numbering is now exactly 03.1 / 03.2 with no 03.3.
          journey_start = s.find('<section class="hm-section hm-ds-section" id="journey"')
          direction_start = s.find('<section class="hm-section hm-ds-section" id="direction"', journey_start)
          journey = s[journey_start:direction_start]
          nums = []
          import re
          nums = re.findall(r'<span class="hm-subno">(03\.\d+)</span>', journey)
          if nums != ['03.1', '03.2']:
              raise SystemExit(f'Unexpected chapter 03 numbering: {nums}')
          if 'aimmo-family-gallery' in journey:
              raise SystemExit('Old 03.2 family gallery still remains')
          p.write_text(s, encoding='utf-8')
          print('Verified chapter 03 numbering:', nums)
          PY
      - name: Commit cleanup and remove workflow
        run: |
          rm .github/workflows/oneoff-aimmo-032-remove.yml
          git config user.name "studiods"
          git config user.email "garci@naver.com"
          git add aimmo-system.html .github/workflows/oneoff-aimmo-032-remove.yml
          git commit -m "Remove AIMMO 03.2 and renumber application block"
          git push
