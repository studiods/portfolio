name: Rollback Reuse 02.2 to eight circles
'on':
  push:
    paths:
      - '.github/workflows/rollback-reuse-022-eight.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore original eight-circle 02.2
        shell: bash
        run: |
          git checkout 43024868679d842e28dcba4860ae82cc1c285ecc -- \
            design-system/components/reuse-confidence.css \
            design-system/reuse-confidence-motion.js \
            design-system/index.css \
            design-system/himart-system.css \
            himart-reuse.html
          rm -f .github/workflows/rollback-reuse-022-eight.yml
      - name: Verify rollback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('himart-reuse.html').read_text()
          css = Path('design-system/components/reuse-confidence.css').read_text()
          js = Path('design-system/reuse-confidence-motion.js').read_text()
          checks = {
            '8-circle markup restored': html.count('reuse-confidence-node is-trust') == 4 and '<span>08</span><h4>A/S·관리</h4>' in html,
            'insertion markup removed': 'data-reuse-confidence-stage' not in html and 'data-trust-step' not in html,
            'old row layout restored': 'reuse-confidence-row' in html and 'grid-template-columns:minmax(0,1fr) 30.8px' in css,
            'old pulse motion restored': 'PULSE_DURATION = 1700' in js and 'FINAL_HOLD = 2000' in js,
            'FLIP wrap motion removed': 'animateWrappedItem' not in js and 'reuse-confidence-ghost' not in css,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
          if failed:
              raise SystemExit('Rollback verification failed: ' + ', '.join(failed))
          PY
      - name: Commit rollback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rollback Reuse 02.2 to original eight-circle flow"
          git push
