name: Refine Reuse 02.2 line pulse opacity
on:
  push:
    paths:
      - '.github/workflows/refine-reuse-022-line-opacity.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify opacity change
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('design-system/components/reuse-confidence.css')
          c = p.read_text()
          old = '50%{border-color:rgba(255,255,255,.80)}'
          new = '50%{border-color:rgba(255,255,255,.50)}'
          if old not in c:
              raise SystemExit('standard pulse opacity marker missing')
          c = c.replace(old, new, 1)
          p.write_text(c)

          p = Path('design-system/index.css')
          i = p.read_text()
          if './components/reuse-confidence.css?v=20260908-12' not in i:
              raise SystemExit('component cache marker missing')
          i = i.replace('HIMART Design System v4.4','HIMART Design System v4.5',1)
          i = i.replace('./components/reuse-confidence.css?v=20260908-12','./components/reuse-confidence.css?v=20260908-13',1)
          p.write_text(i)

          p = Path('design-system/himart-system.css')
          s = p.read_text()
          if './index.css?v=20260908-39' not in s:
              raise SystemExit('system cache marker missing')
          s = s.replace('./index.css?v=20260908-39','./index.css?v=20260908-40',1)
          s = s.replace('HIMART Shared System v3.3','HIMART Shared System v3.4',1)
          p.write_text(s)

          p = Path('himart-reuse.html')
          h = p.read_text()
          if './design-system/himart-system.css?v=20260908-44' not in h:
              raise SystemExit('page cache marker missing')
          h = h.replace('./design-system/himart-system.css?v=20260908-44','./design-system/himart-system.css?v=20260908-45',1)
          p.write_text(h)

          assert '50%{border-color:rgba(255,255,255,.50)}' in Path('design-system/components/reuse-confidence.css').read_text()
          PY
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/refine-reuse-022-line-opacity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set Reuse 02.2 line pulse to 50 percent"
          git push
