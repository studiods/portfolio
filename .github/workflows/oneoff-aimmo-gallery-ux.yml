name: One-off AIMMO gallery UX migration

on:
  push:
    paths:
      - '.github/workflows/oneoff-aimmo-gallery-ux.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update AIMMO gallery UX
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # AIMMO Graphic page-only gallery ratio + tighter copy-to-gallery rhythm.
          path = Path('design-system/components/aimmo-graphic-v2.css')
          text = path.read_text(encoding='utf-8')
          if '--hm-ds-media-carousel-ratio:2/1;' not in text:
              raise SystemExit('AIMMO carousel ratio token not found')
          text = text.replace('--hm-ds-media-carousel-ratio:2/1;', '--hm-ds-media-carousel-ratio:16/9;', 1)
          if 'aspect-ratio:2/1!important;' not in text:
              raise SystemExit('AIMMO wide gallery ratio not found')
          text = text.replace('aspect-ratio:2/1!important;', 'aspect-ratio:16/9!important;', 1)
          page_rules = '''\n\n/* AIMMO Graphic page-only gallery contract — 2026-09-18 v7. */\nhtml body.aimmo-graphic-page .hm-ds-media-gallery__item{\n  aspect-ratio:16/9!important;\n}\nhtml body.aimmo-graphic-page #brand .hm-subhead + .aimmo-wide-gallery,\nhtml body.aimmo-graphic-page #data .data-card-head + .hm-ds-media-gallery-stack,\nhtml body.aimmo-graphic-page #journey .hm-subhead + .hm-ds-media-gallery-stack,\nhtml body.aimmo-graphic-page #journey .hm-subhead + .hm-ds-media-carousel{\n  margin-top:40px!important;\n}\n'''
          if 'AIMMO Graphic page-only gallery contract — 2026-09-18 v7.' not in text:
              text += page_rules
          path.write_text(text, encoding='utf-8')

          # Shared gallery system: adaptive controls/status + navigable lightbox using the same motion language.
          path = Path('design-system/components/media-gallery.css')
          text = path.read_text(encoding='utf-8')
          shared_rules = '''\n\n/* Adaptive gallery controls + navigable lightbox — shared contract v3.\n   Difference blending keeps arrows/page status legible on light and dark imagery. */\nhtml body.himart-page-body .hm-ds-media-carousel .hm-ds-gallery-nav::before{\n  border-top-color:#fff!important;\n  border-right-color:#fff!important;\n  mix-blend-mode:difference!important;\n}\nhtml body.himart-page-body .hm-ds-media-carousel__status{\n  color:#fff!important;\n  opacity:.78!important;\n  mix-blend-mode:difference!important;\n}\n.hm-ds-image-lightbox__viewport{\n  position:relative!important;\n  width:100%!important;\n  max-height:calc(100dvh - 96px)!important;\n  overflow:hidden!important;\n}\n.hm-ds-image-lightbox__image{\n  position:relative!important;\n  z-index:2!important;\n  width:100%!important;\n  transform:translate3d(0,0,0) scale(1)!important;\n  transform-origin:50% 50%!important;\n  will-change:transform,opacity!important;\n}\n.hm-ds-image-lightbox__image--incoming{\n  position:absolute!important;\n  z-index:1!important;\n  inset:0!important;\n  width:100%!important;\n  height:100%!important;\n  max-height:none!important;\n  object-fit:contain!important;\n  opacity:0!important;\n  visibility:hidden!important;\n  pointer-events:none!important;\n  transform:translate3d(5%,0,0) scale(.95)!important;\n}\n.hm-ds-image-lightbox__image--incoming.is-next{\n  opacity:1!important;\n  visibility:visible!important;\n  transform:translate3d(5%,0,0) scale(.95)!important;\n  transition:transform var(--hm-ds-media-carousel-transition,720ms) cubic-bezier(.22,.76,.22,1),opacity var(--hm-ds-media-carousel-transition,720ms) ease!important;\n}\n.hm-ds-image-lightbox__image--incoming.is-next.is-entering{\n  transform:translate3d(0,0,0) scale(1)!important;\n}\n.hm-ds-image-lightbox__image.is-exiting{\n  z-index:3!important;\n  transform:translate3d(-100%,0,0) scale(1)!important;\n  transition:transform var(--hm-ds-media-carousel-transition,720ms) cubic-bezier(.22,.76,.22,1),opacity var(--hm-ds-media-carousel-transition,720ms) ease!important;\n}\n.hm-ds-image-lightbox.is-reverse .hm-ds-image-lightbox__image--incoming.is-next{\n  transform:translate3d(-5%,0,0) scale(.95)!important;\n}\n.hm-ds-image-lightbox.is-reverse .hm-ds-image-lightbox__image--incoming.is-next.is-entering{\n  transform:translate3d(0,0,0) scale(1)!important;\n}\n.hm-ds-image-lightbox.is-reverse .hm-ds-image-lightbox__image.is-exiting{\n  transform:translate3d(100%,0,0) scale(1)!important;\n}\n.hm-ds-image-lightbox__nav{\n  position:absolute!important;\n  z-index:6!important;\n  top:0!important;\n  bottom:0!important;\n  width:var(--hm-gallery-nav-hit-width,10%)!important;\n  height:100%!important;\n  margin:0!important;\n  padding:0!important;\n  border:0!important;\n  outline:0!important;\n  background:transparent!important;\n  cursor:pointer!important;\n}\n.hm-ds-image-lightbox__nav--prev{left:0!important;right:auto!important}\n.hm-ds-image-lightbox__nav--next{right:0!important;left:auto!important}\n.hm-ds-image-lightbox__nav::before{\n  content:\"\"!important;\n  position:absolute!important;\n  top:50%!important;\n  width:var(--hm-gallery-nav-arrow-size,18px)!important;\n  height:var(--hm-gallery-nav-arrow-size,18px)!important;\n  border-top:1px solid #fff!important;\n  border-right:1px solid #fff!important;\n  box-sizing:border-box!important;\n  mix-blend-mode:difference!important;\n}\n.hm-ds-image-lightbox__nav--prev::before{\n  left:var(--hm-gallery-nav-arrow-edge,30px)!important;\n  transform:translate(-35%,-50%) rotate(-135deg)!important;\n}\n.hm-ds-image-lightbox__nav--next::before{\n  right:var(--hm-gallery-nav-arrow-edge,30px)!important;\n  transform:translate(35%,-50%) rotate(45deg)!important;\n}\n.hm-ds-image-lightbox__nav[hidden]{display:none!important}\n@media(max-width:780px){\n  .hm-ds-image-lightbox__viewport{max-height:calc(100dvh - 48px)!important}\n  .hm-ds-image-lightbox__nav::before{\n    width:var(--hm-gallery-nav-arrow-size-mobile,14px)!important;\n    height:var(--hm-gallery-nav-arrow-size-mobile,14px)!important;\n  }\n  .hm-ds-image-lightbox__nav--prev::before{left:var(--hm-gallery-nav-arrow-edge-mobile,21px)!important}\n  .hm-ds-image-lightbox__nav--next::before{right:var(--hm-gallery-nav-arrow-edge-mobile,21px)!important}\n}\n@media(prefers-reduced-motion:reduce){\n  .hm-ds-image-lightbox__image,\n  .hm-ds-image-lightbox__image--incoming{transition:none!important}\n}\n'''
          if 'Adaptive gallery controls + navigable lightbox — shared contract v3.' not in text:
              text += shared_rules
          path.write_text(text, encoding='utf-8')

          # Shared gallery JS: navigate image groups in the lightbox with carousel-equivalent transitions.
          path = Path('design-system/media-gallery.js')
          text = path.read_text(encoding='utf-8')
          old = '''  let lightbox = null;\n  let lightboxImage = null;\n  let closeButton = null;\n  let lastTrigger = null;'''
          new = '''  let lightbox = null;\n  let lightboxImage = null;\n  let lightboxIncoming = null;\n  let lightboxPrev = null;\n  let lightboxNext = null;\n  let closeButton = null;\n  let lastTrigger = null;\n  let lightboxGroup = [];\n  let lightboxIndex = 0;\n  let lightboxBusy = false;\n  let lightboxTransitionTimer = 0;'''
          if old not in text:
              raise SystemExit('Lightbox variable block not found')
          text = text.replace(old, new, 1)

          old = '''    lightboxImage = document.createElement('img');\n    lightboxImage.className = 'hm-ds-image-lightbox__image';\n    lightboxImage.alt = '';\n\n    closeButton = document.createElement('button');\n    closeButton.className = 'hm-ds-image-lightbox__close';\n    closeButton.type = 'button';\n    closeButton.setAttribute('aria-label', '확대 이미지 닫기');\n\n    stage.append(lightboxImage, closeButton);\n    lightbox.append(stage);'''
          new = '''    const viewport = document.createElement('div');\n    viewport.className = 'hm-ds-image-lightbox__viewport';\n\n    lightboxImage = document.createElement('img');\n    lightboxImage.className = 'hm-ds-image-lightbox__image';\n    lightboxImage.alt = '';\n\n    lightboxIncoming = document.createElement('img');\n    lightboxIncoming.className = 'hm-ds-image-lightbox__image hm-ds-image-lightbox__image--incoming';\n    lightboxIncoming.alt = '';\n\n    lightboxPrev = document.createElement('button');\n    lightboxPrev.className = 'hm-ds-image-lightbox__nav hm-ds-image-lightbox__nav--prev';\n    lightboxPrev.type = 'button';\n    lightboxPrev.setAttribute('aria-label', '이전 확대 이미지');\n\n    lightboxNext = document.createElement('button');\n    lightboxNext.className = 'hm-ds-image-lightbox__nav hm-ds-image-lightbox__nav--next';\n    lightboxNext.type = 'button';\n    lightboxNext.setAttribute('aria-label', '다음 확대 이미지');\n\n    closeButton = document.createElement('button');\n    closeButton.className = 'hm-ds-image-lightbox__close';\n    closeButton.type = 'button';\n    closeButton.setAttribute('aria-label', '확대 이미지 닫기');\n\n    viewport.append(lightboxImage, lightboxIncoming);\n    stage.append(viewport, lightboxPrev, lightboxNext, closeButton);\n    lightbox.append(stage);'''
          if old not in text:
              raise SystemExit('Lightbox DOM block not found')
          text = text.replace(old, new, 1)

          old = '''  const closeLightbox = () => {\n    if (!lightbox || !lightbox.classList.contains('is-open')) return;\n    lightbox.classList.remove('is-open');\n    lightbox.setAttribute('aria-hidden', 'true');\n    document.body.classList.remove('hm-ds-lightbox-open');\n    lightboxImage.removeAttribute('src');\n    lightboxImage.alt = '';\n    if (lastTrigger) lastTrigger.focus({ preventScroll: true });\n    lastTrigger = null;\n  };\n\n  const openLightbox = (image) => {\n    ensureLightbox();\n    lastTrigger = image;\n    lightboxImage.src = image.currentSrc || image.src;\n    lightboxImage.alt = image.alt || '';\n    lightbox.classList.add('is-open');\n    lightbox.setAttribute('aria-hidden', 'false');\n    document.body.classList.add('hm-ds-lightbox-open');\n    closeButton.focus({ preventScroll: true });\n  };'''
          new = '''  const getLightboxGroup = (image) => {\n    const stack = image.closest('.hm-ds-media-gallery-stack');\n    const selector = '.hm-ds-media-gallery__item > img, .aimmo-application-gallery__item > img';\n    if (stack) {\n      const images = Array.from(stack.querySelectorAll(selector)).filter((item) => item.dataset.galleryExpandBound === 'true');\n      if (images.length) return images;\n    }\n\n    const gallery = image.closest(GALLERY_SELECTOR);\n    if (gallery) {\n      const images = Array.from(gallery.querySelectorAll(selector)).filter((item) => item.dataset.galleryExpandBound === 'true');\n      if (images.length) return images;\n    }\n    return [image];\n  };\n\n  const updateLightboxNav = () => {\n    if (!lightboxPrev || !lightboxNext) return;\n    const hidden = lightboxGroup.length < 2;\n    lightboxPrev.hidden = hidden;\n    lightboxNext.hidden = hidden;\n  };\n\n  const closeLightbox = () => {\n    if (!lightbox || !lightbox.classList.contains('is-open')) return;\n    if (lightboxTransitionTimer) window.clearTimeout(lightboxTransitionTimer);\n    lightboxTransitionTimer = 0;\n    lightboxBusy = false;\n    lightbox.classList.remove('is-open', 'is-reverse');\n    lightbox.setAttribute('aria-hidden', 'true');\n    document.body.classList.remove('hm-ds-lightbox-open');\n    lightboxImage.classList.remove('is-exiting');\n    lightboxIncoming.classList.remove('is-next', 'is-entering');\n    lightboxImage.removeAttribute('src');\n    lightboxIncoming.removeAttribute('src');\n    lightboxImage.alt = '';\n    lightboxIncoming.alt = '';\n    lightboxGroup = [];\n    lightboxIndex = 0;\n    updateLightboxNav();\n    if (lastTrigger) lastTrigger.focus({ preventScroll: true });\n    lastTrigger = null;\n  };\n\n  const moveLightbox = (delta) => {\n    if (lightboxBusy || lightboxGroup.length < 2) return;\n    const targetIndex = (lightboxIndex + delta + lightboxGroup.length) % lightboxGroup.length;\n    const target = lightboxGroup[targetIndex];\n    if (!target) return;\n\n    lightboxBusy = true;\n    lightbox.classList.toggle('is-reverse', delta < 0);\n    lightboxIncoming.src = target.currentSrc || target.src;\n    lightboxIncoming.alt = target.alt || '';\n    lightboxIncoming.classList.add('is-next');\n\n    const complete = () => {\n      lightboxIndex = targetIndex;\n      lightboxImage.src = lightboxIncoming.src;\n      lightboxImage.alt = lightboxIncoming.alt;\n      lightboxImage.classList.remove('is-exiting');\n      lightboxIncoming.classList.remove('is-next', 'is-entering');\n      lightboxIncoming.removeAttribute('src');\n      lightboxIncoming.alt = '';\n      lightbox.classList.remove('is-reverse');\n      lightboxBusy = false;\n      lightboxTransitionTimer = 0;\n    };\n\n    if (reducedMotion) {\n      complete();\n      return;\n    }\n\n    void lightboxIncoming.offsetWidth;\n    lightboxImage.classList.add('is-exiting');\n    lightboxIncoming.classList.add('is-entering');\n    lightboxTransitionTimer = window.setTimeout(complete, TRANSITION_MS + 30);\n  };\n\n  const openLightbox = (image) => {\n    ensureLightbox();\n    lastTrigger = image;\n    lightboxGroup = getLightboxGroup(image);\n    lightboxIndex = Math.max(0, lightboxGroup.indexOf(image));\n    lightboxBusy = false;\n    lightboxImage.classList.remove('is-exiting');\n    lightboxIncoming.classList.remove('is-next', 'is-entering');\n    lightboxIncoming.removeAttribute('src');\n    lightboxImage.src = image.currentSrc || image.src;\n    lightboxImage.alt = image.alt || '';\n    updateLightboxNav();\n    lightbox.classList.add('is-open');\n    lightbox.setAttribute('aria-hidden', 'false');\n    document.body.classList.add('hm-ds-lightbox-open');\n    closeButton.focus({ preventScroll: true });\n  };'''
          if old not in text:
              raise SystemExit('Lightbox open/close block not found')
          text = text.replace(old, new, 1)

          old = '''    closeButton.addEventListener('click', (event) => {\n      event.stopPropagation();\n      closeLightbox();\n    });\n\n    document.addEventListener('keydown', (event) => {\n      if (event.key === 'Escape') closeLightbox();\n    });'''
          new = '''    closeButton.addEventListener('click', (event) => {\n      event.stopPropagation();\n      closeLightbox();\n    });\n    lightboxPrev.addEventListener('click', (event) => {\n      event.preventDefault();\n      event.stopPropagation();\n      moveLightbox(-1);\n    });\n    lightboxNext.addEventListener('click', (event) => {\n      event.preventDefault();\n      event.stopPropagation();\n      moveLightbox(1);\n    });\n\n    document.addEventListener('keydown', (event) => {\n      if (event.key === 'Escape') {\n        closeLightbox();\n        return;\n      }\n      if (!lightbox.classList.contains('is-open')) return;\n      if (event.key === 'ArrowLeft') {\n        event.preventDefault();\n        moveLightbox(-1);\n      } else if (event.key === 'ArrowRight') {\n        event.preventDefault();\n        moveLightbox(1);\n      }\n    });'''
          if old not in text:
              raise SystemExit('Lightbox event block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Cache-bust the AIMMO page and shared design-system entry point.
          path = Path('aimmo-graphic.html')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('./design-system/components/media-gallery.css?v=20260918-2', './design-system/components/media-gallery.css?v=20260918-3'),
              ('./design-system/components/aimmo-graphic-v2.css?v=20260918-1', './design-system/components/aimmo-graphic-v2.css?v=20260918-2'),
              ('./design-system/media-gallery.js?v=20260918-2', './design-system/media-gallery.js?v=20260918-3'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Cache-bust target not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('design-system/index.css')
          text = path.read_text(encoding='utf-8')
          old = './components/media-gallery.css?v=20260918-2'
          new = './components/media-gallery.css?v=20260918-3'
          if old not in text:
              raise SystemExit('Shared index gallery import not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify expected changes
        run: |
          grep -q -- '--hm-ds-media-carousel-ratio:16/9' design-system/components/aimmo-graphic-v2.css
          grep -q 'margin-top:40px!important' design-system/components/aimmo-graphic-v2.css
          grep -q 'mix-blend-mode:difference' design-system/components/media-gallery.css
          grep -q 'hm-ds-image-lightbox__nav--prev' design-system/media-gallery.js
          grep -q '20260918-3' aimmo-graphic.html
      - name: Commit changes and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/oneoff-aimmo-gallery-ux.yml
          git add aimmo-graphic.html design-system/components/aimmo-graphic-v2.css design-system/components/media-gallery.css design-system/media-gallery.js design-system/index.css .github/workflows/oneoff-aimmo-gallery-ux.yml
          git commit -m 'Refine AIMMO gallery ratios and navigation'
          git push origin HEAD:main
