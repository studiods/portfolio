name: Rebuild Reuse 02.2 trust insertion flow
'on':
  push:
    paths:
      - '.github/workflows/rebuild-reuse-022-trust-insert.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      HTML_B64: 
      CSS_B64: 
      JS_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 02.2 trust insertion flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import os, base64, re, sys

          html_block = base64.b64decode(os.environ['HTML_B64']).decode()
          css_block = base64.b64decode(os.environ['CSS_B64']).decode()
          js_code = base64.b64decode(os.environ['JS_B64']).decode()

          html_path = Path('himart-reuse.html')
          html = html_path.read_text()
          start = '<article class="data-card hm-ds-card hm-reveal"><div class="data-card-head"><span class="hm-card-no">02.2</span>'
          end = '\n\n</div>\n</div></section>'
          start_pos = html.find(start)
          if start_pos < 0:
              raise SystemExit('02.2 HTML start marker missing')
          end_pos = html.find(end, start_pos)
          if end_pos < 0:
              raise SystemExit('02.2 HTML end marker missing')
          html = html[:start_pos] + html_block + html[end_pos:]
          html, n = re.subn(r'(himart-system\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), html, count=1)
          if n != 1:
              raise SystemExit('himart-system cache marker missing')
          html, n = re.subn(r'(reuse-confidence-motion\.js\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), html, count=1)
          if n != 1:
              raise SystemExit('motion cache marker missing')
          html_path.write_text(html)

          css_path = Path('design-system/components/reuse-confidence.css')
          css = css_path.read_text()
          layout_start = '/* 02.2 — Reuse purchase journey with confidence moments inserted into the ordinary flow. */'
          proof_marker = '/* 02.1 circular proof map v4 — unframed groups, responsive type, proportional arrow. */'
          if layout_start not in css or proof_marker not in css:
              raise SystemExit('CSS layout markers missing')
          before = css.split(layout_start, 1)[0].rstrip()
          after = css.split(proof_marker, 1)[1]
          old_motion = '/* 02.2 — focus-driven sequential confidence pulse. */'
          if old_motion in after:
              after = after.split(old_motion, 1)[0].rstrip() + '\n'
          css = before + '\n\n' + css_block.strip() + '\n\n' + proof_marker + after
          css_path.write_text(css)

          Path('design-system/reuse-confidence-motion.js').write_text(js_code)

          index_path = Path('design-system/index.css')
          index = index_path.read_text()
          index, n = re.subn(r'(reuse-confidence\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), index, count=1)
          if n != 1:
              raise SystemExit('reuse-confidence cache marker missing')
          index = re.sub(r'HIMART Design System v(\d+)\.(\d+)', lambda m: f'HIMART Design System v{m.group(1)}.{int(m.group(2))+1}', index, count=1)
          index_path.write_text(index)

          system_path = Path('design-system/himart-system.css')
          system = system_path.read_text()
          system, n = re.subn(r'(index\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), system, count=1)
          if n != 1:
              raise SystemExit('index cache marker missing')
          system = re.sub(r'HIMART Shared System v(\d+)\.(\d+)', lambda m: f'HIMART Shared System v{m.group(1)}.{int(m.group(2))+1}', system, count=1)
          system_path.write_text(system)
          PY
      - name: Verify 02.2 behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          html = Path('himart-reuse.html').read_text()
          css = Path('design-system/components/reuse-confidence.css').read_text()
          js = Path('design-system/reuse-confidence-motion.js').read_text()
          checks = {
            '8 base journey nodes': html.count('data-flow-key="base-') == 8,
            '4 trust insertions': html.count('data-flow-key="trust-') == 4,
            'old 02.2 rows removed': 'reuse-confidence-row' not in html,
            'trust labels present': all(x in html for x in ['실사진 ·<br>상태 등급','기능 점검 ·<br>검수 결과','클리닝 ·<br>위생 기준','2년 무상<br>보증']),
            '4-column reflow stage': 'grid-template-columns:repeat(4,minmax(0,1fr))' in css,
            'pending trust hidden': '.reuse-confidence-item.is-pending' in css and 'display:none' in css,
            'trust node secondary size': 'width:76%' in css,
            'old pulse css removed': 'reuse-confidence-line-pulse' not in css and 'reuse-confidence-trust-pulse' not in css,
            'FLIP movement enabled': 'animateExistingItems' in js and 'getBoundingClientRect' in js,
            'new circle starts at 20 percent': '{ opacity: 0.2 }, { opacity: 1 }' in js,
            'brisk staged timing': 'const STEP_INTERVAL = 620;' in js and 'const MOVE_DURATION = 700;' in js,
            'one play per focus': 'hasPlayed' in js and 'if (!inFocus || hasPlayed || document.hidden) return;' in js,
            'reset on focus exit': 'else {' in js and 'reset();' in js,
            'no repeat cycle': 'FINAL_HOLD' not in js and 'RESTART_DELAY' not in js and 'CYCLE_DURATION' not in js,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
          if failed:
              sys.exit('Verification failed: ' + ', '.join(failed))
          PY
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/rebuild-reuse-022-trust-insert.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild Reuse 02.2 trust insertion flow"
          git push
