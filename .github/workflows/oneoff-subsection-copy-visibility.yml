name: One-off subsection copy visibility migration
on:
  push:
    paths:
      - '.github/workflows/oneoff-subsection-copy-visibility.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reversible subsection description visibility system
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')
          css_path = root / 'design-system/components/subsection-copy-visibility.css'
          css = '''/*
            Numbered subsection description visibility
            ------------------------------------------
            Purpose: keep the explanatory copy immediately below numbered subsection
            titles (01.1, 02.3, etc.) in the document while removing it and its layout
            space from the current presentation.

            Current state is activated per page by adding the body class:
              hm-ds-subsection-copy-hidden

            To restore the copy later, remove only that body class. Do not delete the
            paragraph markup; original typography and spacing will return automatically.
          */

          body.hm-ds-subsection-copy-hidden .hm-subsection:has(.hm-subno) .hm-ds-subsection__description,
          body.hm-ds-subsection-copy-hidden .hm-subsection:has(.hm-subno) .hm-subcopy,
          body.hm-ds-subsection-copy-hidden .data-card:has(.hm-card-no) .data-card-head .desc,
          body.hm-ds-subsection-copy-hidden :is(.hm-subhead,.data-card-head):has(> :is(.hm-subno,.hm-card-no)) > div > :is(h3,h4) + p,
          body.hm-ds-subsection-copy-hidden [class*="subhead"]:has(> .hm-subno) > div > :is(h3,h4) + p {
            display:none!important;
            margin:0!important;
            padding:0!important;
          }
          '''
          css_path.write_text(css, encoding='utf-8')

          doc_path = root / 'design-system/SUBSECTION_COPY_SYSTEM.md'
          doc_path.write_text('''# Numbered Subsection Description Visibility\n\n## Scope\nNumbered middle-title blocks such as `01.1`, `02.3`, `03.2` and `04.2`. Hero descriptions, major chapter titles/descriptions, card body copy, gallery captions and source notes are not part of this rule.\n\n## Current state\nThe explanatory paragraph immediately below a numbered middle title remains in the HTML source but is visually hidden. `display:none` removes both the text and its layout space, so the following content moves upward.\n\n## Activation\nPages use the body class:\n\n```html\n<body class="... hm-ds-subsection-copy-hidden">\n```\n\nand load:\n\n```html\n<link rel="stylesheet" href="./design-system/components/subsection-copy-visibility.css?v=20260918-1">\n```\n\n## Restore later\nRemove only `hm-ds-subsection-copy-hidden` from the body. Do not delete or rewrite the paragraph markup. The original copy, typography and spacing then return from the existing page/design-system styles.\n\n## Content rule\nThis is a visibility state, not a content deletion rule. Numbered subsection descriptions must remain editable and recoverable in source.\n''', encoding='utf-8')

          # Restore the AIMMO Graphic subsection descriptions that had been physically
          # removed in the immediately preceding edit. They will then be hidden by the
          # shared reversible visibility state like every other page.
          aimmo = root / 'aimmo-graphic.html'
          if aimmo.exists():
            text = aimmo.read_text(encoding='utf-8')
            restores = [
              ('가이드와 규칙이 없어 제각각 사용되고 있었습니다.</h3>', '가이드와 규칙이 없어 제각각 사용되고 있었습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">로고와 기본 모티브는 있었지만 적용 기준·조합 규칙·예시가 없어 제품·전시·홍보물마다 다른 방식으로 사용됐습니다.</p>'),
              ('결국 이전과 다를 바 없는 구조가 반복됐습니다.</h3>', '결국 이전과 다를 바 없는 구조가 반복됐습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">제품의 경쟁력이 있어도 접점마다 다른 표현으로 전달되면서 브랜드의 가치로 축적되지 못했습니다.</p>'),
              ('그래서 기존 자산을 어떻게 확장하고 가이드할지로 방향을 다시 잡았습니다.</h3>', '그래서 기존 자산을 어떻게 확장하고 가이드할지로 방향을 다시 잡았습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">새로 만드는 대신 기존 리브랜딩 자산의 형태를 유지하고, 다양한 접점에서 반복해서 쓸 수 있는 확장 규칙과 가이드를 정의했습니다.</p>'),
              ('에이모가 어떤 회사인지부터 확인했습니다.</h3>', '에이모가 어떤 회사인지부터 확인했습니다.</h3><p class="desc">무엇을 알리고 무엇을 강조해야 하는지부터 짧게 정리했습니다.</p>'),
              ('기존 리소스를 기본 단위로 분해하고 다시 조합했습니다.</h3>', '기존 리소스를 기본 단위로 분해하고 다시 조합했습니다.</h3><p class="desc">점·캡슐·사선 바를 재조합 가능한 단위로 정리해, 같은 형태 문법 안에서 목적별 아이덴티티로 확장했습니다.</p>'),
              ('다양한 국내외 홍보 및 마케팅 브랜드 접점에 적용했습니다.</h3>', '다양한 국내외 홍보 및 마케팅 브랜드 접점에 적용했습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">같은 모듈과 조합 규칙을 웹·공간·인쇄·콘텐츠로 확장해 접점이 달라도 같은 브랜드로 읽히게 했습니다.</p>'),
              ('통일된 브랜드 요소가 지속적으로 전달되도록 했습니다.</h3>', '통일된 브랜드 요소가 지속적으로 전달되도록 했습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">부스·사인·그래픽·제품 소개물에 같은 모듈과 색상 규칙을 적용해 공간 전체가 하나의 브랜드로 이어지게 했습니다.</p>'),
              ('브랜드의 수준을 먼저 보여주는 경험으로 다시 잡았습니다.</h3>', '브랜드의 수준을 먼저 보여주는 경험으로 다시 잡았습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">그래픽 모티브의 움직임과 대비를 디지털에 적용해 제품 설명 이전에 에이모의 기술력과 태도를 느낄 수 있도록 방향을 잡았습니다.</p>'),
              ('구성원을 묶는 하나의 구심점으로 확장했습니다.</h3>', '구성원을 묶는 하나의 구심점으로 확장했습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">Event·Welcome Kit·Stationery·Business Card 등 인터널 브랜딩이 필요한 모든 접점에 같은 그래픽 시스템을 적용했습니다.</p>'),
              ('브랜드의 수준까지 함께 평가받기 시작했습니다.</h3>', '브랜드의 수준까지 함께 평가받기 시작했습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">브랜드 변화는 해외 전시와 계약 현장에서 먼저 알아볼 만큼 큰 반응으로 이어졌고,<br>가격 경쟁 중심의 시장에서도 브랜드 인지도와 현장 참여가 함께 높아졌습니다.</p>'),
            ]
            for needle, replacement in restores:
              # Only restore when the matching title is not already followed by a paragraph.
              if needle in text:
                idx = text.index(needle) + len(needle)
                if not text[idx:idx+120].lstrip().startswith('<p'):
                  text = text.replace(needle, replacement, 1)
            aimmo.write_text(text, encoding='utf-8')

          # Apply the state to canonical case-study pages. Keep drafts/tests/backups untouched.
          canonical = {
            'himart.html','himart-reuse.html','himart-ways.html','himart-ax.html','himart-team.html',
            'aimmo-system.html','aimmo-graphic.html','trenbe-ut.html','yanolja-system.html','nbt_stepup.html',
            'work_archive.html','work-archive.html'
          }
          link = '<link rel="stylesheet" href="./design-system/components/subsection-copy-visibility.css?v=20260918-1">'
          changed_pages = []
          for name in sorted(canonical):
            p = root / name
            if not p.exists():
              continue
            text = p.read_text(encoding='utf-8')
            if '<body' not in text:
              continue
            original = text
            # Only pages with numbered subsection structures need the state.
            if 'hm-subno' not in text and 'hm-card-no' not in text:
              continue
            if 'hm-ds-subsection-copy-hidden' not in text:
              text = re.sub(r'<body\s+class="([^"]*)"', lambda m: '<body class="' + m.group(1) + ' hm-ds-subsection-copy-hidden"', text, count=1)
            if 'subsection-copy-visibility.css' not in text:
              text = text.replace('</head>', link + '\n</head>', 1)
            if text != original:
              p.write_text(text, encoding='utf-8')
              changed_pages.append(name)

          # Record the component in the main design-system README without duplicating it.
          readme = root / 'design-system/README.md'
          if readme.exists():
            text = readme.read_text(encoding='utf-8')
            marker = '## Numbered subsection description visibility'
            if marker not in text:
              text += '''\n\n## Numbered subsection description visibility\n\nNumbered middle-title descriptions are preserved in source but can be globally collapsed with the `hm-ds-subsection-copy-hidden` body state. The state removes both the copy and its layout space; removing the class restores the original text and spacing. See `SUBSECTION_COPY_SYSTEM.md` and `components/subsection-copy-visibility.css`.\n'''
              readme.write_text(text, encoding='utf-8')

          print('Changed canonical pages:', ', '.join(changed_pages))

      - name: Verify reversible visibility state
        shell: python
        run: |
          from pathlib import Path
          import re
          css = Path('design-system/components/subsection-copy-visibility.css').read_text(encoding='utf-8')
          assert 'display:none!important' in css
          assert 'hm-ds-subsection-copy-hidden' in css
          assert Path('design-system/SUBSECTION_COPY_SYSTEM.md').exists()
          aimmo = Path('aimmo-graphic.html').read_text(encoding='utf-8')
          assert '로고와 기본 모티브는 있었지만 적용 기준·조합 규칙·예시가 없어' in aimmo
          assert '제품의 경쟁력이 있어도 접점마다 다른 표현으로 전달되면서' in aimmo
          assert '점·캡슐·사선 바를 재조합 가능한 단위로 정리해' in aimmo
          assert 'hm-ds-subsection-copy-hidden' in aimmo
          assert 'subsection-copy-visibility.css?v=20260918-1' in aimmo
          for name in ['himart-reuse.html','himart-ways.html','aimmo-system.html','trenbe-ut.html','yanolja-system.html','nbt_stepup.html']:
            p = Path(name)
            if p.exists():
              t = p.read_text(encoding='utf-8')
              if 'hm-subno' in t or 'hm-card-no' in t:
                assert 'hm-ds-subsection-copy-hidden' in t, name
                assert 'subsection-copy-visibility.css?v=20260918-1' in t, name

      - name: Commit changes and self-delete
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-subsection-copy-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add reversible subsection description visibility system"
          git push
