name: Refine Reuse 02.1 proof map scaling
on:
  push:
    paths:
      - '.github/workflows/refine-reuse-proof-map-v4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply proof map changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('design-system/components/reuse-confidence.css')
          c = p.read_text()
          marker = '/* 02.1 circular proof map v3 — grouped proof bands with cut labels. */'
          pos = c.find(marker)
          if pos < 0:
              raise SystemExit('proof map v3 marker not found')
          c = c[:pos] + '''/* 02.1 circular proof map v4 — unframed groups, responsive type, proportional arrow. */
html body.reuse-current .reuse-proof-map{
  display:flex;
  width:100%;
  flex-direction:column;
  align-items:center;
}
html body.reuse-current .reuse-proof-band{
  width:100%;
  box-sizing:border-box;
}
html body.reuse-current .reuse-proof-band__label{
  display:none;
}
html body.reuse-current .reuse-proof-band__nodes{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:28px;
  width:100%;
  align-items:center;
}
html body.reuse-current .reuse-proof-map__node{
  width:100%;
  min-width:0;
}
html body.reuse-current .reuse-proof-map__node h4{
  max-width:16ch;
  margin:0;
  font-size:clamp(18px,10cqi,24px)!important;
}
html body.reuse-current .reuse-proof-map__node--anxiety{
  opacity:1;
}
html body.reuse-current .reuse-proof-map__node--anxiety h4{
  color:rgba(255,255,255,.60)!important;
  font-family:var(--hm-font-ko)!important;
  font-weight:100!important;
  line-height:1.22;
}
html body.reuse-current .reuse-proof-map__node--solution{
  opacity:1;
  border-color:var(--hm-blue);
  background:#000;
}
html body.reuse-current .reuse-proof-map__node--solution h4{
  color:var(--hm-blue)!important;
  font-family:var(--hm-font-ko)!important;
  font-weight:300!important;
  line-height:1.22;
}
html body.reuse-current .reuse-proof-map__arrow{
  display:flex;
  width:100%;
  height:160px;
  flex:0 0 160px;
  align-items:center;
  justify-content:center;
}
html body.reuse-current .reuse-proof-map__arrow svg{
  display:block;
  width:25%;
  height:48px;
  max-width:none;
  overflow:visible;
}
html body.reuse-current .reuse-proof-map__arrow polyline{
  fill:none;
  stroke:rgba(255,255,255,.50);
  stroke-width:1;
  vector-effect:non-scaling-stroke;
  stroke-linecap:square;
  stroke-linejoin:miter;
}
@media(max-width:980px){
  html body.reuse-current .reuse-proof-band__nodes{gap:20px}
}
@media(max-width:780px){
  html body.reuse-current .reuse-proof-band__nodes{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
  }
  html body.reuse-current .reuse-proof-map__node{
    width:100%;
    height:auto;
    aspect-ratio:1/1;
    padding:18px;
  }
  html body.reuse-current .reuse-proof-map__node h4{
    font-size:clamp(18px,10cqi,24px)!important;
  }
  html body.reuse-current .reuse-proof-map__arrow svg{
    width:25%;
    height:48px;
  }
}
'''
          p.write_text(c)

          p = Path('himart-reuse.html')
          h = p.read_text()
          h = h.replace('preserveAspectRatio="xMidYMid meet"><polyline points="0,0 150,48 300,0"','preserveAspectRatio="none"><polyline points="0,0 150,48 300,0"',1)
          if './design-system/himart-system.css?v=20260908-40' not in h:
              raise SystemExit('page cache marker missing')
          h = h.replace('./design-system/himart-system.css?v=20260908-40','./design-system/himart-system.css?v=20260908-41',1)
          p.write_text(h)

          p = Path('design-system/index.css')
          i = p.read_text()
          if './components/reuse-confidence.css?v=20260908-8' not in i:
              raise SystemExit('component cache marker missing')
          i = i.replace('HIMART Design System v4.0','HIMART Design System v4.1',1)
          i = i.replace('./components/reuse-confidence.css?v=20260908-8','./components/reuse-confidence.css?v=20260908-9',1)
          p.write_text(i)

          p = Path('design-system/himart-system.css')
          s = p.read_text()
          if './index.css?v=20260908-35' not in s:
              raise SystemExit('system cache marker missing')
          s = s.replace('./index.css?v=20260908-35','./index.css?v=20260908-36',1)
          s = s.replace('HIMART Shared System v2.9','HIMART Shared System v3.0',1)
          p.write_text(s)
          PY

      - name: Verify proof map changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          c = Path('design-system/components/reuse-confidence.css').read_text()
          h = Path('himart-reuse.html').read_text()
          i = Path('design-system/index.css').read_text()
          s = Path('design-system/himart-system.css').read_text()
          block = c.split('/* 02.1 circular proof map v4',1)[1]
          checks = {
            'outer pill lines removed': 'border-radius:999px' not in block and 'reuse-proof-band--anxiety' not in block and 'reuse-proof-band--solution' not in block,
            'pill labels hidden': '.reuse-proof-band__label{\n  display:none;' in block,
            'arrow quarter width': 'width:25%;' in block,
            'arrow remains 48 high': 'height:48px;' in block,
            'arrow stretches exact width': 'preserveAspectRatio="none"' in h,
            'responsive circle type': 'font-size:clamp(18px,10cqi,24px)!important;' in block,
            'component cache': './components/reuse-confidence.css?v=20260908-9' in i,
            'system cache': './index.css?v=20260908-36' in s,
            'page cache': './design-system/himart-system.css?v=20260908-41' in h,
          }
          failed=[]
          for k,v in checks.items():
              print(('PASS' if v else 'FAIL') + ' - ' + k)
              if not v: failed.append(k)
          if failed:
              sys.exit('Verification failed: ' + ', '.join(failed))
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/refine-reuse-proof-map-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Reuse 02.1 proof map scaling"
          git push
