name: One-off AIMMO chapter 03 structure update

on:
  push:
    paths:
      - '.github/workflows/oneoff-aimmo-03-structure.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply AIMMO chapter 03 update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('aimmo-system.html')
          h = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="./design-system/components/aimmo-system-v8.css?v=20260917-1">'
          anchor = '<link rel="stylesheet" href="./design-system/components/aimmo-reference-bars-exact.css?v=20260912-3">'
          if css not in h:
              assert anchor in h
              h = h.replace(anchor, anchor + '\n' + css, 1)
          old = '<span class="hm-subno">03.3</span><div><h3 class="hm-subtitle hm-ds-subsection__title">같은 제품군으로 보이되,<br>각 제품은 구분되게 했습니다.</h3>'
          new = '<span class="hm-subno">03.2</span><div><h3 class="hm-subtitle hm-ds-subsection__title">같은 제품군으로 보이되,<br>각 제품은 구분되게 했습니다.</h3>'
          assert old in h
          h = h.replace(old, new, 1)
          start_marker = '<div class="hm-subsection hm-ds-subsection hm-reveal"><div class="hm-subhead"><span class="hm-subno">03.4</span>'
          end_marker = '\n</div></div></section>\n\n<section class="hm-section hm-ds-section" id="direction"'
          s = h.find(start_marker)
          e = h.find(end_marker, s)
          assert s != -1 and e != -1
          block = '\n'.join([
              '<div class="hm-subsection hm-ds-subsection hm-reveal"><div class="hm-subhead"><span class="hm-subno">03.3</span><div><h3 class="hm-subtitle hm-ds-subsection__title">각자의 오너십으로 만든 시스템을,<br>실제 제품에 적용하며 함께 완성했습니다.</h3><p class="hm-subcopy hm-ds-subsection__description">담당 영역별로 만든 기준을 실제 화면에 적용하고, 디자이너·개발자와 리뷰와 회의를 반복하며 예외와 운영 기준까지 정리했습니다.</p></div></div><div class="aimmo-application-gallery hm-ds-subtitle-to-content" aria-label="AIMMO 디자인 시스템 제작·적용·협업 과정">',
              '<figure class="aimmo-application-gallery__item"><img src="./assets/image/aimmo-system/aimmo-source-014.jpg" alt="디자이너들이 각자 맡은 디자인 시스템 영역을 분업해 제작하는 장면" loading="lazy" decoding="async"><figcaption><span>01 · OWNERSHIP</span><h4>영역을 나누고 각자의 오너십으로 만들었습니다.</h4><p>타이포·컬러·그래픽·컴포넌트·토큰을 담당별로 나눠 병렬로 구축했습니다.</p></figcaption></figure>',
              '<figure class="aimmo-application-gallery__item"><img src="./assets/image/aimmo-system/aimmo-source-016.jpg" alt="디자이너들이 디자인 시스템 결과물을 함께 리뷰하는 장면" loading="lazy" decoding="async"><figcaption><span>02 · SYSTEM REVIEW</span><h4>각자 만든 기준을 한 시스템으로 계속 맞췄습니다.</h4><p>주기적인 리뷰로 중복과 예외를 확인하고 하나의 품질 기준으로 통합했습니다.</p></figcaption></figure>',
              '<figure class="aimmo-application-gallery__item"><img src="./assets/image/aimmo-system/aimmo-source-010.jpg" alt="디자인 시스템을 실제 제품 화면에 적용하고 검토하는 장면" loading="lazy" decoding="async"><figcaption><span>03 · PRODUCT APPLY</span><h4>실제 제품 화면에 적용하며 예외를 검증했습니다.</h4><p>라이브 화면과 신규 기능에 적용해 재사용성과 제품별 예외를 함께 확인했습니다.</p></figcaption></figure>',
              '<figure class="aimmo-application-gallery__item"><img src="./assets/image/aimmo-system/aimmo-source-018.jpg" alt="디자이너와 개발자가 디자인 시스템 적용 기준을 회의하는 장면" loading="lazy" decoding="async"><figcaption><span>04 · ALIGNMENT</span><h4>적용을 위해 디자인과 개발이 함께 기준을 맞췄습니다.</h4><p>컴포넌트 상태·토큰·적용 우선순위를 회의에서 맞추며 실제 업무에 정착시켰습니다.</p></figcaption></figure>',
              '</div></div>'
          ])
          h = h[:s] + block + h[e:]
          j = h[h.find('id="journey"'):h.find('id="direction"')]
          for x in ('03.1', '03.2', '03.3'):
              assert j.count(f'<span class="hm-subno">{x}</span>') == 1
          assert '<span class="hm-subno">03.4</span>' not in j
          p.write_text(h, encoding='utf-8')
          PY
          grep -q 'aimmo-system-v8.css?v=20260917-1' aimmo-system.html
          grep -q '<span class="hm-subno">03.2</span>' aimmo-system.html
          grep -q '<span class="hm-subno">03.3</span>' aimmo-system.html
          ! grep -q '<span class="hm-subno">03.4</span>' aimmo-system.html
          grep -q 'aimmo-application-gallery' aimmo-system.html
      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/oneoff-aimmo-03-structure.yml
          git config user.name 'studiods'
          git config user.email 'garci@naver.com'
          git add aimmo-system.html .github/workflows/oneoff-aimmo-03-structure.yml
          git commit -m 'Refine AIMMO chapter 03 ownership and application story'
          git push origin main
