name: Run Reuse 02.2 copy switch update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-reuse-022-copy-switch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Execute embedded update script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/refine-reuse-022-copy-switch.yml').read_text()
          start = "          python - <<'PY'\n"
          end = "\n          PY\n"
          body = source.split(start, 1)[1].split(end, 1)[0]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          exec(compile(code, 'reuse-022-update.py', 'exec'))
          PY
      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/refine-reuse-022-copy-switch.yml .github/workflows/run-reuse-022-copy-switch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refine Reuse 02.2 text transition motion'
          git push origin main
