name: Split Reuse 02.2 title and description masks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/split-reuse-022-copy-masks.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply separate title and description masks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Split each trust node's combined title+description mask into two independent masks.
          page_path = Path('himart-reuse.html')
          page = page_path.read_text()
          pattern = re.compile(
              r'<div class="reuse-confidence-copy-mask"><div class="reuse-confidence-copy reuse-confidence-copy--base" data-reuse-copy-base><h4>(.*?)</h4><p>(.*?)</p></div><div class="reuse-confidence-copy reuse-confidence-copy--trust" data-reuse-copy-trust aria-hidden="true"><h4>(.*?)</h4><p>(.*?)</p></div></div>',
              re.S
          )

          def repl(m):
              base_title, base_desc, trust_title, trust_desc = m.groups()
              return (
                  '<div class="reuse-confidence-copy-group">'
                  '<div class="reuse-confidence-title-mask">'
                  f'<div class="reuse-confidence-title reuse-confidence-title--base" data-reuse-copy-base><h4>{base_title}</h4></div>'
                  f'<div class="reuse-confidence-title reuse-confidence-title--trust" data-reuse-copy-trust aria-hidden="true"><h4>{trust_title}</h4></div>'
                  '</div>'
                  '<div class="reuse-confidence-desc-mask">'
                  f'<div class="reuse-confidence-desc reuse-confidence-desc--base" data-reuse-copy-base><p>{base_desc}</p></div>'
                  f'<div class="reuse-confidence-desc reuse-confidence-desc--trust" data-reuse-copy-trust aria-hidden="true"><p>{trust_desc}</p></div>'
                  '</div>'
                  '</div>'
              )

          page, count = pattern.subn(repl, page)
          if count != 4:
              raise SystemExit(f'expected 4 combined trust copy masks, found {count}')
          if './design-system/himart-system.css?v=20260908-51' not in page:
              raise SystemExit('page stylesheet cache version not found')
          if './design-system/reuse-confidence-motion.js?v=20260908-7' not in page:
              raise SystemExit('page motion cache version not found')
          page = page.replace('./design-system/himart-system.css?v=20260908-51', './design-system/himart-system.css?v=20260908-52', 1)
          page = page.replace('./design-system/reuse-confidence-motion.js?v=20260908-7', './design-system/reuse-confidence-motion.js?v=20260908-8', 1)
          page_path.write_text(page)

          # 2) Replace the combined masking CSS with independent title and description mask layers.
          css_path = Path('design-system/components/reuse-confidence.css')
          css = css_path.read_text()
          start = css.find('html body.reuse-current .reuse-confidence-copy-mask{')
          end = css.find('html body.reuse-current .reuse-confidence-arrow{', start)
          if start < 0 or end < 0:
              raise SystemExit('combined copy mask CSS block not found')

          split_mask_css = '''html body.reuse-current .reuse-confidence-copy-group{
  display:flex;
  width:100%;
  flex-direction:column;
  align-items:center;
  gap:clamp(8px,4cqi,12px);
  margin-top:clamp(12px,6cqi,18px);
}
html body.reuse-current .reuse-confidence-title-mask,
html body.reuse-current .reuse-confidence-desc-mask{
  position:relative;
  width:100%;
  overflow:hidden;
}
html body.reuse-current .reuse-confidence-title-mask{
  height:clamp(44px,24cqi,64px);
}
html body.reuse-current .reuse-confidence-desc-mask{
  height:clamp(40px,19cqi,54px);
}
html body.reuse-current .reuse-confidence-title,
html body.reuse-current .reuse-confidence-desc{
  position:absolute;
  inset:0;
  display:flex;
  width:100%;
  align-items:center;
  justify-content:center;
  will-change:transform,opacity;
  transition:transform 1.7s ease-in-out,opacity 1.7s ease-in-out;
}
html body.reuse-current .reuse-confidence-title h4,
html body.reuse-current .reuse-confidence-desc p{
  margin:0!important;
}
html body.reuse-current .reuse-confidence-title--base,
html body.reuse-current .reuse-confidence-desc--base{
  transform:translateY(0);
  opacity:1;
}
html body.reuse-current .reuse-confidence-title--trust,
html body.reuse-current .reuse-confidence-desc--trust{
  transform:translateY(-104%);
  opacity:.18;
}
html body.reuse-current .reuse-confidence-node.is-copy-trust-active .reuse-confidence-title--base,
html body.reuse-current .reuse-confidence-node.is-copy-trust-active .reuse-confidence-desc--base{
  transform:translateY(104%);
  opacity:0;
}
html body.reuse-current .reuse-confidence-node.is-copy-trust-active .reuse-confidence-title--trust,
html body.reuse-current .reuse-confidence-node.is-copy-trust-active .reuse-confidence-desc--trust{
  transform:translateY(0);
  opacity:1;
}
'''
          css = css[:start] + split_mask_css + css[end:]

          old_mobile = '''  html body.reuse-current .reuse-confidence-copy-mask{
    min-height:104px;
  }'''
          new_mobile = '''  html body.reuse-current .reuse-confidence-title-mask{
    height:56px;
  }
  html body.reuse-current .reuse-confidence-desc-mask{
    height:48px;
  }'''
          if old_mobile not in css:
              raise SystemExit('mobile combined mask rule not found')
          css = css.replace(old_mobile, new_mobile, 1)

          # Trust title color animation now targets only the title layer.
          css = css.replace('.reuse-confidence-copy--trust h4', '.reuse-confidence-title--trust h4')

          old_reset_base = '''html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-copy--base{
  animation:reuse-confidence-copy-base-return 1.7s ease-in-out both;
}'''
          new_reset_base = '''html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-title--base,
html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-desc--base{
  animation:reuse-confidence-copy-base-return 1.7s ease-in-out both;
}'''
          if old_reset_base not in css:
              raise SystemExit('reset base copy selector not found')
          css = css.replace(old_reset_base, new_reset_base, 1)

          old_reset_trust = '''html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-copy--trust{
  animation:reuse-confidence-copy-trust-exit 1.7s ease-in-out both;
}'''
          new_reset_trust = '''html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-title--trust,
html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-desc--trust{
  animation:reuse-confidence-copy-trust-exit 1.7s ease-in-out both;
}'''
          if old_reset_trust not in css:
              raise SystemExit('reset trust copy selector not found')
          css = css.replace(old_reset_trust, new_reset_trust, 1)

          old_reduce_anim = '''  html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-copy--base,
  html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-copy--trust{'''
          new_reduce_anim = '''  html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-title--base,
  html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-desc--base,
  html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-title--trust,
  html body.reuse-current .reuse-confidence-node.is-flow-trust-resetting .reuse-confidence-desc--trust{'''
          if old_reduce_anim not in css:
              raise SystemExit('reduced motion animation selectors not found')
          css = css.replace(old_reduce_anim, new_reduce_anim, 1)

          old_reduce_transition = '  html body.reuse-current .reuse-confidence-copy,\n'
          new_reduce_transition = '  html body.reuse-current .reuse-confidence-title,\n  html body.reuse-current .reuse-confidence-desc,\n'
          if old_reduce_transition not in css:
              raise SystemExit('reduced motion combined copy transition selector not found')
          css = css.replace(old_reduce_transition, new_reduce_transition, 1)
          css_path.write_text(css)

          # 3) aria-hidden now applies to both independent title and description layers.
          js_path = Path('design-system/reuse-confidence-motion.js')
          js = js_path.read_text()
          old_js = '''    const baseCopy = node.querySelector('[data-reuse-copy-base]');
    const trustCopy = node.querySelector('[data-reuse-copy-trust]');
    node.classList.toggle(COPY_ACTIVE_CLASS, trustActive);
    if (baseCopy) baseCopy.setAttribute('aria-hidden', trustActive ? 'true' : 'false');
    if (trustCopy) trustCopy.setAttribute('aria-hidden', trustActive ? 'false' : 'true');'''
          new_js = '''    const baseCopies = node.querySelectorAll('[data-reuse-copy-base]');
    const trustCopies = node.querySelectorAll('[data-reuse-copy-trust]');
    node.classList.toggle(COPY_ACTIVE_CLASS, trustActive);
    baseCopies.forEach((copy) => copy.setAttribute('aria-hidden', trustActive ? 'true' : 'false'));
    trustCopies.forEach((copy) => copy.setAttribute('aria-hidden', trustActive ? 'false' : 'true'));'''
          if old_js not in js:
              raise SystemExit('setCopyState selector block not found')
          js_path.write_text(js.replace(old_js, new_js, 1))

          # 4) Cache chain.
          index_path = Path('design-system/index.css')
          index = index_path.read_text()
          old = '@import url("./components/reuse-confidence.css?v=20260908-21");'
          new = '@import url("./components/reuse-confidence.css?v=20260908-22");'
          if old not in index:
              raise SystemExit('reuse-confidence cache import not found')
          index = index.replace(old, new, 1).replace('HIMART Design System v4.9', 'HIMART Design System v5.0', 1)
          index_path.write_text(index)

          system_path = Path('design-system/himart-system.css')
          system = system_path.read_text()
          old = '@import url("./index.css?v=20260908-46");'
          new = '@import url("./index.css?v=20260908-47");'
          if old not in system:
              raise SystemExit('index cache import not found')
          system = system.replace(old, new, 1).replace('HIMART Shared System v3.8', 'HIMART Shared System v3.9', 1)
          system_path.write_text(system)
          PY

      - name: Verify separate masks
        shell: bash
        run: |
          test "$(grep -o 'reuse-confidence-title-mask' himart-reuse.html | wc -l)" -eq 4
          test "$(grep -o 'reuse-confidence-desc-mask' himart-reuse.html | wc -l)" -eq 4
          ! grep -q 'reuse-confidence-copy-mask' himart-reuse.html
          grep -q 'reuse-confidence-title--base' design-system/components/reuse-confidence.css
          grep -q 'reuse-confidence-desc--base' design-system/components/reuse-confidence.css
          grep -q 'querySelectorAll' design-system/reuse-confidence-motion.js
          grep -q 'reuse-confidence.css?v=20260908-22' design-system/index.css
          grep -q 'index.css?v=20260908-47' design-system/himart-system.css
          grep -q 'himart-system.css?v=20260908-52' himart-reuse.html
          grep -q 'reuse-confidence-motion.js?v=20260908-8' himart-reuse.html

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/split-reuse-022-copy-masks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Split Reuse 02.2 title and description masks'
          git push origin main
