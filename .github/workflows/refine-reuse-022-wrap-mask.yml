name: Refine Reuse 02.2 wrapped flow motion
'on':
  push:
    paths:
      - '.github/workflows/refine-reuse-022-wrap-mask.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply equal circles and masked row wrap motion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('design-system/components/reuse-confidence.css')
          css = css_path.read_text()

          css = css.replace(
            "html body.reuse-current .reuse-confidence-stage{\n  --reuse-flow-gap:30.8px;\n  display:grid;",
            "html body.reuse-current .reuse-confidence-stage{\n  --reuse-flow-gap:30.8px;\n  position:relative;\n  display:grid;"
          )
          css = css.replace(
            "  width:100%;\n  align-items:center;\n}\nhtml body.reuse-current .reuse-confidence-item{",
            "  width:100%;\n  align-items:center;\n  overflow:hidden;\n  isolation:isolate;\n}\nhtml body.reuse-current .reuse-confidence-item{",
            1
          )
          css = css.replace(
            "html body.reuse-current .reuse-confidence-item.is-trust-item .reuse-confidence-node{\n  width:76%;",
            "html body.reuse-current .reuse-confidence-item.is-trust-item .reuse-confidence-node{\n  width:100%;"
          )
          css = css.replace(
            "html body.reuse-current .reuse-confidence-item.is-entering{\n  z-index:4;\n}\n",
            "html body.reuse-current .reuse-confidence-item.is-entering{\n  z-index:4;\n}\nhtml body.reuse-current .reuse-confidence-ghost{\n  position:absolute!important;\n  z-index:8;\n  display:flex;\n  align-items:center;\n  justify-content:center;\n  margin:0!important;\n  pointer-events:none;\n  will-change:transform,opacity;\n}\nhtml body.reuse-current .reuse-confidence-ghost::after{\n  display:none!important;\n}\n"
          )
          css = css.replace(
            "  html body.reuse-current .reuse-confidence-item.is-trust-item .reuse-confidence-node{\n    width:78%;\n  }",
            "  html body.reuse-current .reuse-confidence-item.is-trust-item .reuse-confidence-node{\n    width:100%;\n  }"
          )
          css_path.write_text(css)

          js_path = Path('design-system/reuse-confidence-motion.js')
          js = js_path.read_text()

          js = js.replace("const INITIAL_DELAY = 450;", "const INITIAL_DELAY = 585;")
          js = js.replace("const STEP_INTERVAL = 620;", "const STEP_INTERVAL = 806;")
          js = js.replace("const MOVE_DURATION = 700;", "const MOVE_DURATION = 910;")
          js = js.replace("const ENTER_DURATION = 520;", "const ENTER_DURATION = 676;")
          js = js.replace("const MOVE_EASING = 'cubic-bezier(.22,.8,.28,1)';", "const MOVE_EASING = 'cubic-bezier(.22,.72,.24,1)';")
          js = js.replace("const ENTER_EASING = 'cubic-bezier(.16,.84,.32,1)';", "const ENTER_EASING = 'cubic-bezier(.22,.72,.24,1)';")

          old_clear = """  const clearAnimations = () => {\n    animations.forEach((animation) => {\n      try { animation.cancel(); } catch (_) {}\n    });\n    animations = [];\n  };"""
          new_clear = """  const clearAnimations = () => {\n    animations.forEach((animation) => {\n      try { animation.cancel(); } catch (_) {}\n    });\n    animations = [];\n    stage.querySelectorAll('.reuse-confidence-ghost').forEach((ghost) => ghost.remove());\n    allItems.forEach((item) => {\n      item.style.removeProperty('opacity');\n      item.style.removeProperty('transform');\n    });\n  };"""
          if old_clear not in js:
              raise SystemExit('clearAnimations block missing')
          js = js.replace(old_clear, new_clear)

          old_existing = """  const animateExistingItems = (beforeRects, items) => {\n    items.forEach((item) => {\n      const before = beforeRects.get(item.dataset.flowKey);\n      if (!before) return;\n      const after = item.getBoundingClientRect();\n      const dx = before.left - after.left;\n      const dy = before.top - after.top;\n      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;\n\n      const animation = item.animate(\n        [\n          { transform: `translate(${dx}px, ${dy}px)` },\n          { transform: 'translate(0, 0)' }\n        ],\n        {\n          duration: MOVE_DURATION,\n          easing: MOVE_EASING,\n          fill: 'both'\n        }\n      );\n      animations.push(animation);\n      animation.finished.finally(() => {\n        try { animation.cancel(); } catch (_) {}\n      });\n    });\n  };"""

          new_existing = """  const animateWrappedItem = (item, before, after, stageRect) => {\n    const ghost = item.cloneNode(true);\n    ghost.classList.add('reuse-confidence-ghost');\n    ghost.classList.remove('is-row-end', 'is-last-visible');\n    ghost.removeAttribute('data-flow-key');\n    ghost.setAttribute('aria-hidden', 'true');\n    ghost.style.left = `${before.left - stageRect.left}px`;\n    ghost.style.top = `${before.top - stageRect.top}px`;\n    ghost.style.width = `${before.width}px`;\n    ghost.style.height = `${before.height}px`;\n    stage.appendChild(ghost);\n\n    const exitDistance = (stageRect.right - before.right) + before.width * 1.12;\n    const entryDx = (stageRect.left - after.width * 1.12) - after.left;\n    const exitDuration = Math.round(MOVE_DURATION * 0.72);\n    const entryDelay = Math.round(MOVE_DURATION * 0.24);\n    const entryDuration = Math.round(MOVE_DURATION * 0.76);\n\n    const ghostAnimation = ghost.animate(\n      [\n        { transform: 'translateX(0)', opacity: 1 },\n        { transform: `translateX(${exitDistance}px)`, opacity: 0.18 }\n      ],\n      {\n        duration: exitDuration,\n        easing: MOVE_EASING,\n        fill: 'both'\n      }\n    );\n\n    const entryAnimation = item.animate(\n      [\n        { transform: `translateX(${entryDx}px)`, opacity: 0.16 },\n        { transform: `translateX(${entryDx * 0.42}px)`, opacity: 0.48, offset: 0.42 },\n        { transform: 'translateX(0)', opacity: 1 }\n      ],\n      {\n        duration: entryDuration,\n        delay: entryDelay,\n        easing: MOVE_EASING,\n        fill: 'both'\n      }\n    );\n\n    animations.push(ghostAnimation, entryAnimation);\n    Promise.allSettled([ghostAnimation.finished, entryAnimation.finished]).then(() => {\n      ghost.remove();\n      try { ghostAnimation.cancel(); } catch (_) {}\n      try { entryAnimation.cancel(); } catch (_) {}\n    });\n  };\n\n  const animateExistingItems = (beforeRects, items) => {\n    const stageRect = stage.getBoundingClientRect();\n    const singleColumn = window.matchMedia('(max-width:780px)').matches;\n\n    items.forEach((item) => {\n      const before = beforeRects.get(item.dataset.flowKey);\n      if (!before) return;\n      const after = item.getBoundingClientRect();\n      const dx = before.left - after.left;\n      const dy = before.top - after.top;\n      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;\n\n      const changedRow = !singleColumn && Math.abs(before.top - after.top) > 4;\n      if (changedRow) {\n        animateWrappedItem(item, before, after, stageRect);\n        return;\n      }\n\n      const animation = item.animate(\n        [\n          { transform: `translate(${dx}px, ${dy}px)` },\n          { transform: 'translate(0, 0)' }\n        ],\n        {\n          duration: MOVE_DURATION,\n          easing: MOVE_EASING,\n          fill: 'both'\n        }\n      );\n      animations.push(animation);\n      animation.finished.finally(() => {\n        try { animation.cancel(); } catch (_) {}\n      });\n    });\n  };"""
          if old_existing not in js:
              raise SystemExit('animateExistingItems block missing')
          js = js.replace(old_existing, new_existing)

          js = js.replace(
            """    const opacityAnimation = item.animate(\n      [{ opacity: 0.2 }, { opacity: 1 }],""",
            """    const opacityAnimation = item.animate(\n      [\n        { opacity: 0.16 },\n        { opacity: 0.48, offset: 0.42 },\n        { opacity: 1 }\n      ],"""
          )
          js = js.replace(
            "{ transform: `translate(${dx}px, ${dy}px) scale(.84)` },",
            "{ transform: `translate(${dx}px, ${dy}px) scale(.90)` },"
          )
          js_path.write_text(js)

          index_path = Path('design-system/index.css')
          index = index_path.read_text()
          index, n = re.subn(r'(reuse-confidence\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), index, count=1)
          if n != 1:
              raise SystemExit('reuse-confidence cache marker missing')
          index = re.sub(r'HIMART Design System v(\d+)\.(\d+)', lambda m: f'HIMART Design System v{m.group(1)}.{int(m.group(2))+1}', index, count=1)
          index_path.write_text(index)

          system_path = Path('design-system/himart-system.css')
          system = system_path.read_text()
          system, n = re.subn(r'(index\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), system, count=1)
          if n != 1:
              raise SystemExit('index cache marker missing')
          system = re.sub(r'HIMART Shared System v(\d+)\.(\d+)', lambda m: f'HIMART Shared System v{m.group(1)}.{int(m.group(2))+1}', system, count=1)
          system_path.write_text(system)

          html_path = Path('himart-reuse.html')
          html = html_path.read_text()
          html, n = re.subn(r'(himart-system\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), html, count=1)
          if n != 1:
              raise SystemExit('page system cache marker missing')
          html, n = re.subn(r'(reuse-confidence-motion\.js\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), html, count=1)
          if n != 1:
              raise SystemExit('motion cache marker missing')
          html_path.write_text(html)
          PY

      - name: Verify 02.2 wrapped flow behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          css = Path('design-system/components/reuse-confidence.css').read_text()
          js = Path('design-system/reuse-confidence-motion.js').read_text()
          html = Path('himart-reuse.html').read_text()
          checks = {
            'all trust circles equal size': '.is-trust-item .reuse-confidence-node{\n  width:100%;' in css and 'width:76%' not in css and 'width:78%' not in css,
            'stage is masked': '.reuse-confidence-stage{' in css and 'overflow:hidden;' in css,
            'ghost wrap styling exists': '.reuse-confidence-ghost{' in css,
            '30 percent slower move': 'const MOVE_DURATION = 910;' in js,
            '30 percent slower entry': 'const ENTER_DURATION = 676;' in js,
            '30 percent slower steps': 'const STEP_INTERVAL = 806;' in js,
            'right exit left entry wrap': 'animateWrappedItem' in js and 'exitDistance' in js and 'entryDx' in js,
            'natural opacity entry': '{ opacity: 0.16 }' in js and '{ opacity: 0.48, offset: 0.42 }' in js,
            'single play still preserved': 'if (!inFocus || hasPlayed || document.hidden) return;' in js,
            'reset on out still preserved': 'else {\n      reset();\n    }' in js,
            'motion cache bumped': 'reuse-confidence-motion.js?v=20260908-' in html,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
          if failed:
              sys.exit('Verification failed: ' + ', '.join(failed))
          PY

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/refine-reuse-022-wrap-mask.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Reuse 02.2 masked row wrap motion"
          git push
