name: Set Reuse 02.2 animation speed to 1.7s
on:
  push:
    paths:
      - '.github/workflows/set-reuse-022-speed-17.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply 1.7 second animation timing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('design-system/components/reuse-confidence.css')
          css = css_path.read_text()
          marker = '/* 02.2 — focus-driven sequential confidence pulse. */'
          if marker not in css:
              raise SystemExit('02.2 motion marker missing')
          head, motion = css.rsplit(marker, 1)
          motion, n1 = re.subn(r'animation:(reuse-confidence-line-pulse|reuse-confidence-trust-pulse) 2s ease-in-out 1', r'animation:\1 1.7s ease-in-out 1', motion)
          motion, n2 = re.subn(r'transition:background-color 2s ease-in-out', 'transition:background-color 1.7s ease-in-out', motion)
          if n1 != 2 or n2 != 1:
              raise SystemExit(f'Unexpected CSS replacements: animations={n1}, reset={n2}')
          css_path.write_text(head + marker + motion)

          js_path = Path('design-system/reuse-confidence-motion.js')
          js = js_path.read_text()
          js, n3 = re.subn(r'const PULSE_DURATION = 2000;', 'const PULSE_DURATION = 1700;', js, count=1)
          js, n4 = re.subn(r'const RESET_DURATION = 2000;', 'const RESET_DURATION = 1700;', js, count=1)
          if n3 != 1 or n4 != 1:
              raise SystemExit(f'Unexpected JS replacements: pulse={n3}, reset={n4}')
          js_path.write_text(js)

          index_path = Path('design-system/index.css')
          index = index_path.read_text()
          index, n5 = re.subn(r'(reuse-confidence\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), index, count=1)
          if n5 != 1:
              raise SystemExit('reuse-confidence cache marker missing')
          index_path.write_text(index)

          system_path = Path('design-system/himart-system.css')
          system = system_path.read_text()
          system, n6 = re.subn(r'(index\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), system, count=1)
          if n6 != 1:
              raise SystemExit('index cache marker missing')
          system_path.write_text(system)

          html_path = Path('himart-reuse.html')
          html = html_path.read_text()
          html, n7 = re.subn(r'(himart-system\.css\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), html, count=1)
          html, n8 = re.subn(r'(reuse-confidence-motion\.js\?v=20260908-)(\d+)', lambda m: m.group(1) + str(int(m.group(2)) + 1), html, count=1)
          if n7 != 1 or n8 != 1:
              raise SystemExit(f'page cache markers missing: css={n7}, js={n8}')
          html_path.write_text(html)
          PY

      - name: Verify timing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          css = Path('design-system/components/reuse-confidence.css').read_text()
          js = Path('design-system/reuse-confidence-motion.js').read_text()
          checks = {
            'line pulse 1.7s': 'animation:reuse-confidence-line-pulse 1.7s ease-in-out 1;' in css,
            'trust pulse 1.7s': 'animation:reuse-confidence-trust-pulse 1.7s ease-in-out 1 forwards;' in css,
            'reset transition 1.7s': 'transition:background-color 1.7s ease-in-out!important;' in css,
            'pulse duration 1700': 'const PULSE_DURATION = 1700;' in js,
            'reset duration 1700': 'const RESET_DURATION = 1700;' in js,
            'hold remains 2s': 'const FINAL_HOLD = 2000;' in js,
            'restart wait remains 2s': 'const RESTART_DELAY = 2000;' in js,
          }
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              sys.exit('Verification failed: ' + ', '.join(failed))
          PY

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/set-reuse-022-speed-17.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Set Reuse 02.2 animation speed to 1.7s"
          git push
