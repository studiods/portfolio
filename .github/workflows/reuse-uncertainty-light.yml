name: Apply Reuse uncertainty Light typography
on:
  push:
    paths:
      - '.github/workflows/reuse-uncertainty-light.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Pretendard Light and refresh cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('design-system/components/reuse.css')
          t=p.read_text()
          old='''html body.reuse-current .reuse-uncertainty-panel__label{\n  display:block!important;\n  margin:0!important;\n  color:var(--hm-blue)!important;\n  font:100 16px/1.3 var(--hm-font-ko)!important;'''
          new='''html body.reuse-current .reuse-uncertainty-panel__label{\n  display:block!important;\n  margin:0!important;\n  color:var(--hm-blue)!important;\n  font:300 16px/1.3 var(--hm-font-ko)!important;'''
          assert old in t
          t=t.replace(old,new,1)
          old='''  font:100 var(--hm-type-comparison)/var(--hm-leading-comparison) var(--hm-font-ko)!important;'''
          new='''  font:300 var(--hm-type-comparison)/var(--hm-leading-comparison) var(--hm-font-ko)!important;'''
          assert old in t
          t=t.replace(old,new,1)
          old='''  html body.reuse-current .reuse-uncertainty-panel__label{\n    font-size:16px!important;\n    font-weight:100!important;\n  }'''
          new='''  html body.reuse-current .reuse-uncertainty-panel__label{\n    font-size:16px!important;\n    font-weight:300!important;\n  }'''
          assert old in t
          t=t.replace(old,new,1)
          old='''    font-weight:100!important;\n  }\n}'''
          new='''    font-weight:300!important;\n  }\n}'''
          assert old in t
          t=t.replace(old,new,1)
          p.write_text(t)

          p=Path('design-system/index.css')
          t=p.read_text().replace('components/reuse.css?v=20260907-16','components/reuse.css?v=20260907-17')
          p.write_text(t)

          p=Path('design-system/himart-system.css')
          t=p.read_text().replace('index.css?v=20260907-26','index.css?v=20260907-27')
          p.write_text(t)

          p=Path('himart-reuse.html')
          t=p.read_text().replace('himart-system.css?v=20260907-32','himart-system.css?v=20260907-33')
          p.write_text(t)
          PY
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          r=Path('design-system/components/reuse.css').read_text()
          i=Path('design-system/index.css').read_text()
          s=Path('design-system/himart-system.css').read_text()
          h=Path('himart-reuse.html').read_text()
          assert 'font:300 16px/1.3 var(--hm-font-ko)!important;' in r
          assert 'font:300 var(--hm-type-comparison)/var(--hm-leading-comparison) var(--hm-font-ko)!important;' in r
          assert r.count('font-weight:300!important;') >= 2
          assert 'components/reuse.css?v=20260907-17' in i
          assert 'index.css?v=20260907-27' in s
          assert 'himart-system.css?v=20260907-33' in h
          print('PASS - Reuse trust/anxiety labels and content use Pretendard Light (300)')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/reuse-uncertainty-light.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply Light typography to Reuse trust comparison"
          git push
