name: Refine Reuse 02.1 arrow proportion and spacing
on:
  push:
    paths:
      - '.github/workflows/refine-reuse-proof-map-v5.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply arrow and spacing changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('design-system/components/reuse-confidence.css')
          c = p.read_text()
          marker = '/* 02.1 circular proof map v4 — unframed groups, responsive type, proportional arrow. */'
          pos = c.find(marker)
          if pos < 0:
              raise SystemExit('proof map v4 marker missing')
          head, block = c[:pos], c[pos:]
          if 'height:160px;' not in block or 'flex:0 0 160px;' not in block:
              raise SystemExit('current 160px spacing not found')
          block = block.replace('height:160px;', 'height:120px;', 1)
          block = block.replace('flex:0 0 160px;', 'flex:0 0 120px;', 1)
          if block.count('width:25%;') < 2:
              raise SystemExit('current quarter-width arrow rules not found')
          block = block.replace('width:25%;', 'width:20%;')
          if 'stroke:rgba(255,255,255,.50);' not in block:
              raise SystemExit('current arrow opacity not found')
          block = block.replace('stroke:rgba(255,255,255,.50);', 'stroke:rgba(255,255,255,.30);', 1)
          p.write_text(head + block)

          p = Path('design-system/index.css')
          i = p.read_text()
          if './components/reuse-confidence.css?v=20260908-9' not in i:
              raise SystemExit('component cache marker missing')
          i = i.replace('HIMART Design System v4.1', 'HIMART Design System v4.2', 1)
          i = i.replace('./components/reuse-confidence.css?v=20260908-9', './components/reuse-confidence.css?v=20260908-10', 1)
          p.write_text(i)

          p = Path('design-system/himart-system.css')
          s = p.read_text()
          if './index.css?v=20260908-36' not in s:
              raise SystemExit('system cache marker missing')
          s = s.replace('./index.css?v=20260908-36', './index.css?v=20260908-37', 1)
          s = s.replace('HIMART Shared System v3.0', 'HIMART Shared System v3.1', 1)
          p.write_text(s)

          p = Path('himart-reuse.html')
          h = p.read_text()
          if './design-system/himart-system.css?v=20260908-41' not in h:
              raise SystemExit('page cache marker missing')
          h = h.replace('./design-system/himart-system.css?v=20260908-41', './design-system/himart-system.css?v=20260908-42', 1)
          p.write_text(h)
          PY

      - name: Verify requested values
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          c = Path('design-system/components/reuse-confidence.css').read_text()
          h = Path('himart-reuse.html').read_text()
          i = Path('design-system/index.css').read_text()
          s = Path('design-system/himart-system.css').read_text()
          block = c.split('/* 02.1 circular proof map v4',1)[1]
          checks = {
            'arrow width one fifth': block.count('width:20%;') >= 2 and 'width:25%;' not in block,
            'arrow opacity 30': 'stroke:rgba(255,255,255,.30);' in block,
            'circle gap 120': 'height:120px;' in block and 'flex:0 0 120px;' in block,
            'component cache': './components/reuse-confidence.css?v=20260908-10' in i,
            'system cache': './index.css?v=20260908-37' in s,
            'page cache': './design-system/himart-system.css?v=20260908-42' in h,
          }
          failed=[]
          for name, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ' - ' + name)
              if not ok: failed.append(name)
          if failed:
              sys.exit('Verification failed: ' + ', '.join(failed))
          PY

      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/refine-reuse-proof-map-v5.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Reuse 02.1 arrow proportion and spacing"
          git push
