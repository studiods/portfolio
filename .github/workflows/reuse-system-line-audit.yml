name: Audit and normalize Reuse line and spacing system
on:
  push:
    paths:
      - '.github/workflows/reuse-system-line-audit.yml'
permissions:
  contents: write
jobs:
  audit-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize shared neutral lines and spacing tokens
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('design-system/components/cards.css')
          t=p.read_text()
          replacements={
            '.hm-ds-card{border-top:1px solid var(--hm-line-strong);padding-top:20px}':'.hm-ds-card{border-top:1px solid var(--hm-line-weak);padding-top:var(--hm-space-20)}',
            '.hm-ds-card__label{display:block;color:var(--hm-blue);font:400 12px/1.2 var(--hm-font-en);letter-spacing:.04em}':'.hm-ds-card__label{display:block;color:var(--hm-blue);font:400 var(--hm-type-note)/1.2 var(--hm-font-en);letter-spacing:var(--hm-track-note)}',
            '.hm-ds-card__title{margin:20px 0 0;color:var(--hm-text-primary)}':'.hm-ds-card__title{margin:var(--hm-space-20) 0 0;color:var(--hm-text-primary)}',
            '.hm-ds-card__body{margin:24px 0 0;color:var(--hm-text-body)}':'.hm-ds-card__body{margin:var(--hm-space-24) 0 0;color:var(--hm-text-body)}',
            '.hm-ds-signal-grid,.hm-ds-role-grid,.hm-ds-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}':'.hm-ds-signal-grid,.hm-ds-role-grid,.hm-ds-stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--hm-space-40)}',
            '.hm-ds-role-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:50px 28px}':'.hm-ds-role-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--hm-space-50) var(--hm-space-28)}',
            '.hm-ds-role__title{margin:20px 0 0}':'.hm-ds-role__title{margin:var(--hm-space-20) 0 0}',
            '.hm-ds-role__body{margin:28px 0 0;color:var(--hm-text-body)}':'.hm-ds-role__body{margin:var(--hm-space-28) 0 0;color:var(--hm-text-body)}',
            '.hm-ds-role__keyword{display:block;margin-top:20px;color:var(--hm-blue);font:300 14px/1.4 var(--hm-font-ko)}':'.hm-ds-role__keyword{display:block;margin-top:var(--hm-space-20);color:var(--hm-blue);font:300 14px/1.4 var(--hm-font-ko)}',
            '  border-top:1px solid var(--hm-line-strong);\n  padding-top:20px;':'  border-top:1px solid var(--hm-line-weak);\n  padding-top:var(--hm-space-20);',
            '  margin-top:20px;\n  color:var(--hm-text-primary);':'  margin-top:var(--hm-space-20);\n  color:var(--hm-text-primary);',
            '  margin-top:20px;\n  color:var(--hm-text-tertiary);':'  margin-top:var(--hm-space-20);\n  color:var(--hm-text-tertiary);',
            '  .hm-ds-signal-grid,.hm-ds-role-grid,.hm-ds-stat-grid{grid-template-columns:1fr;gap:40px}':'  .hm-ds-signal-grid,.hm-ds-role-grid,.hm-ds-stat-grid{grid-template-columns:1fr;gap:var(--hm-space-40)}',
            '  .hm-ds-role-grid{gap:40px}':'  .hm-ds-role-grid{gap:var(--hm-space-40)}',
            '  .hm-ds-card__body,.hm-ds-role__body{margin-top:20px}':'  .hm-ds-card__body,.hm-ds-role__body{margin-top:var(--hm-space-20)}',
          }
          for old,new in replacements.items(): t=t.replace(old,new)
          p.write_text(t)

          p=Path('design-system/components/reuse.css')
          t=p.read_text()
          t=t.replace('gap:10px!important','gap:var(--hm-space-14)!important')
          t=t.replace('max-width:40ch!important','max-width:var(--hm-title-description-max)!important')
          t=t.replace('font:300 13px/1.4 var(--hm-font-ko)!important','font:300 var(--hm-type-note)/1.4 var(--hm-font-ko)!important')
          p.write_text(t)

          p=Path('design-system/himart-system.css')
          t=p.read_text().replace('@import url("./index.css?v=20260907-6");','@import url("./index.css?v=20260907-7");')
          marker='/* Neutral structural divider contract — generic content rules are quiet; semantic data accents may override. */'
          if marker not in t:
              anchor='/* Tables and boxed information never use vertical dividers. */'
              block='''/* Neutral structural divider contract — generic content rules are quiet; semantic data accents may override. */\nhtml body.himart-page-body #live-main :is(\n  .hm-ds-card,\n  .data-card,\n  .role-card,\n  .problem-item,\n  .signal-item\n){\n  border-top:1px solid var(--hm-line-weak)!important;\n  padding-top:var(--hm-space-20)!important;\n}\n\n'''
              if anchor not in t: raise SystemExit('himart-system anchor missing')
              t=t.replace(anchor,block+anchor)
          p.write_text(t)

          p=Path('design-system/index.css')
          t=p.read_text().replace('components/cards.css?v=20260906-2','components/cards.css?v=20260907-3').replace('components/reuse.css?v=20260906-2','components/reuse.css?v=20260907-3')
          p.write_text(t)

          for p in Path('.').glob('*.html'):
              t=p.read_text()
              nt=t.replace('design-system/himart-system.css?v=20260907-9','design-system/himart-system.css?v=20260907-10')
              if nt!=t: p.write_text(nt)

          p=Path('design-system/README.md')
          t=p.read_text()
          if '## Line / spacing contract' not in t:
              t+='''\n\n## Line / spacing contract\n\n- 중립적인 카드·콘텐츠 구분선은 `--hm-line-weak`(white 14%)을 기본으로 사용한다. 정보 위계가 아니라 구조만 구분하는 라인에 `--hm-line-strong`을 사용하지 않는다.\n- 보조 source/divider는 `--hm-line-faint`를 사용한다.\n- 데이터 의미를 직접 표현하는 positive/negative/accent line은 Data Viz/Case component의 semantic color를 유지할 수 있으며 neutral divider 규칙으로 덮어쓰지 않는다.\n- 카드 상단 line → label 간격은 `--hm-space-20`, subsection title → content는 `--hm-subtitle-to-content`, major title → first subsection은 `--hm-title-to-subsection-gap`, sibling subsection/card 간격은 `--hm-subsection-gap`을 사용한다.\n- case page에서 neutral line opacity나 주요 vertical rhythm을 raw px/rgba 값으로 새로 정의하지 않는다. 공통 component와 token을 사용한다.\n'''
              p.write_text(t)
          PY

      - name: Cross-check Reuse against design-system contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,sys
          cards=Path('design-system/components/cards.css').read_text()
          syscss=Path('design-system/himart-system.css').read_text()
          reusecss=Path('design-system/components/reuse.css').read_text()
          reuse=Path('himart-reuse.html').read_text()
          tokens=Path('design-system/tokens.css').read_text()
          index=Path('design-system/index.css').read_text()
          readme=Path('design-system/README.md').read_text()
          contract=syscss.split('Neutral structural divider contract',1)[1].split('/* Tables and boxed information',1)[0] if 'Neutral structural divider contract' in syscss else ''
          checks={
            'neutral DS cards use weak 14% line':'.hm-ds-card{border-top:1px solid var(--hm-line-weak);padding-top:var(--hm-space-20)}' in cards,
            'legacy strong neutral card line removed':'border-top:1px solid var(--hm-line-strong)' not in cards,
            'final authority uses weak line':'border-top:1px solid var(--hm-line-weak)!important' in contract,
            'proof semantic cards excluded from neutral override':'.proof-item' not in contract,
            'semantic negative line preserved':'rgba(250,72,27,.55)' in reusecss,
            'semantic positive line preserved':'rgba(0,166,237,.45)' in reusecss,
            'semantic blue/red component accents preserved':'var(--hm-blue)!important' in reusecss and 'var(--hm-red)!important' in reusecss,
            'source separator uses faint line':'border-top:1px solid var(--hm-line-faint)!important' in reusecss,
            'graph frame uses default line':'border:1px solid var(--hm-line-default)!important' in reusecss,
            'Reuse contains no local style tag':'<style' not in reuse.lower(),
            'all Reuse data cards use DS card':all('hm-ds-card' in c for c in re.findall(r'<article class="([^"]*data-card[^"]*)"',reuse)),
            'all Reuse role cards use DS card':all('hm-ds-card' in c for c in re.findall(r'<article class="([^"]*role-card[^"]*)"',reuse)),
            'major-to-first content uses 160 token':'--hm-title-to-subsection-gap:160px' in tokens and 'margin-top:var(--hm-title-to-subsection-gap)!important' in syscss,
            'sibling card/subsection uses 100 token':'--hm-subsection-gap:100px' in tokens and '.data-list > .data-card + .data-card{margin-top:var(--hm-subsection-gap)!important}' in syscss,
            'subtitle-to-content uses 80 token':'--hm-subtitle-to-content:80px' in tokens and 'margin-top:var(--hm-subtitle-to-content)!important' in syscss,
            'card line-to-label uses 20 token':'padding-top:var(--hm-space-20)' in cards,
            'Reuse chart legend gap uses spacing token':'gap:var(--hm-space-14)!important' in reusecss,
            'Reuse body width uses existing text token':'max-width:var(--hm-title-description-max)!important' in reusecss,
            'line hierarchy tokens intact':all(x in tokens for x in ['--hm-line-strong:rgba(255,255,255,.4)','--hm-line-default:rgba(255,255,255,.24)','--hm-line-weak:rgba(255,255,255,.14)','--hm-line-faint:rgba(255,255,255,.1)']),
            'cards and Reuse cache bumped':'components/cards.css?v=20260907-3' in index and 'components/reuse.css?v=20260907-3' in index,
            'nested index cache bumped':'index.css?v=20260907-7' in syscss,
            'Reuse outer cache bumped':'himart-system.css?v=20260907-10' in reuse,
            'line spacing contract documented':'## Line / spacing contract' in readme,
          }
          # Classify every Reuse border. Neutral structure must use line tokens; semantic accents may use existing DS palette.
          allowed=('var(--hm-line-','var(--hm-blue','var(--hm-red','rgba(250,72,27,.55)','rgba(0,166,237,.45)','border:0','border-left:0')
          border_lines=[x.strip() for x in reusecss.splitlines() if 'border' in x and ':' in x]
          unexpected=[x for x in border_lines if not any(a in x for a in allowed)]
          checks['all Reuse border declarations classified']=not unexpected
          if unexpected: print('UNCLASSIFIED BORDERS:',*unexpected,sep='\n')

          # Main vertical rhythm must be tokenized. Only the approved mobile 56px alias remains raw.
          rhythm=[]
          for line in reusecss.splitlines():
              s=line.strip()
              if re.search(r'(margin|padding)(?:-[a-z]+)?:[^;]*(?:[1-9][0-9]*)px',s) and '56px' not in s:
                  rhythm.append(s)
          checks['Reuse major margin/padding rhythm has no raw px overrides']=not rhythm
          if rhythm: print('RAW RHYTHM:',*rhythm,sep='\n')

          failed=[]
          for name,ok in checks.items():
              print(('PASS' if ok else 'FAIL')+' - '+name)
              if not ok: failed.append(name)
          if failed:
              print('FAILED:',', '.join(failed));sys.exit(1)
          PY
          echo '--- Reuse line declarations ---'
          grep -nE 'border-(top|bottom|left|right)|border:' design-system/components/reuse.css || true
          echo '--- Shared neutral divider declarations ---'
          grep -nE 'hm-line-(strong|weak|default|faint)' design-system/components/cards.css design-system/himart-system.css | head -100

      - name: Commit final system state and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/reuse-system-line-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize Reuse lines and spacing to design system"
          git push
