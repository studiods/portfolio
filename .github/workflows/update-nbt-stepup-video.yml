name: Update NBT Stepup video

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-nbt-stepup-video.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Stepup video changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          asset = Path('assets/nbt.stepup_01.mp4')
          if not asset.exists():
              raise SystemExit('assets/nbt.stepup_01.mp4 not found')

          page_path = Path('nbt_stepup.html')
          page = page_path.read_text()
          pattern = re.compile(r'    <div class="stepup-hero-media" aria-hidden="true">.*?\n    </div>\n    <div class="hm-movie-overlay" aria-hidden="true"></div>', re.S)
          replacement = "\n".join([
              '    <video class="stepup-hero-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">',
              '      <source src="./assets/nbt.stepup_01.mp4" type="video/mp4">',
              '    </video>',
              '    <div class="hm-movie-overlay" aria-hidden="true"></div>',
          ])
          page, count = pattern.subn(replacement, page, count=1)
          if count != 1:
              raise SystemExit(f'expected one Stepup hero visual block, found {count}')
          old_css = './design-system/components/nbt-stepup.css?v=20260906-5'
          new_css = './design-system/components/nbt-stepup.css?v=20260909-1'
          if old_css not in page:
              raise SystemExit('NBT Stepup CSS cache reference not found')
          page = page.replace(old_css, new_css, 1)
          page_path.write_text(page)

          css_path = Path('design-system/components/nbt-stepup.css')
          css = css_path.read_text()
          marker = '/* HERO — Himart layout, Stepup visual only. */\n'
          if marker not in css:
              raise SystemExit('NBT hero CSS marker not found')
          rule = '.stepup-hero-video{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center center;background:#000}\n'
          if '.stepup-hero-video{' not in css:
              css = css.replace(marker, marker + rule, 1)
          css_path.write_text(css)

          works_path = Path('works.html')
          works = works_path.read_text()
          old = '<a class="works-card-media-link has-visual" href="./nbt_stepup.html" aria-label="만보기보다 습관을 만드는 경험 프로젝트 보기"><div class="works-card-media has-image"><img class="works-card-image" src="./assets/image/stepup.webp" alt="걸음 수를 넘어 일상 습관을 만드는 모바일 경험을 재구성한 대표 비주얼" loading="lazy" decoding="async"></div></a>'
          new = '<a class="works-card-media-link has-visual" href="./nbt_stepup.html" aria-label="만보기보다 습관을 만드는 경험 프로젝트 보기"><div class="works-card-media has-video"><video class="works-card-video" muted loop playsinline preload="metadata" aria-hidden="true"><source src="./assets/nbt.stepup_01.mp4" type="video/mp4"></video></div></a>'
          if old not in works:
              raise SystemExit('Works Stepup image card block not found')
          works = works.replace(old, new, 1)
          works_path.write_text(works)
          PY

      - name: Verify Stepup video changes
        shell: bash
        run: |
          test -f assets/nbt.stepup_01.mp4
          grep -q '<video class="stepup-hero-video"' nbt_stepup.html
          grep -q 'src="./assets/nbt.stepup_01.mp4"' nbt_stepup.html
          grep -q 'nbt-stepup.css?v=20260909-1' nbt_stepup.html
          grep -q '.stepup-hero-video{' design-system/components/nbt-stepup.css
          grep -q 'src="./assets/nbt.stepup_01.mp4"' works.html
          ! grep -q 'assets/image/stepup.webp' works.html

      - name: Commit changes
        shell: bash
        run: |
          rm -f .github/workflows/update-nbt-stepup-video.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use NBT Stepup video in hero and Works'
          git push origin main
