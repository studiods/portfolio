name: One-off AIMMO graphic detail refinement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-aimmo-graphic-detail-2.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refine AIMMO graphic details
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html_path = Path('aimmo-graphic.html')
          css_path = Path('design-system/components/aimmo-graphic-v2.css')
          html = html_path.read_text()
          css = css_path.read_text()

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'Missing target: {label}')
              return text.replace(old, new, 1)

          html = rep(html,
              './design-system/components/aimmo-graphic-v2.css?v=20260917-4',
              './design-system/components/aimmo-graphic-v2.css?v=20260917-5',
              'css cache version')

          # 01.1 forced title wrapping
          html = rep(html, '<h4>브랜드 자산은 이미 있었습니다.</h4>', '<h4>브랜드 자산은<br>이미 있었습니다.</h4>', '01.1 card 1')
          html = rep(html, '<h4>활용 규칙이 없었습니다.</h4>', '<h4>활용 규칙이<br>없었습니다.</h4>', '01.1 card 2')
          html = rep(html, '<h4>접점마다 해석이 달랐습니다.</h4>', '<h4>접점마다 해석이<br>달랐습니다.</h4>', '01.1 card 3')
          html = rep(html, '<h4>일관된 인상이 쌓이지 않았습니다.</h4>', '<h4>일관된 인상이<br>쌓이지 않았습니다.</h4>', '01.1 card 4')

          # 02.1 forced title wrapping
          html = rep(html, '<h4>데이터 전주기를 연결하는 회사</h4>', '<h4>데이터 전주기를<br>연결하는 회사</h4>', '02.1 card 1')
          html = rep(html, '<h4>시나리오·ODD 등 자율주행 데이터에 강점</h4>', '<h4>시나리오·ODD 등<br>자율주행 데이터에 강점</h4>', '02.1 card 2')
          html = rep(html, '<h4>CES·Tech.AD Europe 등 해외 전시로 브랜드 입지를 확대</h4>', '<h4>CES·Tech.AD Europe 등 해외 전시로<br>브랜드 입지를 확대</h4>', '02.1 card 3')
          html = rep(html, '<h4>글로벌 B2B 확장을 전제로 한 플랫폼</h4>', '<h4>글로벌 B2B 확장을<br>전제로 한 플랫폼</h4>', '02.1 card 4')

          # 02.3 / 02.4 narrative
          html = rep(html,
              '<h3>방향성에 맞춰 모듈화를 위해,<br>기존 리소스를 기본 단위로 분해했습니다.</h3>',
              '<h3>방향성에서 추출한 연결과 확장에 착안하여,<br>모듈화를 위해 기존 리소스를 분해했습니다.</h3>',
              '02.3 title')
          html = rep(html,
              '<h3>같은 모듈을 제품과 성격에 따라 다시 조합해,<br>하나의 브랜드 안에서 서로 다른 아이덴티티를 만들었습니다.</h3>',
              '<h3>그리고 같은 모듈을 제품과 성격에 따라 다시 조합해,<br>하나의 브랜드 안에서 서로 다른 아이덴티티를 만들었습니다.</h3>',
              '02.4 title')

          # 03.2 remove captions + matte via clean variant
          old_032 = '<div class="hm-ds-media-gallery aimmo-wide-gallery aimmo-wide-gallery--stack hm-ds-subtitle-to-content" aria-label="AIMMO 해외 전시 브랜드 적용 사례"><figure class="hm-ds-media-gallery__item"><img src="./assets/image/work-archive/archive-aimmo-p030.webp" alt="AIMMO 해외 전시 브랜드 적용 사례 1" loading="lazy" decoding="async"><figcaption><h4>공간 전체에 같은 모듈과 컬러 규칙을 적용했습니다.</h4></figcaption></figure><figure class="hm-ds-media-gallery__item"><img src="./assets/image/work-archive/archive-aimmo-p032.webp" alt="AIMMO 해외 전시 브랜드 적용 사례 2" loading="lazy" decoding="async"><figcaption><h4>제품 메시지와 사인까지 같은 그래픽 언어로 연결했습니다.</h4></figcaption></figure></div>'
          new_032 = '<div class="hm-ds-media-gallery aimmo-wide-gallery aimmo-wide-gallery--clean aimmo-wide-gallery--stack hm-ds-subtitle-to-content" aria-label="AIMMO 해외 전시 브랜드 적용 사례"><figure class="hm-ds-media-gallery__item"><img src="./assets/image/work-archive/archive-aimmo-p030.webp" alt="AIMMO 해외 전시 브랜드 적용 사례 1" loading="lazy" decoding="async"></figure><figure class="hm-ds-media-gallery__item"><img src="./assets/image/work-archive/archive-aimmo-p032.webp" alt="AIMMO 해외 전시 브랜드 적용 사례 2" loading="lazy" decoding="async"></figure></div>'
          html = rep(html, old_032, new_032, '03.2 clean gallery')

          # 03.3 gallery controls + number/title caption structure
          old_033 = '<div class="hm-ds-media-gallery aimmo-wide-gallery hm-ds-subtitle-to-content" aria-label="AIMMO 공식 사이트 브랜드 경험"><figure class="hm-ds-media-gallery__item"><img src="./assets/image/work-archive/archive-aimmo-p033-v6.webp" alt="AIMMO 공식 사이트 브랜드 경험 더미 이미지" loading="lazy" decoding="async"><figcaption><h4>그래픽 언어를 공식 사이트 경험으로 확장했습니다.</h4></figcaption></figure></div>'
          new_033 = '<div class="hm-ds-media-gallery aimmo-wide-gallery aimmo-carousel-gallery hm-ds-subtitle-to-content" aria-label="AIMMO 공식 사이트 브랜드 경험"><figure class="hm-ds-media-gallery__item aimmo-carousel-gallery__item"><img src="./assets/image/work-archive/archive-aimmo-p033-v6.webp" alt="AIMMO 공식 사이트 브랜드 경험 더미 이미지" loading="lazy" decoding="async"><button class="aimmo-carousel-gallery__nav aimmo-carousel-gallery__nav--prev" type="button" aria-label="이전 이미지" disabled></button><button class="aimmo-carousel-gallery__nav aimmo-carousel-gallery__nav--next" type="button" aria-label="다음 이미지" disabled></button><figcaption><span>01</span><h4>그래픽 언어를 공식 사이트 경험으로 확장했습니다.</h4></figcaption></figure></div>'
          html = rep(html, old_033, new_033, '03.3 carousel gallery')

          # 04.1 metric labels without arrows
          html = rep(html, '<strong>BRAND↑</strong>', '<strong>BRAND</strong>', '04.1 BRAND label')
          html = rep(html, '<strong>VISIT↑</strong>', '<strong>VISIT</strong>', '04.1 VISIT label')

          # 04.2 exact four-line statement
          html = rep(html,
              '‘기존 리브랜딩 자산을 지키면서도 제품·웹·공간·사내 경험이<br>같은 원리로 확장되는 브랜드 시스템으로 발전시켰습니다.’',
              '‘기존 리브랜딩 자산을 지키면서도<br>제품·웹·공간·사내 경험이<br>같은 원리로 확장되는<br>브랜드 시스템으로 발전시켰습니다.’',
              '04.2 statement')

          # Project reflection exact requested narrative
          old_reflection = '브랜드 리뉴얼은 시각적인 요소를 얼마나 잘 만들고 가이드하느냐도 중요하지만, <strong>우리가 이미 무엇을 가지고 있는지 이해하고 그것을 어떻게 활용해 전달하려는 가치를 효율적으로 보여줄 것인지</strong> 역시 중요한 목표라는 것을 배웠습니다. 기존 자산을 새롭게 바라보고 확장해 전달하는 방법을 고민할 수 있었던 소중한 경험이었습니다.'
          new_reflection = '매번 새로 만들 순 없습니다. 그래서 리뉴얼보다 중요한 것은 기존 자산을 어떻게 활용하여 계속 작동하게 만드느냐가 중요합니다. 분석과 재창조를 통해 원리를 만들고 이를 변화 가능한 규칙으로 바꾸면 브랜드가 전달하는 메세지는 하나의 언어로 연결될 수 있다는 것을 배운 의미있는 작업이였습니다.'
          html = rep(html, old_reflection, new_reflection, 'project reflection')

          # Page-local CSS overrides, deliberately not promoted to the shared design system.
          marker = '/* AIMMO Graphic detail refinements — 2026-09-17 v5 */'
          if marker not in css:
              css += '''\n\n/* AIMMO Graphic detail refinements — 2026-09-17 v5 */\n\n/* 01.2 — fourth problem state becomes the terminal red state. */\nhtml body.aimmo-graphic-page #brand .aimmo-business-flow article:nth-of-type(4){\n  background:var(--hm-red,#D30202)!important;\n  border-color:var(--hm-red,#D30202)!important;\n}\nhtml body.aimmo-graphic-page #brand .aimmo-business-flow article:nth-of-type(4)>span,\nhtml body.aimmo-graphic-page #brand .aimmo-business-flow article:nth-of-type(4)>h4{\n  color:#fff!important;\n}\nhtml body.aimmo-graphic-page #brand .aimmo-business-flow article:nth-of-type(4)>p{\n  color:rgba(255,255,255,.60)!important;\n}\n\n/* 02.1 — keep the requested 80px breathing room between copy and the icon. */\nhtml body.aimmo-graphic-page #data .aimmo-company-signals>article p{\n  padding-right:0!important;\n}\nhtml body.aimmo-graphic-page #data .aimmo-company-signals>article .hm-ds-icon{\n  position:static!important;\n  display:block!important;\n  margin:80px 0 0 auto!important;\n}\n\n/* 03.3 — one-stage carousel presentation; controls remain visible for the gallery contract. */\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__item{\n  position:relative!important;\n}\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__nav{\n  position:absolute!important;\n  z-index:4!important;\n  top:50%!important;\n  width:44px!important;\n  height:44px!important;\n  margin:0!important;\n  padding:0!important;\n  border:1px solid rgba(255,255,255,.30)!important;\n  border-radius:50%!important;\n  background:rgba(0,0,0,.34)!important;\n  transform:translateY(-50%)!important;\n  opacity:1!important;\n  cursor:default!important;\n}\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__nav::before{\n  content:\"\";\n  position:absolute;\n  top:50%;\n  left:50%;\n  width:9px;\n  height:9px;\n  border-top:1px solid #fff;\n  border-right:1px solid #fff;\n}\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__nav--prev{left:24px!important}\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__nav--next{right:24px!important}\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__nav--prev::before{transform:translate(-35%,-50%) rotate(-135deg)}\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__nav--next::before{transform:translate(-65%,-50%) rotate(45deg)}\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__item>figcaption>span{\n  margin-bottom:10px!important;\n  color:var(--hm-blue)!important;\n  font-family:var(--hm-font-en)!important;\n  font-size:13px!important;\n  font-weight:400!important;\n  line-height:1.2!important;\n}\nhtml body.aimmo-graphic-page #journey .aimmo-carousel-gallery__item>figcaption>h4{\n  font-size:22px!important;\n}\n\n/* 04.1 — evidence rules use the same standard divider opacity as the subsection rhythm. */\nhtml body.aimmo-graphic-page #direction .aimmo-impact-grid>article{\n  border-top:1px solid var(--hm-line-default)!important;\n}\n'''

          html_path.write_text(html)
          css_path.write_text(css)
          PY

          rm .github/workflows/oneoff-aimmo-graphic-detail-2.yml
          git config user.name "studiods"
          git config user.email "garci@naver.com"
          git add aimmo-graphic.html design-system/components/aimmo-graphic-v2.css .github/workflows/oneoff-aimmo-graphic-detail-2.yml
          git commit -m "Refine AIMMO graphic narrative and gallery details"
          git push origin main
