name: Align Reuse uncertainty copy bottom right
on:
  push:
    paths:
      - .github/workflows/reuse-uncertainty-align.yml
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('design-system/components/reuse.css')
          t=p.read_text()
          t=t.replace('flex-direction:column!important;\n  gap:0!important;\n  max-width:none!important;\n  margin:auto 0 0!important;\n  color:var(--hm-blue)!important;', 'flex-direction:column!important;\n  align-items:flex-end!important;\n  gap:0!important;\n  width:100%!important;\n  max-width:none!important;\n  margin:auto 0 0!important;\n  text-align:right!important;\n  color:var(--hm-blue)!important;', 1)
          t=t.replace('html body.reuse-current .reuse-uncertainty-panel p span{\n  display:block!important;\n}', 'html body.reuse-current .reuse-uncertainty-panel p span{\n  display:block!important;\n  width:100%!important;\n  text-align:right!important;\n}', 1)
          p.write_text(t)
          p=Path('design-system/index.css'); t=p.read_text().replace('./components/reuse.css?v=20260907-18','./components/reuse.css?v=20260907-19'); p.write_text(t)
          p=Path('design-system/himart-system.css'); t=p.read_text().replace('./index.css?v=20260907-29','./index.css?v=20260907-30'); p.write_text(t)
          p=Path('himart-reuse.html'); t=p.read_text().replace('./design-system/himart-system.css?v=20260907-35','./design-system/himart-system.css?v=20260907-36'); p.write_text(t)
          PY
      - name: Verify
        run: |
          grep -q 'align-items:flex-end!important' design-system/components/reuse.css
          grep -q 'text-align:right!important' design-system/components/reuse.css
          grep -q 'reuse.css?v=20260907-19' design-system/index.css
          grep -q 'index.css?v=20260907-30' design-system/himart-system.css
          grep -q 'himart-system.css?v=20260907-36' himart-reuse.html
      - name: Commit
        run: |
          rm -f .github/workflows/reuse-uncertainty-align.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Align Reuse uncertainty copy bottom right'
          git push
