name: One-off AIMMO reflection source-of-truth fix
on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-aimmo-reflection.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix reflection source of truth
        run: |
          python - <<'PY'
          from pathlib import Path

          nav = Path('design-system/navigation.js')
          text = nav.read_text(encoding='utf-8')
          old = "reflection:'브랜드 리뉴얼보다 중요한 것은 기존 자산이 실제 접점에서 계속 작동하게 만드는 것이었습니다. <strong>형태의 원리를 정리하고 변주 가능한 규칙으로 바꾸면</strong> 제품·웹·전시가 하나의 언어로 연결될 수 있었습니다.'"
          new = "reflection:'매번 새로 만들 순 없습니다. 그래서 리뉴얼보다 중요한 것은 기존 자산을 어떻게 활용하여 계속 작동하게 만드느냐가 중요합니다. 분석과 재창조를 통해 <strong>원리를 만들고 이를 변화 가능한 규칙으로 바꾸면</strong> 브랜드가 전달하는 메세지는 하나의 언어로 연결될 수 있다는 것을 배운 의미있는 작업이였습니다.'"
          if old not in text:
              raise SystemExit('old AIMMO reflection registry text not found')
          text = text.replace(old, new, 1)

          old_mount = """    const main = document.querySelector('#live-main');\n    if (!main) return;\n\n    document.querySelectorAll('.hm-project-reflection,.hm-project-footer,footer.hm-footer').forEach(node => node.remove());"""
          new_mount = """    const main = document.querySelector('#live-main');\n    if (!main) return;\n\n    /* Page-authored reflection is the source of truth. The registry is only a fallback. */\n    const existingReflectionCopy = document.querySelector('.hm-project-reflection__copy')?.innerHTML.trim() || '';\n    document.querySelectorAll('.hm-project-reflection,.hm-project-footer,footer.hm-footer').forEach(node => node.remove());"""
          if old_mount not in text:
              raise SystemExit('mountProjectEndMatter anchor not found')
          text = text.replace(old_mount, new_mount, 1)
          old_output = '<p class="hm-project-reflection__copy">${project.reflection}</p>'
          new_output = '<p class="hm-project-reflection__copy">${existingReflectionCopy || project.reflection}</p>'
          if old_output not in text:
              raise SystemExit('reflection output anchor not found')
          text = text.replace(old_output, new_output, 1)
          nav.write_text(text, encoding='utf-8')

          html = Path('aimmo-graphic.html')
          h = html.read_text(encoding='utf-8')
          old_src = './design-system/navigation.js?v=20260908-1'
          new_src = './design-system/navigation.js?v=20260918-2'
          if old_src not in h:
              raise SystemExit('AIMMO navigation cache key not found')
          h = h.replace(old_src, new_src, 1)
          html.write_text(h, encoding='utf-8')
          PY
      - name: Verify fix
        run: |
          python - <<'PY'
          from pathlib import Path
          nav = Path('design-system/navigation.js').read_text(encoding='utf-8')
          html = Path('aimmo-graphic.html').read_text(encoding='utf-8')
          requested = '매번 새로 만들 순 없습니다. 그래서 리뉴얼보다 중요한 것은 기존 자산을 어떻게 활용하여 계속 작동하게 만드느냐가 중요합니다.'
          old = '브랜드 리뉴얼보다 중요한 것은 기존 자산이 실제 접점에서 계속 작동하게 만드는 것이었습니다.'
          assert requested in nav
          assert requested in html
          assert old not in nav
          assert 'existingReflectionCopy || project.reflection' in nav
          assert './design-system/navigation.js?v=20260918-2' in html
          print('verified')
          PY
      - name: Commit changes and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/oneoff-fix-aimmo-reflection.yml
          git add design-system/navigation.js aimmo-graphic.html .github/workflows/oneoff-fix-aimmo-reflection.yml
          git commit -m 'Fix AIMMO project reflection override'
          git push origin HEAD:main