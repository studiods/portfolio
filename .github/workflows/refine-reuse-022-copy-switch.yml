name: Refine Reuse 02.2 copy switch motion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-reuse-022-copy-switch.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply 02.2 circle scale, arrow and copy-switch motion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

