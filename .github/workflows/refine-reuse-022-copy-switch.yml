          proof_marker = '/* 02.1 circular proof map v4 — unframed groups, responsive type, proportional arrow. */'
          motion_marker = '/* 02.2 — focus-driven sequential confidence pulse. */'
          if layout_marker not in css or proof_marker not in css or motion_marker not in css:
              raise SystemExit('required 02.2 CSS markers not found')

          prefix, after_layout = css.split(layout_marker, 1)
          _, proof_and_motion = after_layout.split(proof_marker, 1)
          proof_body, _ = proof_and_motion.split(motion_marker, 1)

          new_layout = r'''/* 02.2 — Reuse purchase journey with confidence moments inserted into the ordinary flow. */
