name: Refine Reuse 02.1 grouped proof circles
on:
  push:
    paths:
      - '.github/workflows/refine-reuse-proof-bands.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply grouped proof layout
        shell: bash
        env:
          HTML_B64: 무엇을 수리·점검했는지 알 수 없다</h4></div>
      <div class="reuse-confidence-node reuse-proof-map__node reuse-proof-map__node--anxiety"><h4>이전 사용 흔적과 청결·위생이 걱정된다</h4></div>
    </div>
  </section>

  <div class="reuse-proof-map__arrow" aria-hidden="true">
    <svg viewBox="0 0 400 32" preserveAspectRatio="xMidYMid meet"><polyline points="0,0 200,32 400,0"></polyline></svg>
  </div>

  <section class="reuse-proof-band reuse-proof-band--solution" aria-label="확인 가능한 근거">
    <span class="reuse-proof-band__label">확인 가능한 근거</span>
    <div class="reuse-proof-band__nodes">
      <div class="reuse-confidence-node reuse-proof-map__node reuse-proof-map__node--solution"><h4>실사진 · 상태 등급 ·<br>기능 검수</h4></div>
      <div class="reuse-confidence-node reuse-proof-map__node reuse-proof-map__node--solution"><h4>기능 점검 · 2년 무상 보증 사전 노출 · 하이마트 판매 · 배송 · 설치 · A/S 연결</h4></div>
      <div class="reuse-confidence-node reuse-proof-map__node reuse-proof-map__node--solution"><h4>상품화·검수 과정과<br>점검 기준 공개</h4></div>
      <div class="reuse-confidence-node reuse-proof-map__node reuse-proof-map__node--solution"><h4>클리닝 · 세척<br>· 소독 과정 공개</h4></div>
    </div>
  </section>
</div>
          CSS_B64: 
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          html = base64.b64decode(Path('/dev/stdin').read_text()) if False else base64.b64decode(__import__('os').environ['HTML_B64']).decode()
          css = base64.b64decode(__import__('os').environ['CSS_B64']).decode()

          p=Path('himart-reuse.html'); t=p.read_text()
          start=t.find('<div class="reuse-proof-map hm-ds-subtitle-to-content"')
          source_start=t.find('\n<div class="hm-source hm-ds-source-note">SOURCE - 번개장터', start)
          if start<0 or source_start<0: raise SystemExit('02.1 markers not found')
          source_end=t.find('</div>', source_start)+len('</div>')
          t=t[:start]+html+t[source_end:]
          t=t.replace('./design-system/himart-system.css?v=20260907-38','./design-system/himart-system.css?v=20260907-39',1)
          p.write_text(t)

          p=Path('design-system/components/reuse-confidence.css'); c=p.read_text()
          pos=c.find('/* 02.1 circular proof map v1 */')
          if pos<0: raise SystemExit('proof CSS marker not found')
          p.write_text(c[:pos]+css)

          p=Path('design-system/index.css'); i=p.read_text()
          i=i.replace('HIMART Design System v3.8','HIMART Design System v3.9',1)
          i=i.replace('./components/reuse-confidence.css?v=20260907-6','./components/reuse-confidence.css?v=20260907-7',1)
          p.write_text(i)

          p=Path('design-system/himart-system.css'); s=p.read_text()
          s=s.replace('./index.css?v=20260907-33','./index.css?v=20260907-34',1)
          s=s.replace('HIMART Shared System v2.7','HIMART Shared System v2.8',1)
          p.write_text(s)
          PY
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          h=Path('himart-reuse.html').read_text(); c=Path('design-system/components/reuse-confidence.css').read_text()
          block=h.split('<div class="reuse-proof-map hm-ds-subtitle-to-content"',1)[1].split('</article>',1)[0]
          checks=[block.count('class="reuse-proof-map__arrow"')==1,'viewBox="0 0 400 32"' in block,'SOURCE - 번개장터 안전거래 조사' not in block,'실사진 · 상태 등급 ·<br>기능 검수' in block,'상품화·검수 과정과<br>점검 기준 공개' in block,'클리닝 · 세척<br>· 소독 과정 공개' in block,'2년 무상 보증 사전 노출' in block,'font-size:10px;' in c,'opacity:.30;' in c,'opacity:.60;' in c,'stroke:rgba(255,255,255,.30);' in c]
          print(checks)
          if not all(checks): sys.exit('verification failed')
          PY
      - name: Commit and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/refine-reuse-proof-bands.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Group Reuse 02.1 proof circles with single arrow"
          git push
