name: Refine Reuse 02.1 proof opacity and labels
on:
  push:
    paths:
      - '.github/workflows/refine-reuse-proof-opacity.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply requested styling
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('himart-reuse.html')
          h = p.read_text()
          old = '<svg viewBox="0 0 400 32" preserveAspectRatio="xMidYMid meet"><polyline points="0,0 200,32 400,0"></polyline></svg>'
          new = '<svg viewBox="0 0 300 48" preserveAspectRatio="xMidYMid meet"><polyline points="0,0 150,48 300,0"></polyline></svg>'
          assert old in h
          h = h.replace(old, new, 1)
          assert './design-system/himart-system.css?v=20260907-39' in h
          h = h.replace('./design-system/himart-system.css?v=20260907-39', './design-system/himart-system.css?v=20260908-40', 1)
          p.write_text(h)

          p = Path('design-system/components/reuse-confidence.css')
          c = p.read_text()
          marker = '/* 02.1 circular proof map v2 — grouped uncertainty and proof bands. */'
          assert marker in c
          head, block = c.split(marker, 1)
          block = block.replace('border-color:rgba(255,255,255,.30);', 'border-color:rgba(255,255,255,.40);', 1)
          block = block.replace('border-color:var(--hm-blue);', 'border-color:rgba(0,166,237,.40);', 1)
          block = block.replace('  top:18px;\n  left:50%;\n  transform:translateX(-50%);', '  top:0;\n  left:50%;\n  transform:translate(-50%,-50%);\n  padding:0 14px;\n  background:#000;', 1)
          block = block.replace('  font-size:10px;', '  font-size:12px;', 1)
          block = block.replace('color:rgba(255,255,255,.30);', 'color:rgba(255,255,255,.40);', 1)
          block = block.replace('reuse-proof-map__node--anxiety{\n  opacity:.30;', 'reuse-proof-map__node--anxiety{\n  opacity:1;', 1)
          block = block.replace('  color:#fff!important;', '  color:rgba(255,255,255,.60)!important;', 1)
          block = block.replace('reuse-proof-map__node--solution{\n  opacity:.60;', 'reuse-proof-map__node--solution{\n  opacity:1;', 1)
          block = block.replace('  width:400px;\n  height:32px;', '  width:300px;\n  height:48px;', 1)
          block = block.replace('stroke:rgba(255,255,255,.30);', 'stroke:rgba(255,255,255,.50);', 1)
          block = block.replace('width:min(400px,76vw);\n    height:32px;', 'width:min(300px,74vw);\n    height:48px;', 1)
          c = head + '/* 02.1 circular proof map v3 — grouped proof bands with cut labels. */' + block
          p.write_text(c)

          p = Path('design-system/index.css')
          i = p.read_text()
          assert './components/reuse-confidence.css?v=20260907-7' in i
          i = i.replace('HIMART Design System v3.9', 'HIMART Design System v4.0', 1)
          i = i.replace('./components/reuse-confidence.css?v=20260907-7', './components/reuse-confidence.css?v=20260908-8', 1)
          p.write_text(i)

          p = Path('design-system/himart-system.css')
          s = p.read_text()
          assert './index.css?v=20260907-34' in s
          s = s.replace('./index.css?v=20260907-34', './index.css?v=20260908-35', 1)
          s = s.replace('HIMART Shared System v2.8', 'HIMART Shared System v2.9', 1)
          p.write_text(s)
          PY
      - name: Verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          h = Path('himart-reuse.html').read_text()
          c = Path('design-system/components/reuse-confidence.css').read_text()
          i = Path('design-system/index.css').read_text()
          s = Path('design-system/himart-system.css').read_text()
          checks = [
            'viewBox="0 0 300 48"' in h,
            'points="0,0 150,48 300,0"' in h,
            'border-color:rgba(255,255,255,.40);' in c,
            'border-color:rgba(0,166,237,.40);' in c,
            'font-size:12px;' in c,
            'transform:translate(-50%,-50%);' in c,
            'background:#000;' in c,
            'reuse-proof-map__node--anxiety{\n  opacity:1;' in c,
            'color:rgba(255,255,255,.60)!important;' in c,
            'reuse-proof-map__node--solution{\n  opacity:1;' in c,
            'width:300px;\n  height:48px;' in c,
            'stroke:rgba(255,255,255,.50);' in c,
            './components/reuse-confidence.css?v=20260908-8' in i,
            './index.css?v=20260908-35' in s,
            './design-system/himart-system.css?v=20260908-40' in h,
          ]
          if not all(checks):
              raise SystemExit('verification failed')
          print('PASS - requested Reuse 02.1 styling verified')
          PY
      - name: Commit and clean workflow
        shell: bash
        run: |
          rm -f .github/workflows/refine-reuse-proof-opacity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Reuse 02.1 proof opacity and labels"
          git push
