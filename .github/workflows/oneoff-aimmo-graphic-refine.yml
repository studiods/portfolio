name: One-off AIMMO graphic refinement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-aimmo-graphic-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine AIMMO graphic page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          html_path = Path('aimmo-graphic.html')
          html = html_path.read_text(encoding='utf-8')

          html = html.replace('aimmo-graphic-v2.css?v=20260917-3', 'aimmo-graphic-v2.css?v=20260917-4')
          html = html.replace('portfolio-icons.svg?v=20260917-1#aimmo-', 'portfolio-icons.svg?v=20260917-2#aimmo-')

          old_impact = '''<div class="aimmo-impact-grid hm-ds-subtitle-to-content"><article class="is-metric"><strong>WOW</strong><h4>브랜드를 먼저 알아보기 시작했습니다.</h4><p>해외 전시와 계약 현장에서 제품 설명보다 먼저 브랜드 변화에 대한 반응이 나왔고, 브랜드를 대하는 태도와 기대 수준도 달라졌습니다.</p></article><article class="is-metric"><strong>EDGE</strong><h4>가격만으로 경쟁하지 않는 위치를 만들었습니다.</h4><p>가격 중심으로 비교되던 AI 데이터 시장에서 브랜드 인지도가 높아지며 기술과 경험까지 함께 평가받는 경쟁 우위를 만들었습니다.</p></article><article class="is-metric"><strong>VISIT↑</strong><h4>해외 행사 부스 방문이 눈에 띄게 늘었습니다.</h4><p>해외 전시에서 부스 방문과 상담 참여가 이전보다 크게 늘며 현장에서 달라진 관심도를 직접 확인할 수 있었습니다.</p></article></div>'''
          new_impact = '''<div class="aimmo-impact-grid hm-ds-subtitle-to-content"><article class="is-metric"><strong>BRAND↑</strong><h4>브랜드 변화가 먼저 보일 만큼 반응이 달라졌습니다.</h4><p>해외 전시와 계약 현장에서 제품 설명보다 먼저 브랜드 변화에 대한 반응이 나올 정도로 호응이 컸고, 브랜드를 대하는 태도와 기대 수준도 분명히 달라졌습니다.</p></article><article class="is-metric"><strong>EDGE</strong><h4>가격만으로 경쟁하지 않는 위치를 만들었습니다.</h4><p>가격만으로 비교되던 AI 데이터 시장에서 브랜드 인지도가 높아지며 기술·경험·브랜드를 함께 평가받는 경쟁 우위를 만들었습니다.</p></article><article class="is-metric"><strong>VISIT↑</strong><h4>해외 행사 부스 참여가 크게 늘었습니다.</h4><p>CES 등 해외 행사에서 부스 방문과 상담 참여 인원이 이전보다 크게 늘어 현장에서 달라진 관심도를 직접 확인했습니다.</p></article></div>'''
          if old_impact in html:
              html = html.replace(old_impact, new_impact)

          old_reflection = '''브랜드 리뉴얼은 시각 요소를 잘 만들고 가이드하는 것만큼, <strong>이미 가진 자산을 어떻게 활용해 전달하려는 가치를 효율적으로 보여줄 것인지</strong>가 중요하다는 것을 배웠습니다. 브랜드를 새로 만드는 것보다 가진 것을 이해하고 확장하는 방법을 고민한 소중한 경험이었습니다.'''
          new_reflection = '''브랜드 리뉴얼은 시각적인 요소를 얼마나 잘 만들고 가이드하느냐도 중요하지만, <strong>우리가 이미 무엇을 가지고 있는지 이해하고 그것을 어떻게 활용해 전달하려는 가치를 효율적으로 보여줄 것인지</strong> 역시 중요한 목표라는 것을 배웠습니다. 기존 자산을 새롭게 바라보고 확장해 전달하는 방법을 고민할 수 있었던 소중한 경험이었습니다.'''
          if old_reflection in html:
              html = html.replace(old_reflection, new_reflection)

          html_path.write_text(html, encoding='utf-8')

          css_path = Path('design-system/components/aimmo-graphic-v2.css')
          css = css_path.read_text(encoding='utf-8')

          tablet_block = '''@media(max-width:1180px) and (min-width:781px){\n  html body.aimmo-graphic-page #brand .aimmo-graphic-signal-grid{\n    grid-template-columns:repeat(2,minmax(0,1fr))!important;\n  }\n}\n\n'''
          css = css.replace(tablet_block, '')

          container_rule = '''/* 01.2 — keep 22px / 12px at the current circle size, then scale only below it. */\n@container (max-width:190px){\n  html body.aimmo-graphic-page #brand .aimmo-business-flow article h4{\n    font-size:clamp(16px,11cqi,22px)!important;\n  }\n  html body.aimmo-graphic-page #brand .aimmo-business-flow article p{\n    font-size:clamp(10px,6cqi,12px)!important;\n  }\n}\n\n'''
          marker = '/* 01.3 + chapter 02/03 — full-width gallery variant built on the shared gallery contract. */'
          if container_rule not in css and marker in css:
              css = css.replace(marker, container_rule + marker)

          css_path.write_text(css, encoding='utf-8')
          PY

          git config user.name "studiods"
          git config user.email "garci@naver.com"
          git add aimmo-graphic.html design-system/components/aimmo-graphic-v2.css
          git rm .github/workflows/oneoff-aimmo-graphic-refine.yml
          git commit -m "Finish AIMMO graphic detail refinements"
          git push
