name: Use single Ways video
on:
  push:
    paths:
      - '.github/workflows/ways-single-video.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace Ways sequences with one looping video
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Ways detail Hero: remove sequence source/transition trigger and loop ways_01 only.
          p=Path('himart-ways.html')
          t=p.read_text()
          old='''<video class="hm-movie-video hm-ds-hero__video" data-hm-video data-hm-video-sequence="./assets/ways_01.mp4|./assets/ways_02.mp4" muted playsinline preload="metadata" aria-hidden="true">'''
          new='''<video class="hm-movie-video hm-ds-hero__video" data-hm-video muted loop playsinline preload="metadata" aria-hidden="true">'''
          if old not in t:
              raise SystemExit('Ways Hero sequence markup not found')
          t=t.replace(old,new,1)
          p.write_text(t)

          # WORKS card: same rule — no sequence, ways_01 loops while the Works focus controller plays it.
          p=Path('works.html')
          t=p.read_text()
          old='''<video class="works-card-video" muted playsinline preload="metadata" data-works-video-sequence="./assets/ways_01.mp4|./assets/ways_02.mp4" aria-hidden="true"><source src="./assets/ways_01.mp4" type="video/mp4"></video>'''
          new='''<video class="works-card-video" muted loop playsinline preload="metadata" aria-hidden="true"><source src="./assets/ways_01.mp4" type="video/mp4"></video>'''
          if old not in t:
              raise SystemExit('Works Ways sequence markup not found')
          t=t.replace(old,new,1)
          p.write_text(t)
          PY
      - name: Verify single-video behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          ways=Path('himart-ways.html').read_text()
          works=Path('works.html').read_text()
          checks={
            'Ways Hero uses ways_01': './assets/ways_01.mp4' in ways,
            'Ways Hero no ways_02': './assets/ways_02.mp4' not in ways,
            'Ways Hero no sequence attribute': 'data-hm-video-sequence' not in ways,
            'Ways Hero loops single video': 'data-hm-video muted loop playsinline' in ways,
            'Works Ways uses ways_01': './assets/ways_01.mp4' in works,
            'Works no ways_02': './assets/ways_02.mp4' not in works,
            'Works no sequence attribute': 'data-works-video-sequence' not in works,
            'Works Ways loops single video': 'works-card-video" muted loop playsinline' in works,
          }
          failed=[]
          for name,ok in checks.items():
              print(('PASS' if ok else 'FAIL')+' - '+name)
              if not ok: failed.append(name)
          if failed:
              sys.exit(1)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/ways-single-video.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use ways_01 as the only Ways video"
          git push
