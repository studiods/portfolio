<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIMART — Wide Editorial Test Loader</title>
<style>
html{margin:0;min-height:100%;background:#000!important;color-scheme:dark}
body{margin:0;min-height:100%;background:#000!important;color:#fff;font-family:Arial,sans-serif}
.hm-wide-loader{min-height:100vh;background:#000}
</style>
</head>
<body>
<div class="hm-wide-loader" aria-hidden="true"></div>
<script>
(async()=>{
  'use strict';
  try{
    /*
      First-paint contract:
      - keep the initial canvas black;
      - allow the browser cache to serve the validated source document;
      - preload the current hero movie before non-critical editorial CSS;
      - never hide the whole document while below-the-fold narrative code initializes;
      - keep the legacy commerce visualization bundle off the critical rendering path.
    */
    const response=await fetch('./himart_backup_02/himart.html?wide-source=20260912-1',{cache:'default'});
    if(!response.ok)throw new Error('himart.html load failed');
    let html=await response.text();

    html=html
      .replace('<head>',
        '<head>' +
        '<style id="hm-critical-first-paint">html,body{margin:0!important;min-height:100%!important;background:#000!important;color-scheme:dark}#top{background:#000!important}.hm-ds-hero__video{background:#000!important}</style>' +
        '<link rel="preload" href="./assets/movies/himart_02.mp4" as="video" type="video/mp4">')
      .replace('<title>하이마트 온라인 구매여정 — Movie Test</title>','<title>하이마트 온라인 구매여정 — Wide Editorial Test</title>')
      .replace('./assets/himart_01.mp4','./assets/movies/himart_02.mp4')
      .replace('고객 인식과 실제 이용 흐름을 확인해,<br>구매 여정을 다시 정의했습니다.','고객 인식과 실제 이용 흐름을 확인해, 구매 여정을 다시 정의했습니다.')
      .replace('<link rel="stylesheet" href="./design-system/components/himart-commerce.css?v=20260907-4">','<link rel="stylesheet" href="./design-system/components/himart-commerce.css?v=20260907-4" media="print" onload="this.media=\'all\'">')
      .replace('./design-system/himart-system.css?v=20260907-27','./design-system/himart-system.css?v=20260912-5')
      .replace('./design-system/test-content-final.js?v=20260907-1','./design-system/test-content-final.js?v=20260909-3')
      .replace('</head>',
        '<link rel="stylesheet" href="./design-system/components/hero.css?v=20260908-7-wide">' +
        '<link rel="stylesheet" href="./design-system/components/wide-editorial-test.css?v=20260908-10-himart">' +
        '<link rel="stylesheet" href="./design-system/components/wide-editorial-himart-test.css?v=20260910-4">' +
        '<link rel="stylesheet" href="./design-system/components/wide-editorial-himart-polish-v5.css?v=20260909-5">' +
        '<link rel="stylesheet" href="./design-system/components/semantic-circle-typography.css?v=20260909-3">' +
        '<link rel="stylesheet" href="./design-system/components/editorial-layout-contract.css?v=20260912-9">' +
        '<link rel="stylesheet" href="./design-system/components/himart-fluid-content.css?v=20260910-5">' +
        '<link rel="stylesheet" href="./design-system/components/himart-fluid-responsive-guard.css?v=20260910-1">' +
        '<link rel="stylesheet" href="./design-system/components/major-section-rhythm.css?v=20260912-6">' +
        '<link rel="stylesheet" href="./design-system/components/gallery-rhythm.css?v=20260912-2">' +
        '<link rel="stylesheet" href="./design-system/components/project-end-matter.css?v=20260912-4">' +
        '</head>')
      .replace('<body class="','<body class="hm-wide-editorial-test hm-wide-himart-test ')
      .replace('./design-system/scramble-final.js?v=20260907-3','./design-system/scramble-final.js?v=20260909-himart-wide-4')
      .replace('./design-system/navigation.js?v=20260907-4','./design-system/navigation.js?v=20260912-7')
      .replace('</body>',
        '<script src="./design-system/himart-wide-editorial-adapter.js?v=20260912-3"><' + '/script>' +
        '</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.body.innerHTML='<div class="hm-wide-loader" style="display:grid;place-items:center;color:rgba(255,255,255,.45);font-size:12px">페이지를 불러오지 못했습니다.</div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
