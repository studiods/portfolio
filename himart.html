<style>
.himart-wide-test-page .wide-rise-target{opacity:0;transform:translateY(28px);transition:opacity .62s ease,transform .82s cubic-bezier(.2,.8,.2,1);will-change:opacity,transform}
.himart-wide-test-page .wide-rise-target.is-wide-rise-in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.himart-wide-test-page .wide-rise-target{opacity:1!important;transform:none!important;transition:none!important}}

<body class="himart-page-body himart-test-page himart-wide-test-page himart-prod-v16 himart-v18-loading">
<nav class="top"><div class="top-center"><a href="./index.html">Home</a><a href="./about.html">About</a><a href="./works.html" aria-current="page">Works</a><a href="./index.html#contact">Contact</a></div></nav>
<main id="live-main"><div class="hm-wrap" style="padding-top:180px;min-height:100vh"><p style="color:rgba(255,255,255,.55)">CASE LOADING…</p></div></main>
<script>
(async()=>{
  'use strict';
  const main=document.getElementById('live-main');
  const pool='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

  const textNodesFor=(el)=>{
    const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode(node){return node.nodeValue&&node.nodeValue.trim().length?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
    const nodes=[];let node;while((node=walker.nextNode()))nodes.push(node);return nodes;
  };

  const scrambleLargeTitle=(el)=>{
    if(!el||el.dataset.wideLargeScramblePlayed==='1')return;
    el.dataset.wideLargeScramblePlayed='1';
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const parts=textNodesFor(el).map(node=>({node,original:node.nodeValue}));
    const mutable=(ch)=>/[\p{L}\p{N}]/u.test(ch);
    const total=parts.reduce((sum,part)=>sum+[...part.original].filter(mutable).length,0);
    if(!total)return;
    const started=performance.now();
    const duration=Math.min(1450,650+total*13);
    const tick=(now)=>{
      const p=Math.min(1,(now-started)/duration),resolved=Math.floor(total*Math.pow(p,.72));
      let cursor=0;
      parts.forEach((part,pi)=>{part.node.nodeValue=[...part.original].map((ch,ci)=>{if(!mutable(ch))return ch;const idx=cursor++;if(idx<resolved||p>=1)return ch;return pool[(pi*29+ci*17+Math.floor(now/44))%pool.length]}).join('')});
      if(p<1)requestAnimationFrame(tick);else parts.forEach(part=>part.node.nodeValue=part.original);
    };
    requestAnimationFrame(tick);
  };

  const prepareWideMotion=()=>{
    main.querySelectorAll('.hm-section-no').forEach(el=>el.dataset.numberedGroupScramblePlayed='1');
    main.querySelectorAll('.data-card-head .hm-card-no,.data-card-head h3,.hm-subhead .hm-subno,.hm-subhead .hm-subtitle,.hm-subhead .forced-redesign-title,.data-bridge > .hm-card-no,.data-bridge > .data-bridge-title').forEach(el=>el.dataset.numberedGroupScramblePlayed='1');
    main.querySelectorAll('.flow-label').forEach(el=>el.dataset.flowLabelScramblePlayed='1');

    const riseTargets=[...main.querySelectorAll('.data-card-head h3,.hm-subhead .hm-subtitle,.hm-subhead .forced-redesign-title,.data-bridge > .data-bridge-title')];
    riseTargets.forEach(el=>el.classList.add('wide-rise-target'));
    if(matchMedia('(prefers-reduced-motion: reduce)').matches){riseTargets.forEach(el=>el.classList.add('is-wide-rise-in'));}
    else if('IntersectionObserver' in window){
      const rio=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){entry.target.classList.add('is-wide-rise-in');rio.unobserve(entry.target)}}),{threshold:.18,rootMargin:'0px 0px -6% 0px'});
      riseTargets.forEach(el=>rio.observe(el));
    }else riseTargets.forEach(el=>el.classList.add('is-wide-rise-in'));

    const hero=main.querySelector('.hm-title');
    if(hero){
      if('IntersectionObserver' in window){
        const hio=new IntersectionObserver(entries=>entries.forEach(entry=>{if(entry.isIntersecting){scrambleLargeTitle(entry.target);hio.disconnect()}}),{threshold:.2});
        hio.observe(hero);
      }else scrambleLargeTitle(hero);
    }
  };

  try{
    const html=await fetch('https://api.github.com/repos/studiods/portfolio/git/blobs/6824a76b15854f4608498951bd3f909373cc407b',{cache:'no-store'})
      .then(r=>{if(!r.ok)throw new Error('source load failed');return r.json()})
      .then(j=>{const bin=atob(j.content.replace(/\s/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)});
    const doc=new DOMParser().parseFromString(html,'text/html');
    const sourceMain=doc.querySelector('main');
    if(!sourceMain)throw new Error('main not found');
    main.innerHTML=sourceMain.innerHTML;
    const transform=document.createElement('script');
    transform.src='./himart-live-transform.js?v=d8f97ef';
    transform.onload=()=>{
      const refine=document.createElement('script');
      refine.src='./himart-wide-content-v4.js?v=c2283bd';
      refine.onload=()=>{
        const refineV5=document.createElement('script');
        refineV5.src='./himart-wide-refine-v5.js?v=134b62b';
        refineV5.onload=()=>{
          const refineV6=document.createElement('script');
          refineV6.src='./himart-wide-refine-v6.js?v=dd39321';
          refineV6.onload=()=>{
            const refineV7=document.createElement('script');
            refineV7.src='./himart-wide-refine-v7.js?v=61d2503';
            refineV7.onload=()=>{
              const refineV8=document.createElement('script');
              refineV8.src='./himart-wide-refine-v8.js?v=75a1915';
              refineV8.onload=()=>{
                const refineV9=document.createElement('script');
                refineV9.src='./himart-wide-refine-v9.js?v=4fc8b91';
                refineV9.onload=()=>{
                  const refineV12=document.createElement('script');
                  refineV12.src='./himart-wide-refine-v12.js?v=d30d68c';
                  refineV12.onload=()=>{
                    const refineV13=document.createElement('script');
                    refineV13.src='./himart-wide-refine-v13.js?v=259bb9c';
                    refineV13.onload=()=>{
                      const refineV14=document.createElement('script');
                      refineV14.src='./himart-wide-refine-v14.js?v=e0a226e';
                      refineV14.onload=()=>{
                        const refineV15=document.createElement('script');
                        refineV15.src='./himart-wide-refine-v15.js?v=d93725e';
                        refineV15.onload=()=>{
                          const prodV16=document.createElement('script');
                          prodV16.src='./himart-production-refine-v16.js?v=e8c6650';
                          prodV16.onload=()=>{
                            const prodV18=document.createElement('script');
                            prodV18.src='./himart-production-refine-v18.js?v=2c832c4';
                            prodV18.onload=()=>{
                              prepareWideMotion();
                              const boot=document.createElement('script');
                              boot.src='./himart-live-boot.js?v=9f74114';
                              document.body.appendChild(boot);
                            };
                            document.body.appendChild(prodV18);
                          };
                          document.body.appendChild(prodV16);
                        };
                        document.body.appendChild(refineV15);
                      };
                      document.body.appendChild(refineV14);
                    };
                    document.body.appendChild(refineV13);
                  };
                  document.body.appendChild(refineV12);
                };
                document.body.appendChild(refineV9);
              };
              document.body.appendChild(refineV8);
            };
            document.body.appendChild(refineV7);
          };
          document.body.appendChild(refineV6);
        };
        document.body.appendChild(refineV5);
      };
      document.body.appendChild(refine);
    };
    document.body.appendChild(transform);
  }catch(err){
    document.body.classList.remove('himart-v18-loading');
    document.body.classList.add('himart-v18-ready');
    main.innerHTML='<div class="hm-wrap" style="padding-top:180px;min-height:70vh"><h1 style="font-size:42px;font-weight:100">페이지를 불러오지 못했습니다.</h1><p style="color:rgba(255,255,255,.6)">잠시 후 다시 시도해 주세요.</p></div>';
    console.error(err);
  }
})();
</script>
