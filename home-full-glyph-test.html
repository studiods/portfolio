<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shin Dong Sik — Home Language Scramble Test</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    #homeFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
  </style>
</head>
<body>
  <iframe id="homeFrame" title="Home language scramble test"></iframe>

  <script>
  (() => {
    'use strict';

    const frame = document.querySelector('#homeFrame');

    function customHeroScramble(){
      'use strict';

      const hero = document.querySelector('#heroSequence');
      const quote = hero?.querySelector('.hero-quote');
      const definition = hero?.querySelector('.definition-copy');
      const quoteChars = quote ? [...quote.querySelectorAll('.fill-char')] : [];
      const definitionChars = definition ? [...definition.querySelectorAll('.fill-char')] : [];
      if (!hero || !quote || !definition || !quoteChars.length || !definitionChars.length) return;

      const ENGLISH = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
      const DIGITS = '0123456789';
      const SYMBOLS = Array.from('!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~±×÷°§¶•–—…');
      const SCRAMBLE_CYCLES = 3;

      /* Current production dwell x 1.10 exactly. */
      const QUOTE_SCRAMBLE_DWELL = 0.936 * 1.10;
      const DEFINITION_SCRAMBLE_DWELL = 0.864 * 1.10;

      const HERO = Object.freeze({
        quoteFillStart: 0,
        quoteFillEnd: 0.095,
        quoteHoldEnd: 0.245,
        quoteMorphEnd: 0.395,
        definitionRevealStartInMorph: 0.08
      });

      const quoteFinalChars = quoteChars.map(char => char.dataset.finalChar ?? char.textContent);
      const definitionFinalChars = definitionChars.map(char => char.dataset.finalChar ?? char.textContent);
      let widths = new WeakMap();
      let quoteWindowWasActive = false;
      let definitionWindowWasActive = false;

      const style = document.createElement('style');
      style.id = 'hero-language-scramble-test-style';
      style.textContent = `
        #heroSequence .fill-char[data-hero-direct-scramble="1"]{
          color:rgba(17,17,17,1)!important;
          display:inline!important;
          position:static!important;
          vertical-align:baseline!important;
          line-height:inherit!important;
          transform:none!important;
          translate:none!important;
        }
        #heroSequence .fill-char[data-hero-direct-scramble="1"]::before,
        #heroSequence .fill-char[data-hero-direct-scramble="1"]::after{
          content:none!important;
          display:none!important;
        }
      `;
      document.head.appendChild(style);

      const clamp = value => Math.max(0, Math.min(1, value));
      const phaseProgress = (value, start, end) => {
        if (end <= start) return value >= end ? 1 : 0;
        return clamp((value - start) / (end - start));
      };
      const easeInOut = value => {
        const t = clamp(value);
        return t * t * (3 - 2 * t);
      };
      const isKorean = char => /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(char || '');

      const languageGlyph = (finalChar, seed) => {
        if (isKorean(finalChar)) {
          const HANGUL_START = 0xAC00;
          const HANGUL_COUNT = 11172;
          return String.fromCodePoint(HANGUL_START + (Math.abs(seed) % HANGUL_COUNT));
        }
        return ENGLISH[Math.abs(seed) % ENGLISH.length];
      };

      /*
        Every glyph gets all three categories across its 3 random states.
        The starting category is rotated by character index so the sweep does
        not look mechanically patterned.
      */
      const scrambleGlyph = (finalChar, visibleIndex, cycle) => {
        const seed = visibleIndex * 37 + cycle * 53 + (finalChar?.codePointAt?.(0) || 0);
        const category = (cycle + visibleIndex) % 3;
        if (category === 0) return languageGlyph(finalChar, seed);
        if (category === 1) return DIGITS[Math.abs(seed) % DIGITS.length];
        return SYMBOLS[Math.abs(seed) % SYMBOLS.length];
      };

      const measureFinalWidth = (char, finalChar) => {
        if (widths.has(char)) return widths.get(char);
        const previousText = char.textContent;
        const previousSpacing = char.style.letterSpacing;
        char.textContent = finalChar;
        char.style.letterSpacing = '0px';
        const width = Math.max(0, char.getBoundingClientRect().width);
        char.textContent = previousText;
        char.style.letterSpacing = previousSpacing;
        widths.set(char, width);
        return width;
      };

      const showGlyph = (char, finalChar, glyph) => {
        const finalWidth = measureFinalWidth(char, finalChar);
        char.style.letterSpacing = '0px';
        char.textContent = glyph;
        const glyphWidth = Math.max(0, char.getBoundingClientRect().width);
        char.style.letterSpacing = `${(finalWidth - glyphWidth).toFixed(3)}px`;
        char.setAttribute('data-hero-direct-scramble', '1');
      };

      const restore = (char, finalChar) => {
        if (!char.hasAttribute('data-hero-direct-scramble')) return;
        char.textContent = finalChar;
        char.removeAttribute('data-hero-direct-scramble');
        char.style.removeProperty('letter-spacing');
      };

      const restoreAll = (chars, finalChars) => {
        chars.forEach((char, index) => restore(char, finalChars[index]));
      };

      /*
        Production uses one local slot per glyph. Here the random-state dwell is
        10% longer. Sweep length includes the expanded dwell, so the final glyph
        still resolves exactly at the end of the existing production reveal window.
      */
      const paintSequence = (chars, finalChars, progress, scrambleDwell) => {
        const visible = chars
          .map((char, domIndex) => ({ char, finalChar: finalChars[domIndex] }))
          .filter(entry => entry.finalChar.trim().length > 0);

        const sweepEnd = Math.max(scrambleDwell, (visible.length - 1) + scrambleDwell);
        const sweep = easeInOut(clamp(progress)) * sweepEnd;

        visible.forEach(({ char, finalChar }, visibleIndex) => {
          const local = sweep - visibleIndex;
          if (local <= 0 || local >= scrambleDwell) {
            restore(char, finalChar);
            return;
          }

          const cycle = Math.min(
            SCRAMBLE_CYCLES - 1,
            Math.floor((local / scrambleDwell) * SCRAMBLE_CYCLES)
          );
          showGlyph(char, finalChar, scrambleGlyph(finalChar, visibleIndex, cycle));
        });
      };

      const render = () => {
        const travel = Math.max(1, hero.offsetHeight - innerHeight);
        const heroTop = hero.getBoundingClientRect().top + scrollY;
        const p = clamp((scrollY - heroTop) / travel);

        const quoteProgress = phaseProgress(p, HERO.quoteFillStart, HERO.quoteFillEnd);
        const quoteWindowIsActive = quoteProgress > 0 && quoteProgress < 1;
        if (quoteWindowIsActive) {
          quoteWindowWasActive = true;
          paintSequence(quoteChars, quoteFinalChars, quoteProgress, QUOTE_SCRAMBLE_DWELL);
        } else if (quoteWindowWasActive) {
          restoreAll(quoteChars, quoteFinalChars);
          quoteWindowWasActive = false;
        }

        const quoteMorph = phaseProgress(p, HERO.quoteHoldEnd, HERO.quoteMorphEnd);
        const definitionProgress = phaseProgress(
          quoteMorph,
          HERO.definitionRevealStartInMorph,
          1
        );
        const definitionWindowIsActive = definitionProgress > 0 && definitionProgress < 1;
        if (definitionWindowIsActive) {
          definitionWindowWasActive = true;
          paintSequence(definitionChars, definitionFinalChars, definitionProgress, DEFINITION_SCRAMBLE_DWELL);
        } else if (definitionWindowWasActive) {
          restoreAll(definitionChars, definitionFinalChars);
          definitionWindowWasActive = false;
        }
      };

      let raf = 0;
      const requestRender = () => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = 0;
          render();
        });
      };

      addEventListener('scroll', requestRender, { passive: true });
      addEventListener('resize', () => {
        widths = new WeakMap();
        requestRender();
      }, { passive: true });
      requestRender();
    }

    const boot = async () => {
      const response = await fetch('./index.html?home-language-test=1', { cache:'no-store' });
      if (!response.ok) throw new Error(`index ${response.status}`);
      let html = await response.text();

      html = html.replace('</head>', '<base href="./"></head>');

      const originalHeroScript = /<script\s+src=["']\.\/home-hero-scramble-fix\.js\?v=\d+["']\s+defer><\/script>/i;
      const customCode = `addEventListener('DOMContentLoaded',()=>(${customHeroScramble.toString()})(),{once:true});`;
      const replacement = `<script>${customCode}<\/script>`;

      if (!originalHeroScript.test(html)) {
        throw new Error('Production Hero scramble script tag not found');
      }
      html = html.replace(originalHeroScript, replacement);

      frame.srcdoc = html;
    };

    boot().catch((error) => {
      console.error('[home-language-scramble-test]', error);
      frame.src = './index.html';
    });
  })();
  </script>
</body>
</html>
