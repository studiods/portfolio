<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shin Dong Sik — Home Scramble Symbols Test</title>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
    #homeFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
  </style>
</head>
<body>
  <iframe id="homeFrame" src="./index.html?scramble-test=symbols" title="Home scramble symbols test"></iframe>

  <script>
  (() => {
    'use strict';

    const frame = document.querySelector('#homeFrame');
    const SYMBOL_POOL = Array.from(
      '0123456789' +
      '!"#$%&\'()*+,-./:;<=>?@[\\]^_`{|}~' +
      '¡¿¢£¥€©®™°±×÷§¶•–—…“”‘’‹›«»'
    );

    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!win || !doc) return;

      const states = new WeakMap();
      const widths = new WeakMap();
      const ACTIVE_SELECTOR = '.live-scramble-glyph,[data-hero-direct-scramble="1"]';

      const charCode = (text) => {
        const cp = text?.codePointAt?.(0);
        return Number.isFinite(cp) ? cp : 0;
      };

      const ensureState = (el) => {
        let state = states.get(el);
        if (!state) {
          state = { count: 0, lastOutput: '' };
          states.set(el, state);
        }
        return state;
      };

      const finalWidth = (el) => {
        if (widths.has(el)) return widths.get(el);
        const finalChar = el.dataset.finalChar;
        if (!finalChar) return 0;

        const previousText = el.textContent;
        const previousSpacing = el.style.letterSpacing;
        el.style.letterSpacing = '0px';
        el.textContent = finalChar;
        const width = Math.max(0, el.getBoundingClientRect().width);
        el.textContent = previousText;
        el.style.letterSpacing = previousSpacing;
        widths.set(el, width);
        return width;
      };

      const pickSymbol = (raw, state) => {
        state.count += 1;
        const seed = charCode(raw) + state.count * 29;
        return SYMBOL_POOL[Math.abs(seed) % SYMBOL_POOL.length];
      };

      const adapt = (el) => {
        if (!(el instanceof win.Element) || !el.matches(ACTIVE_SELECTOR)) return;

        const state = ensureState(el);
        const raw = el.textContent || '';
        if (!raw || raw === state.lastOutput) return;

        const output = pickSymbol(raw, state);
        state.lastOutput = output;

        if (el.hasAttribute('data-hero-direct-scramble')) {
          const width = finalWidth(el);
          el.style.letterSpacing = '0px';
          el.textContent = output;
          const glyphWidth = Math.max(0, el.getBoundingClientRect().width);
          if (width > 0) {
            el.style.letterSpacing = `${(width - glyphWidth).toFixed(3)}px`;
          }
        } else {
          el.textContent = output;
        }
      };

      const scanMutationTarget = (target) => {
        if (target instanceof win.Element) {
          adapt(target);
          if (target.querySelectorAll) {
            target.querySelectorAll(ACTIVE_SELECTOR).forEach(adapt);
          }
          return;
        }
        if (target?.parentElement) adapt(target.parentElement);
      };

      const observer = new win.MutationObserver((mutations) => {
        mutations.forEach((mutation) => scanMutationTarget(mutation.target));
      });

      observer.observe(doc.documentElement, {
        subtree:true,
        attributes:true,
        childList:true,
        characterData:true,
        attributeFilter:['class','data-scramble','data-test-scramble','data-hero-direct-scramble']
      });

      doc.querySelectorAll(ACTIVE_SELECTOR).forEach(adapt);
      doc.documentElement.dataset.scrambleTestPool = 'numbers-symbols';
    });
  })();
  </script>
</body>
</html>
