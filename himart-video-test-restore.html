<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>하이마트 온라인 구매여정 · Video Hero Test</title>
<style>html,body{margin:0;background:#000;color:#fff}.boot{min-height:100vh;background:#000}</style>
</head>
<body><div class="boot" aria-hidden="true"></div>
<script>
(()=>{
  'use strict';

  const HERO_HTML=`<header class="hm-hero hm-video-hero-stage" id="top"><div class="hm-video-sticky" id="hmVideoSticky"><video class="hm-video-media" id="hmHeroVideo" src="./assets/video/himart_01.mp4" autoplay muted loop playsinline preload="auto"></video><div class="hm-video-overlay-base"></div><div class="hm-video-overlay-gradient"></div><div class="hm-video-overlay-scroll"></div></div></header>`;
  const style=`<style>.hm-video-hero-stage{height:200vh}.hm-video-sticky{position:sticky;top:0;height:100vh;overflow:hidden}.hm-video-media{width:100%;height:100%;object-fit:cover}.hm-video-overlay-base,.hm-video-overlay-gradient,.hm-video-overlay-scroll{position:absolute;inset:0}.hm-video-overlay-base{background:rgba(0,0,0,.7)}.hm-video-overlay-scroll{background:#000;opacity:var(--hm-video-blackout,0)}</style>`;
  document.body.innerHTML=HERO_HTML;
  document.head.insertAdjacentHTML('beforeend',style);
})();
</script>
</body>
</html>
