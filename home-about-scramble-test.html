<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Home Hero — About Scramble Scroll Test</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preload" href="./fonts/Averta-PE-Thin.otf" as="font" type="font/otf" crossorigin>
  <link rel="preload" href="./fonts/Averta-PE-Regular.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="./style.css?v=17">
  <link rel="stylesheet" href="./typography.css?v=7">
  <link rel="stylesheet" href="./type-overrides.css?v=18">
  <link rel="stylesheet" href="./home-fixes.css?v=52">
  <link rel="stylesheet" href="./home-test-fixes.css?v=18">
  <style>
    html,body{margin:0;min-height:100%;background:#fff}
    body{background:#fff}
    .about-home-scramble-test{position:relative;height:260vh;background:#fff}
    .about-home-scramble-test .hero-sticky{
      position:sticky!important;
      top:0!important;
      inset:auto!important;
      width:100%;
      height:100vh;
      min-height:100svh;
    }
    .about-home-scramble-test .hero-state-quote{
      opacity:1!important;
      visibility:visible!important;
      transform:none!important;
    }
    .about-home-scramble-test .hero-quote{visibility:visible!important}
    .about-home-scramble-test .about-scramble-char{color:rgba(17,17,17,1)}
    .about-home-scramble-test .quote-source-only{
      color:rgba(17,17,17,1)!important;
      opacity:1!important;
    }
    .test-progress{
      position:fixed;
      right:24px;
      bottom:20px;
      z-index:20;
      margin:0;
      font-family:var(--font-ui,"Averta PE",sans-serif);
      font-size:10px;
      line-height:1;
      letter-spacing:.04em;
      color:rgba(17,17,17,.38);
      pointer-events:none;
    }
    @media(max-width:768px){.test-progress{right:18px;bottom:18px}}
  </style>
</head>
<body class="home-test">
  <main>
    <section class="about-home-scramble-test" id="scrambleTest">
      <div class="hero-sticky">
        <div class="hero-state hero-state-quote">
          <div class="hero-quote" aria-label="THE ABILITY TO SIMPLIFY MEANS TO ELIMINATE THE UNNECESSARY SO THAT THE NECESSARY MAY SPEAK.">
            <span>THE ABILITY TO SIMPLIFY</span>
            <span>MEANS TO ELIMINATE</span>
            <span>THE UNNECESSARY SO THAT</span>
            <span>THE NECESSARY MAY SPEAK.</span>
          </div>
          <div class="quote-source-only">HANS HOFMANN</div>
        </div>
      </div>
    </section>
  </main>

  <p class="test-progress" aria-hidden="true">SCROLL 0%</p>

  <script src="./scramble-enhancements.js?v=9"></script>
  <script>
    (() => {
      'use strict';

      const SCRAMBLE_POOL = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const STAGGER_MS = 26;
      const CYCLE_MS = 96;
      const CYCLES = 3;

      const stage = document.querySelector('#scrambleTest');
      const quote = stage?.querySelector('.hero-quote');
      const progressLabel = document.querySelector('.test-progress');
      if (!stage || !quote) return;

      const clamp = (value) => Math.max(0, Math.min(1, value));

      const splitChars = () => {
        quote.querySelectorAll(':scope > span').forEach((line) => {
          Array.from(line.childNodes).forEach((node) => {
            if (node.nodeType !== Node.TEXT_NODE) return;
            const fragment = document.createDocumentFragment();
            Array.from(node.textContent).forEach((character) => {
              const span = document.createElement('span');
              span.className = 'about-scramble-char';
              span.textContent = character;
              span.dataset.finalChar = character;
              fragment.appendChild(span);
            });
            node.replaceWith(fragment);
          });
        });
        return Array.from(quote.querySelectorAll('.about-scramble-char'))
          .filter((char) => char.textContent.trim());
      };

      const chars = splitChars();
      const totalVirtualMs = Math.max(
        1,
        (Math.max(0, chars.length - 1) * STAGGER_MS) + (CYCLE_MS * CYCLES)
      );

      const render = (progress) => {
        const p = clamp(progress);
        const virtualNow = p * totalVirtualMs;

        chars.forEach((char, index) => {
          const elapsed = virtualNow - index * STAGGER_MS;

          if (elapsed < 0) {
            char.classList.remove('is-scrambling');
            char.removeAttribute('data-scramble');
            char.style.color = 'rgba(17,17,17,1)';
            return;
          }

          const cycle = Math.floor(elapsed / CYCLE_MS);
          if (cycle < CYCLES) {
            char.style.color = 'transparent';
            char.dataset.scramble = SCRAMBLE_POOL[(index * 17 + cycle * 13) % SCRAMBLE_POOL.length];
            char.classList.add('is-scrambling');
          } else {
            char.classList.remove('is-scrambling');
            char.removeAttribute('data-scramble');
            char.style.color = 'rgba(17,17,17,1)';
          }
        });

        if (progressLabel) progressLabel.textContent = `SCROLL ${Math.round(p * 100)}%`;
      };

      const getProgress = () => {
        const rect = stage.getBoundingClientRect();
        const travel = Math.max(1, stage.offsetHeight - window.innerHeight);
        return clamp(-rect.top / travel);
      };

      let ticking = false;
      const update = () => {
        render(getProgress());
        ticking = false;
      };

      const requestUpdate = () => {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(update);
      };

      render(getProgress());
      addEventListener('scroll', requestUpdate, { passive:true });
      addEventListener('resize', requestUpdate, { passive:true });
    })();
  </script>
</body>
</html>
