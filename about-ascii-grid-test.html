<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>About ASCII Grid Test — Shin Dong Sik</title>
  <style>
    :root{
      color-scheme:dark;
      background:#000;
      color:#f4f2ed;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#000}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      overflow:hidden;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    }
    .ascii-grid-test{
      position:relative;
      width:100vw;
      aspect-ratio:16/9;
      max-height:100vh;
      overflow:hidden;
      background:#000;
    }
    .ascii-grid-test-canvas{
      display:block;
      width:100%;
      height:100%;
      background:#000;
    }
    .ascii-grid-test-status{
      position:absolute;
      left:18px;
      bottom:16px;
      z-index:2;
      margin:0;
      font-size:10px;
      line-height:1;
      letter-spacing:.08em;
      color:rgba(244,242,237,.46);
      pointer-events:none;
    }
    @media(max-aspect-ratio:16/9){
      .ascii-grid-test{
        width:auto;
        height:100vh;
      }
    }
    @media(prefers-reduced-motion:reduce){
      .ascii-grid-test-status::after{content:' · REDUCED MOTION'}
    }
  </style>
</head>
<body>
  <main class="ascii-grid-test" aria-label="6개의 ASCII 초상 카드를 3열 2행으로 배열한 About 애니메이션 테스트">
    <canvas class="ascii-grid-test-canvas" aria-hidden="true"></canvas>
    <p class="ascii-grid-test-status">ASCII GRID TEST · LOADING</p>
  </main>

  <script src="./about-ascii-data.js?v=8"></script>
  <script src="./about-ascii-grid-test.js?v=1"></script>
</body>
</html>
