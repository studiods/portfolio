<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>About ASCII Single Test — Shin Dong Sik</title>
  <style>
    :root{
      color-scheme:dark;
      background:#000;
      color:#f4f2ed;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
    body{
      position:relative;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    }
    .ascii-grid-test{
      position:absolute;
      left:50%;
      top:50%;
      width:max(100vw,177.7778vh);
      height:max(100vh,56.25vw);
      aspect-ratio:16/9;
      transform:translate(-50%,-50%);
      overflow:hidden;
      background:#000;
    }
    .ascii-grid-test-canvas{
      display:block;
      width:100%;
      height:100%;
      background:#000;
    }
    .ascii-grid-test-status{
      position:absolute;
      left:18px;
      bottom:16px;
      z-index:2;
      margin:0;
      font-size:10px;
      line-height:1;
      letter-spacing:.08em;
      color:rgba(244,242,237,.46);
      pointer-events:none;
    }
    @media(prefers-reduced-motion:reduce){
      .ascii-grid-test-status::after{content:' · REDUCED MOTION'}
    }
  </style>
</head>
<body>
  <main class="ascii-grid-test" aria-label="기존 7개의 ASCII 초상을 원본 16대9 구도로 한 장씩 전체 화면에 보여주는 About 애니메이션 테스트">
    <canvas class="ascii-grid-test-canvas" aria-hidden="true"></canvas>
    <p class="ascii-grid-test-status">ASCII TEST · LOADING</p>
  </main>

  <script src="./about-ascii-data.js?v=8"></script>
  <script src="./about-ascii-grid-test.js?v=3"></script>
</body>
</html>
