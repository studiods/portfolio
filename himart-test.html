<main id="test-main"><div class="hm-wrap" style="padding-top:180px;min-height:100vh"><p style="color:rgba(255,255,255,.55)">TEST CASE LOADING…</p></div></main>

<script>
(async()=>{
'use strict';
const main=document.getElementById('test-main');
try{
  const html=await fetch('./himart.html?test-source=20260824',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('source load failed');return r.text()});
  const doc=new DOMParser().parseFromString(html,'text/html');
  const sourceMain=doc.querySelector('main');
  if(!sourceMain)throw new Error('main not found');
  main.innerHTML=sourceMain.innerHTML;

  const setHTML=(el,value)=>{if(el)el.innerHTML=value};
  const cardByNo=no=>[...main.querySelectorAll('#data .data-card')].find(card=>card.querySelector('.hm-card-no')?.textContent.includes(no));

  /* 02 / Data: from dashboard-like findings to behavioral signals. */
  const data=main.querySelector('#data');
  if(data){
    setHTML(data.querySelector('.hm-section-title'),'정성적으로 보였던 간극이 실제 이용 행동에서는<br>어떻게 나타나는지 확인했습니다.');
    const sectionDesc=data.querySelector('.hm-section-desc');
    if(sectionDesc)sectionDesc.textContent='고객의 말만으로 문제를 단정하지 않았습니다. 실제 이용 데이터에서 어디서 시작하고, 무엇을 탐색하며, 어느 순간 다음 행동이 약해지는지를 살펴봤습니다. 개별 수치를 평가하기보다, 고객이 실제로 하이마트를 이용하는 방식 안에서 반복되는 행동의 신호를 찾았습니다.';

    const c21=cardByNo('02.1');
    if(c21){setHTML(c21.querySelector('h3'),'고객의 구매 여정은 홈이 아니라,<br>서로 다른 유입 맥락에서 시작되고 있었습니다.');setHTML(c21.querySelector('.desc'),'2026년 상반기 통합 기준 AD가 52%로 가장 컸고 Direct 31%, CPS 10%, CRM 6%가 뒤를 이었습니다.<br>이 분포는 하나의 ‘홈 시작’을 전제하기보다, <strong>고객이 어디에서 어떤 이유로 들어왔는지를 다음 탐색까지 이어주는 경험이 중요하다는 신호</strong>로 보았습니다.');}

    const c22=cardByNo('02.2');
    if(c22){setHTML(c22.querySelector('h3'),'방문이 많다는 것만으로<br>구매 의도가 높다고 볼 수는 없었습니다.');setHTML(c22.querySelector('.desc'),'2026년 1~6월의 세션, 구매건수, 구매전환율을 같은 시간축에서 비교했습니다. 방문 규모는 4~5월이 컸지만 전환 효율은 2월이 가장 높았습니다.<br>단순한 트래픽보다 <strong>어떤 맥락으로 들어와 어떻게 다음 행동으로 이어지는지를 함께 봐야 한다는 신호</strong>였습니다.');}

    const c24=cardByNo('02.4');
    if(c24){setHTML(c24.querySelector('h3'),'검색은 보조 기능이 아니라,<br>구매 후보를 만들어가는 핵심 행동이었습니다.');setHTML(c24.querySelector('.desc'),'검색 시도는 2025년 상반기 2,644,012회에서 2026년 상반기 2,670,682회로 유지됐고, 전체 세션 대비 검색 비중은 3.26%에서 9.34%로 높아졌습니다.<br>고객은 상품을 바로 결정하기보다 <strong>검색을 반복하며 자신의 조건에 맞는 후보를 구체화</strong>하고 있었습니다.');}

    const c25=cardByNo('02.5');
    if(c25){setHTML(c25.querySelector('h3'),'홈에서도 고객은 콘텐츠를 소비하기보다<br>다음 목적지를 찾고 있었습니다.');setHTML(c25.querySelector('.desc'),'주요서비스 49.6%, 퀵메뉴 계열 33.8%에 클릭이 집중됐습니다.<br>고객 행동을 보면 홈의 역할은 많은 콘텐츠를 보여주는 데 있기보다, <strong>이미 가지고 있는 목적을 빠르게 다음 탐색으로 연결하는 데 더 가까웠습니다.</strong>');}

    const c26=cardByNo('02.6');
    if(c26){
      setHTML(c26.querySelector('h3'),'문제는 들어오지 않는 것이 아니라,<br>들어온 이후의 맥락이 다음 행동까지 이어지지 않는 데 있었습니다.');
      setHTML(c26.querySelector('.desc'),'기획전 시작 후 바로 종료가 52.2%로 가장 컸고, PDP 이용은 증가했지만 장바구니와 구매는 감소했습니다.<br>서로 다른 데이터이므로 하나의 원인으로 단정하지는 않았지만, <strong>랜딩 이후 탐색과 PDP 이후 구매 사이에 추가로 살펴봐야 할 단절 구간</strong>이 반복해서 나타났습니다.');
      c26.querySelector('.stackbar')?.classList.add('signal-stack');
      c26.querySelector('.stacklabels')?.classList.add('signal-stack-labels');
    }

    const flow=data.querySelector('.flow-area');
    if(flow){
      flow.classList.add('signal-flow');
      const bridge=document.createElement('div');
      bridge.className='data-bridge hm-reveal';
      bridge.innerHTML=`<span class="hm-card-no">02.7 / CONNECT THE SIGNALS</span><div class="data-bridge-grid"><article><span>01 / NOT A SINGLE CAUSE</span><h4>각 데이터가 같은 원인을<br>증명하는 것은 아니었습니다.</h4><p>유입, 검색, 홈 클릭, 랜딩과 PDP 이후 행동은 서로 다른 데이터입니다. 하나의 원인으로 묶기보다 각각이 보여주는 행동 특성을 따로 읽었습니다.</p></article><article><span>02 / COMMON PATTERN</span><h4>하지만 함께 놓고 보니<br>공통된 이용 패턴이 보였습니다.</h4><p>고객은 각기 다른 맥락으로 들어와 검색과 비교를 반복하며 후보를 만들었고, 화면이 바뀔 때마다 앞선 판단의 맥락이 충분히 이어지지 않았습니다.</p></article><article><span>03 / REFRAME</span><h4>그래서 홈이 아니라<br>여정의 연결을 문제로 봤습니다.</h4><p>특정 화면의 성과보다 유입 → 탐색 → 비교 → 구매 확신 → 설치·케어가 다음 행동으로 자연스럽게 이어지는지가 더 중요한 과제가 됐습니다.</p></article></div><div class="data-reframe"><span>CONCLUSION / PROBLEM REFRAME</span><h4>문제를 특정 화면의 개선이 아니라, <strong>유입 맥락 → 탐색 → 비교 → 구매 확신 → 설치·케어가 연결되는 전체 구매 여정의 문제</strong>로 다시 정의했습니다.</h4></div>`;
      flow.parentNode.insertBefore(bridge,flow);
      const flowHead=flow.querySelector('.flow-head');
      if(flowHead){setHTML(flowHead.querySelector('h3'),'데이터를 하나의 여정으로 연결해 보니,<br>다음 행동이 약해지는 위치가 더 명확해졌습니다.');const p=flowHead.querySelector('p');if(p)p.textContent='수치를 하나의 원인으로 묶기보다, 각 데이터에서 읽힌 행동의 신호를 실제 구매 흐름 위에 다시 놓았습니다. 그 결과 고객이 어디서 시작하든 앞선 맥락을 다음 판단으로 넘기는 연결이 핵심 과제로 보였습니다.';}
    }
  }

  /* 04 / Prototype: show only four high-impact implementations with actual screens. */
  const direction=main.querySelector('#direction');
  if(direction){
    const intro=direction.querySelector('.prototype-intro');
    if(intro){setHTML(intro.querySelector('h3'),'앞에서 정의한 결론이,<br>실제 화면에서는 어떻게 달라졌는지 보여줍니다.');const p=intro.querySelector('p');if(p)p.textContent='전체 화면을 나열하기보다, 문제 재정의와 UX 원칙이 가장 분명하게 드러나는 HOME, SRP, PDP, Hi Check 네 화면을 골랐습니다. 각각의 화면은 앞 단계의 맥락을 다음 판단으로 넘기는 역할을 기준으로 설계했습니다.';}
    const gallery=direction.querySelector('.phone-gallery');
    if(gallery){
      const list=document.createElement('div');
      list.className='prototype-case-list hm-reveal';
      list.innerHTML=`
      <article class="prototype-case"><div class="prototype-case-visual"><img src="./assets/himart-test-home.webp" alt="하이마트 홈 개편 화면"></div><div class="prototype-case-copy"><span class="hm-card-no">01 / HOME</span><h3>시작점을 하나로 가정하지 않고,<br>다음 행동으로 빠르게 연결하는 허브로 재정의했습니다.</h3><p>홈은 많은 정보를 진열하는 화면이 아니라, 사용자가 이미 가지고 들어온 목적을 다음 탐색으로 빠르게 연결하는 허브가 되어야 했습니다. 주요 서비스와 카테고리, 브랜드, 인증중고처럼 자주 찾는 목적지를 앞에 배치해 다시 탐색해야 하는 부담을 줄였습니다.</p><strong><b>STRATEGY APPLIED</b>유입 맥락 유지 · 목적지 연결 · 관심 기반 진입</strong></div></article>
      <article class="prototype-case"><div class="prototype-case-visual"><img src="./assets/himart-test-srp.webp" alt="하이마트 검색 결과 SRP 개편 화면"></div><div class="prototype-case-copy"><span class="hm-card-no">02 / SRP</span><h3>후보를 좁히는 과정에서<br>비교 기준이 흔들리지 않도록 설계했습니다.</h3><p>검색 결과에서는 단순히 상품을 나열하기보다 사용자가 조건을 유지한 채 빠르게 후보를 압축할 수 있어야 했습니다. 브랜드, 램, SSD, 화면 크기처럼 실제 구매 판단에 쓰이는 기준을 전면에 두고, 필터와 리스트 구조를 함께 정리해 검색에서 비교로 넘어갈 때 판단 기준이 끊기지 않게 했습니다.</p><strong><b>STRATEGY APPLIED</b>지속 필터 · 핵심 비교 기준 · 후보 압축</strong></div></article>
      <article class="prototype-case"><div class="prototype-case-visual"><img src="./assets/himart-test-pdp.webp" alt="하이마트 상품 상세 PDP 개편 화면"></div><div class="prototype-case-copy"><span class="hm-card-no">03 / PDP</span><h3>구매 확신에 필요한 핵심 정보를<br>하나의 판단 흐름으로 모았습니다.</h3><p>PDP에서 가격, 혜택, 배송과 설치 정보가 서로 떨어져 있으면 상품에 관심이 있어도 구매 직전 다시 확인해야 할 것이 많아집니다. 대표 가격과 혜택, 리뷰, 배송 조건을 중요한 순서로 정리해 PDP가 상품을 설명하는 화면을 넘어 구매 결정을 완료하는 곳이 되도록 했습니다.</p><strong><b>STRATEGY APPLIED</b>가격·혜택 명확화 · 배송/설치 조건 · 판단 우선순위</strong></div></article>
      <article class="prototype-case hicheck"><div class="prototype-case-visual"><img src="./assets/himart-test-hicheck.webp" alt="하이마트 Hi Check 생활 기준 정보 화면"></div><div class="prototype-case-copy"><span class="hm-card-no">04 / HI CHECK</span><h3>복잡한 스펙을 생활 언어로 번역해<br>전문성을 온라인에서도 이해할 수 있게 했습니다.</h3><p>가전의 용량, 전기료, 설치 크기처럼 숫자만으로 판단하기 어려운 정보를 실제 생활 기준으로 다시 설명했습니다. 오프라인 전문가 상담에서 얻던 ‘이 숫자가 나에게 어떤 의미인가’라는 해석을 디지털에서도 제공해, 스펙을 읽는 부담보다 선택의 근거가 먼저 보이도록 했습니다.</p><strong><b>STRATEGY APPLIED</b>전문성의 디지털화 · 생활 기준 해석 · 선택 근거</strong></div></article>`;
      gallery.replaceWith(list);
    }
  }

  /* Test marker, without disturbing the visual hierarchy. */
  const kicker=main.querySelector('.hm-kicker');
  if(kicker)kicker.textContent='LOTTE HIMART / COMMERCE JOURNEY / TEST NARRATIVE / 2026-08-24';

  /* Re-enable the same reveal/scramble/progress behavior after dynamic injection. */
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,pool='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  document.querySelectorAll('.js-scramble').forEach(el=>{const original=el.textContent;if(reduced)return;let played=false;const play=()=>{if(played)return;played=true;const chars=[...original],start=performance.now(),duration=Math.min(1500,560+chars.length*12);const tick=now=>{const p=Math.min(1,(now-start)/duration),resolved=Math.floor(chars.length*Math.pow(p,.72));el.textContent=chars.map((ch,i)=>ch===' '||ch==='\n'||ch==='\t'?ch:i<resolved?ch:pool[(i*17+Math.floor(now/46))%pool.length]).join('');p<1?requestAnimationFrame(tick):el.textContent=original};requestAnimationFrame(tick)};const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){play();io.disconnect()}}),{threshold:.3});io.observe(el)});
  const reveal=[...document.querySelectorAll('.hm-reveal')];if(reduced)reveal.forEach(n=>n.classList.add('is-in'));else{const rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-in');rio.unobserve(e.target)}}),{threshold:.1,rootMargin:'0px 0px -8% 0px'});reveal.forEach(n=>rio.observe(n));}
  const sections=[...document.querySelectorAll('[data-chapter]')],links=[...document.querySelectorAll('.hm-progress a')];const update=()=>{let active=0,best=1e9;sections.forEach((s,i)=>{const d=Math.abs(s.getBoundingClientRect().top-innerHeight*.33);if(d<best){best=d;active=i}});links.forEach((l,i)=>l.classList.toggle('is-active',i===active))};addEventListener('scroll',()=>requestAnimationFrame(update),{passive:true});update();
  const flowScript=document.createElement('script');flowScript.src='./himart-flow-line-sync-v1.js?v=0c01d96';document.body.appendChild(flowScript);
}catch(err){main.innerHTML='<div class="hm-wrap" style="padding-top:180px;min-height:70vh"><h1 style="font-size:42px;font-weight:100">테스트 페이지를 불러오지 못했습니다.</h1><p style="color:rgba(255,255,255,.6)">원본 페이지는 변경되지 않았습니다.</p><a href="./himart.html" style="color:#00A6ED">원본 페이지 열기 →</a></div>';console.error(err);}
})();
</script>
</body>
</html>
