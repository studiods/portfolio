<script>
(async()=>{
'use strict';
const main=document.getElementById('test-main');
try{
  const html=await fetch('./himart.html?test-source=20260824-1310',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('source load failed');return r.text()});

  const setHTML=(el,value)=>{if(el)el.innerHTML=value};

  const cardByNo=no=>[...main.querySelectorAll('#data .data-card')].find(card=>card.querySelector('.hm-card-no')?.textContent.includes(no));

  setText(main.querySelector('#brand .hm-section-desc'),'고객이 하이마트에 기대하는 전문성과 실제 온라인 경험의 간극을 먼저 확인했습니다.');
  setText(main.querySelector('#data .hm-section-desc'),'어디서 시작하고 무엇을 탐색하며, 어느 순간 다음 행동이 약해지는지를 실제 이용 데이터로 확인했습니다.');
  setText(main.querySelector('#direction .hm-section-desc'),'정의한 역할을 실제 화면으로 옮기고, 내부 검증을 통해 정보 위계와 연결 방식을 조정하고 있습니다.');

  /* 02 / DATA */

  let asisFlow=null;
  if(data){
    setHTML(data.querySelector('.hm-section-title'),'정성적으로 보였던 간극이 실제 이용 행동에서는<br>어떻게 나타나는지 확인했습니다.');

    const c21=cardByNo('02.1');
    if(c21){setHTML(c21.querySelector('h3'),'고객의 구매 여정은 홈이 아니라,<br>서로 다른 유입 맥락에서 시작되고 있었습니다.');setHTML(c21.querySelector('.desc'),'AD 52%, Direct 31%, CPS 10%, CRM 6%. 시작점이 하나가 아닌 만큼 <strong>유입 맥락을 다음 탐색까지 이어주는 것</strong>이 중요했습니다.');}

    const c24=cardByNo('02.4');

    const c25=cardByNo('02.5');

    const tobeFlow=wrap?[...wrap.children].find(el=>el.classList?.contains('flow-area')):null;
    const roleSection=wrap?[...wrap.querySelectorAll('.hm-subsection')].find(s=>s.querySelector('.hm-subno')?.textContent.includes('ROLE DEFINITION')):null;

    if(journeyHead){

      setText(journeyHead.querySelector('.hm-section-desc'),'데이터에서 확인한 단절을 실제 구매 흐름 위에 놓고, 다음 행동이 약해지는 지점과 각 단계의 역할을 다시 연결했습니다.');

        redesign.appendChild(tobeFlow);
        signals.insertAdjacentElement('afterend',redesign);

    }

    if(roleSection){
      setText(roleSection.querySelector('.hm-subno'),'03.3 / ROLE DEFINITION');
      setText(roleSection.querySelector('.hm-subcopy'),'각 화면이 앞선 맥락을 받아 다음 판단으로 넘기는 역할을 기준으로 정리했습니다.');
      const roleGrid=roleSection.querySelector('.role-grid');
      if(roleGrid){roleGrid.innerHTML=`
        <article class="role-card"><span class="hm-role-name">HOME</span><h4>다음 목적지를 여는 허브</h4><p>유입과 최근 행동을 기억하고 검색·카테고리·혜택으로 빠르게 연결합니다.</p><strong>최근 맥락 기억 · 빠른 목적지 연결 · 개인화 진입</strong></article>
        <article class="role-card"><span class="hm-role-name">SUBHOME / CATEGORY</span><h4>구매 목적 구체화</h4><p>품목보다 상황·공간·설치 조건을 중심으로 탐색 방향을 잡아줍니다.</p><strong>상황·목적 중심 탐색</strong></article>
        <article class="role-card"><span class="hm-role-name">SEARCH</span><h4>니즈를 후보로 전환</h4><p>추천검색과 필터로 모호한 요구를 실제 상품 후보로 구체화합니다.</p><strong>추천검색 · 동적 필터 · 탐색 가이드</strong></article>
        <article class="role-card"><span class="hm-role-name">SRP / PLP</span><h4>후보를 빠르게 압축</h4><p>가격·혜택·핵심 스펙을 같은 기준으로 비교하게 합니다.</p><strong>지속 필터 · 핵심 비교 기준</strong></article>
        <article class="role-card"><span class="hm-role-name">PDP</span><h4>구매 확신 완성</h4><p>가격·혜택·설치·리뷰를 한 흐름에서 판단하게 합니다.</p><strong>가격 · 설치 · 혜택 · 리뷰</strong></article>
        <article class="role-card"><span class="hm-role-name">CART / PAY</span><h4>조건을 확인하고 확정</h4><p>총액과 혜택, 배송·설치 조건을 고정해 최종 불확실성을 줄입니다.</p><strong>총액 · 혜택 · 설치 조건</strong></article>
        <article class="role-card"><span class="hm-role-name">INSTALL</span><h4>설치까지 구매 맥락 유지</h4><p>설치 일정과 조건, 폐가전 회수를 주문 흐름 안에서 이어 확인합니다.</p><strong>설치 일정 · 회수 · 진행 상태</strong></article>
        <article class="role-card"><span class="hm-role-name">CARE</span><h4>구매 이후 관계 연결</h4><p>보증·A/S·케어 정보를 구매 이후에도 하나의 관계로 이어갑니다.</p><strong>보증 · A/S · 평생Care</strong></article>`;}
    }
  }

  /* 04 / PROTOTYPE */
  const direction=main.querySelector('#direction');
  if(direction){
    direction.querySelector('.prototype-intro')?.remove();
    const gallery=direction.querySelector('.phone-gallery');
    if(gallery){
      const list=document.createElement('div');
      list.className='prototype-case-list hm-reveal';
      list.innerHTML=`
        <article class="prototype-case"><div class="prototype-case-visual"><img loading="lazy" decoding="async" src="./assets/himart-test-home.webp" alt="하이마트 홈 개편 화면"></div><div class="prototype-case-copy"><span class="hm-card-no">01 / HOME</span><h3>시작점을 하나로 가정하지 않고,<br>다음 행동으로 빠르게 연결하는 허브로 재정의했습니다.</h3><p>검색, 카테고리, 혜택과 주요 서비스를 빠르게 이어 유입 맥락을 다시 탐색하지 않게 했습니다.</p><strong><b>적용한 전략</b>유입 맥락 유지 · 목적지 연결 · 관심 기반 진입</strong></div></article>
        <article class="prototype-case"><div class="prototype-case-visual"><img loading="lazy" decoding="async" src="./assets/himart-test-srp.webp" alt="하이마트 검색 결과 SRP 개편 화면"></div><div class="prototype-case-copy"><span class="hm-card-no">02 / SRP</span><h3>검색 결과는 더 많이 보여주기보다,<br>더 빨리 좁히는 화면으로 바꿨습니다.</h3><p>검색에서 만든 조건을 유지하고 핵심 필터와 상품 정보를 함께 보여줘 후보를 빠르게 압축하게 했습니다.</p><strong><b>적용한 전략</b>지속 필터 · 핵심 비교 기준 · 후보 압축</strong></div></article>
        <article class="prototype-case"><div class="prototype-case-visual"><img loading="lazy" decoding="async" src="./assets/himart-test-pdp.webp" alt="하이마트 상품 상세 PDP 개편 화면"></div><div class="prototype-case-copy"><span class="hm-card-no">03 / PDP</span><h3>상품 정보는 나열이 아니라,<br>구매 확신을 만드는 흐름으로 재정리했습니다.</h3><p>가격·혜택·배송·설치 정보를 우선순위에 맞춰 연결해 구매 직전 다시 확인해야 하는 부담을 줄였습니다.</p><strong><b>적용한 전략</b>가격·혜택 명확화 · 배송/설치 조건 · 판단 우선순위</strong></div></article>
        <article class="prototype-case hicheck"><div class="prototype-case-visual"><div class="galaxy-ultra-mockup" aria-label="Galaxy S26 Ultra line drawing mockup"><div class="galaxy-ultra-screen"><img loading="lazy" decoding="async" src="./assets/himart-test-hicheck.webp" alt="하이마트 Hi Check 생활 기준 정보 화면"></div></div></div><div class="prototype-case-copy"><span class="hm-card-no">04 / HI CHECK</span><h3>전문 정보는 생활 기준으로 번역해,<br>이해 부담을 낮췄습니다.</h3><p>용량, 전기료, 설치 크기처럼 숫자만으로 판단하기 어려운 정보를 실제 생활 기준으로 풀어냈습니다.</p><strong><b>적용한 전략</b>전문성의 디지털화 · 생활 기준 해석 · 선택 근거</strong></div></article>`;
      gallery.replaceWith(list);
    }
  }

  const kicker=main.querySelector('.hm-kicker');
  if(kicker)kicker.textContent='LOTTE HIMART / COMMERCE JOURNEY / TEST NARRATIVE / 2026-08-24';

  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,pool='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  document.querySelectorAll('.js-scramble').forEach(el=>{const original=el.textContent;if(reduced)return;let played=false;const play=()=>{if(played)return;played=true;const chars=[...original],start=performance.now(),duration=Math.min(1500,560+chars.length*12);const tick=now=>{const p=Math.min(1,(now-start)/duration),resolved=Math.floor(chars.length*Math.pow(p,.72));el.textContent=chars.map((ch,i)=>ch===' '||ch==='\n'||ch==='\t'?ch:i<resolved?ch:pool[(i*17+Math.floor(now/46))%pool.length]).join('');p<1?requestAnimationFrame(tick):el.textContent=original};requestAnimationFrame(tick)};const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){play();io.disconnect()}}),{threshold:.3});io.observe(el)});
  const reveal=[...document.querySelectorAll('.hm-reveal')];if(reduced)reveal.forEach(n=>n.classList.add('is-in'));else{const rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('is-in');rio.unobserve(e.target)}}),{threshold:.1,rootMargin:'0px 0px -8% 0px'});reveal.forEach(n=>rio.observe(n));}
  const sections=[...document.querySelectorAll('[data-chapter]')],links=[...document.querySelectorAll('.hm-progress a')];const update=()=>{let active=0,best=1e9;sections.forEach((s,i)=>{const d=Math.abs(s.getBoundingClientRect().top-innerHeight*.33);if(d<best){best=d;active=i}});links.forEach((l,i)=>l.classList.toggle('is-active',i===active))};addEventListener('scroll',()=>requestAnimationFrame(update),{passive:true});update();
  const flowScript=document.createElement('script');flowScript.src='./himart-flow-line-sync-v1.js?v=0c01d96';document.body.appendChild(flowScript);
}catch(err){main.innerHTML='<div class="hm-wrap" style="padding-top:180px;min-height:70vh"><h1 style="font-size:42px;font-weight:100">테스트 페이지를 불러오지 못했습니다.</h1><p style="color:rgba(255,255,255,.6)">원본 페이지는 변경되지 않았습니다.</p><a href="./himart.html" style="color:#00A6ED">원본 페이지 열기 →</a></div>';console.error(err);}
})();
