<style id="wa-final-layout-lock">
/*
  WORK ARCHIVE final page lock.
  The previous page-specific archive CSS made both html and body vertical scrolling
  ancestors with overflow-y:auto. A sticky Hero then resolves against the wrong
  scroll container instead of the viewport, so the canonical Himart scroll-cover
  never visibly sticks while the next section rises over it.

  The canonical Himart page leaves the document body vertically visible and lets the
  root viewport own document scrolling. Restore that contract here and keep the Hero
  geometry identical to hero.css as a final fail-safe against legacy page rules.
*/
html{
  overflow-x:clip!important;
  overflow-y:visible!important;
}
html body.work-archive-page{
  overflow-x:clip!important;
  overflow-y:visible!important;
}
html body.work-archive-page #live-main{
  overflow:visible!important;
}
html body.work-archive-page #live-main>.wa-hero{
  position:sticky!important;
  top:0!important;
  z-index:1!important;
  width:100%!important;
  height:100svh!important;
  min-height:100svh!important;
  overflow:hidden!important;
}
html body.work-archive-page #live-main>.wa-archive-content{
  position:relative!important;
  z-index:2!important;
  background:#000!important;
}

/* Archive content follows the same wide rail as the Himart Hero bottom metadata. */
@media (min-width:1600px){
  html body.work-archive-page #live-main>.wa-archive-content>.hm-wrap{
    width:min(calc(100% - 128px),1600px)!important;
    max-width:1600px!important;
    margin-inline:auto!important;
  }
}

/* Match the compact WORKS title/menu geometry exactly: 32px / x40 / y32 desktop. */
html body.work-archive-page .wa-switcher{
  top:32px!important;
  left:var(--hm-inset-desktop,40px)!important;
  width:400px!important;
}
html body.work-archive-page .wa-switcher__toggle{
  display:inline-flex!important;
  align-items:flex-start!important;
  height:32px!important;
  margin:0!important;
  padding:0 48px 0 0!important;
  font-family:var(--hm-font-en-extralight,var(--hm-font-en))!important;
  font-size:32px!important;
  font-weight:200!important;
  line-height:1!important;
  letter-spacing:-.02em!important;
}
html body.work-archive-page .wa-switcher__toggle::after{
  right:8px!important;
  top:50%!important;
  width:7px!important;
  height:7px!important;
}
html body.work-archive-page .wa-switcher__menu{
  top:56px!important;
}

@media(max-width:780px){
  html body.work-archive-page .wa-switcher{
    top:24px!important;
    left:var(--hm-inset-mobile,18px)!important;
    width:calc(100vw - 36px)!important;
  }
  html body.work-archive-page .wa-switcher__toggle{
    height:32px!important;
    font-size:32px!important;
  }
  html body.work-archive-page .wa-switcher__menu{
    top:56px!important;
  }
}
</style>
